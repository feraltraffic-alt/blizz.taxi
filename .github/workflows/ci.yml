# Thin CI: all build logic lives in scripts/, so it runs the same locally and ports to GitLab CI.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server (Java 25, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: |
          set -o pipefail
          scripts/server-build.sh -ntp 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "^\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|Caused by|<<< FAIL" build.log \
            | grep -v "^\[ERROR\] *$" | head -200 > errors.txt || true
          split -l 20 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Maven build::${msg}"
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: server/target/surefire-reports

  contracts:
    name: Contracts (OpenAPI, event schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: scripts/contracts-lint.sh

  security:
    name: Security (dependencies, secrets, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ github.run_id }}
          restore-keys: trivy-
      - name: Repository
        shell: bash
        run: scripts/security-scan.sh | tee repo.txt
      - name: Server image
        if: always()
        shell: bash
        run: |
          docker build -q -t blizz-server:ci server
          scripts/security-scan.sh blizz-server:ci | tee image.txt
      - name: Report findings as annotations
        if: failure()
        shell: bash
        run: |
          cat repo.txt image.txt 2>/dev/null | head -60 | while IFS= read -r line; do
            echo "::error title=Security scan::${line}"
          done
