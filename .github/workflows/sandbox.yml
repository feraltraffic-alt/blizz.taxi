# Sandbox: the whole system with fictional data, started on demand in GitHub Actions (docs/sandbox.md).
#   scenario  — runs scripts/sandbox/scenarios/<name>.sh and keeps the request/response transcript
#   minutes   — then keeps the sandbox up that long behind a temporary public address (0 = stop at once)
# Start: Actions → Sandbox → Run workflow, or `gh workflow run sandbox.yml -f scenario=full-ride -f minutes=30`.
name: Sandbox

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario (scripts/sandbox/scenarios/<name>.sh): all, full-ride, cancellations, preorders, none"
        default: all
      minutes:
        description: "Keep the sandbox up with a public temporary address for N minutes (0-120)"
        default: "0"

permissions:
  contents: write # results go to the sandbox-runs branch, readable through the GitHub API

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: blizz
          POSTGRES_USER: blizz
          POSTGRES_PASSWORD: blizz-sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blizz -d blizz" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build the server
        run: cd server && mvn -B -q -ntp -DskipTests package
      - name: Start the server (profile sandbox)
        run: |
          cd server
          nohup java -jar target/server-*[0-9T].jar --spring.profiles.active=sandbox > ../server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          tail -100 ../server.log; exit 1
      - name: Run scenarios
        if: inputs.scenario != 'none'
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -o pipefail
          echo "# Sandbox transcript ($(date -u +%FT%TZ), ${GITHUB_SHA::7})" > transcript.md
          if [ "$SCENARIO" = all ]; then list=$(ls scripts/sandbox/scenarios/*.sh); else
            list="scripts/sandbox/scenarios/${SCENARIO}.sh"; fi
          failed=0
          for s in $list; do
            name=$(basename "$s" .sh)
            echo -e "\n# Scenario: $name" >> transcript.md
            if TRANSCRIPT=transcript.md bash "$s" 2> "stderr-$name.txt"; then echo "✅ $name" >> results.txt
            else
              echo "❌ $name" >> results.txt; failed=1
              msg=$( (tail -n 12 transcript.md; echo; tail -n 8 "stderr-$name.txt") | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Sandbox scenario $name failed::${msg}"
            fi
          done
          { echo "## Sandbox results"; cat results.txt; echo; echo "Full transcript: artifact **sandbox-transcript**."; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $failed
      - name: Keep it up behind a temporary public address
        if: always() && inputs.minutes != '0'
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          minutes=$(( MINUTES > 120 ? 120 : MINUTES ))
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            [ -n "$url" ] && break; sleep 1
          done
          {
            echo "## Sandbox is up for $minutes minutes"
            echo "- API: **$url**"
            echo "- SMS code: \`$url/sandbox/v1/otp?phone=%2B380671234567\`"
            echo "- Admin: login \`admin\`, password \`Sandbox-Admin-2026-ok\` (after a scenario ran; otherwise the start password \`Sandbox-Admin-2026\`, change it at the first sign-in)"
            echo "- Drivers: +380500000001…3 (Kyiv), +48500000001…2 (Warsaw); riders: any phone"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sandbox: $url"
          for i in $(seq 1 30); do
            curl -fsS "$url/readyz" >/dev/null 2>&1 && break; sleep 2
          done
          if curl -fsS "$url/readyz" >/dev/null 2>&1; then
            echo "::notice title=Sandbox is up for $minutes minutes::$url (admin / Sandbox-Admin-2026-ok)"
          else
            echo "::error title=Sandbox address does not answer::$url"; exit 1
          fi
          sleep $(( minutes * 60 ))
      - name: Publish results to the sandbox-runs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/sandbox/publish.sh
          echo "Results: branch **sandbox-runs**, runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-transcript
          path: |
            transcript.md
            server.log
          if-no-files-found: ignore
