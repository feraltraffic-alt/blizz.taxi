# Fault tests (REQ-QA-01, issue #146 part 2): the server is halted as kill -9 would in the middle of a payment, an
# outbox delivery and a driver's accept, and its database connections are cut; scripts/faults/run.sh checks that
# nothing is charged twice, lost or assigned twice.
# Each negative control builds the server with one guard broken (scripts/faults/breaks/<name>.patch); its job passes
# only when its own case fails, so a green run proves both that the guards hold and that the checks can see them go.
# Start: Actions → Faults → Run workflow, or `gh workflow run faults.yml -f break=all`.
name: Faults

on:
  push:
    branches: [claude/146-faults] # temporary: workflow_dispatch needs the file on main
  workflow_dispatch:
    inputs:
      break:
        description: "none (the guards as they are), payment, outbox, dispatch, database, or all of them"
        default: all

permissions:
  contents: write # results go to the sandbox-runs branch, as the sandbox's do

concurrency:
  group: faults-${{ github.ref }}
  cancel-in-progress: false

jobs:
  faults:
    name: "Faults (break: ${{ matrix.break }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        break: ${{ fromJSON((inputs.break == '' || inputs.break == 'all') && '["none","payment","outbox","dispatch","database"]' || format('["{0}"]', inputs.break)) }}
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_DB: blizz
          POSTGRES_USER: blizz
          POSTGRES_PASSWORD: blizz-sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blizz -d blizz" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: blizz
      PGPASSWORD: blizz-sandbox
      PGDATABASE: blizz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install tools
        run: |
          cd packages/contracts && npm ci --no-fund --no-audit
          pip install --quiet --break-system-packages "psycopg[binary]==3.2.10"
      - name: Break one guard (negative control)
        if: matrix.break != 'none'
        run: git apply --verbose "scripts/faults/breaks/${{ matrix.break }}.patch"
      - name: Build the server
        run: cd server && ./mvnw -B -q -ntp -DskipTests package
      - name: Run the fault cases
        id: run
        env:
          BREAK: ${{ matrix.break }}
        run: |
          set -o pipefail
          echo "# Fault tests ($(date -u +%FT%TZ), ${GITHUB_SHA::7}, break: $BREAK)" > transcript.md
          # The outbox case compares its consumers with a TripCompleted delivered without a crash: dispatch makes one.
          case "$BREAK" in
            none) export CASES="payment outbox dispatch database" ;;
            outbox) export CASES="dispatch outbox" ;;
            *) export CASES="$BREAK" ;;
          esac
          code=0
          TRANSCRIPT=transcript.md bash scripts/faults/run.sh 2> stderr.txt || code=$?
          for f in server-*.log; do [ -f "$f" ] && { echo "=== $f"; cat "$f"; } >> server.log; done
          tail -n 30 stderr.txt
          echo "## Faults (break: $BREAK)" >> "$GITHUB_STEP_SUMMARY"; cat results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$BREAK" = none ]; then
            exit $code
          fi
          # A negative control passes only when its own case failed and every case before it passed.
          others_passed=true
          for c in $CASES; do
            [ "$c" = "$BREAK" ] && break
            grep -q "✅ $c" results.txt 2>/dev/null || others_passed=false
          done
          # ... and for the reason the broken guard should cause, not for another.
          case "$BREAK" in
            payment) reason="The tip was charged 2 times" ;;
            outbox) reason="The live message went out 2 times" ;;
            dispatch) reason="The retry was not answered with the first result" ;;
            database) reason="A lost database connection was answered with 500" ;;
          esac
          if [ "$code" != 0 ] && $others_passed && ! grep -q "✅ $BREAK" results.txt 2>/dev/null \
              && grep -q "$reason" transcript.md; then
            echo "❌ $BREAK (expected: the broken guard was caught)" >> results.txt
            echo "::notice title=Negative control $BREAK::the broken guard was caught"
          else
            echo "::error title=Negative control $BREAK::the case passed with its guard broken"
            exit 1
          fi
      - name: Publish results to the sandbox-runs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DIR: ${{ github.run_id }}-${{ matrix.break }}
        run: scripts/sandbox/publish.sh
