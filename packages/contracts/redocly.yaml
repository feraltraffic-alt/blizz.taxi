extends:
  - recommended

apis:
  common:
    root: openapi/common.yaml
    rules:
      # A components library: everything here is meant to be referenced by the audience APIs.
      no-unused-components: off
  auth-v1:
    root: openapi/auth.v1.yaml
  rider-v1:
    root: openapi/rider.v1.yaml
  driver-v1:
    root: openapi/driver.v1.yaml
  admin-v1:
    root: openapi/admin.v1.yaml
  operator-v1:
    root: openapi/operator.v1.yaml
  config-v1:
    root: openapi/config.v1.yaml
  providers-v1:
    root: openapi/providers.v1.yaml
  reconciliation-sandbox:
    root: openapi/reconciliation-sandbox.yaml
  sandbox-v1:
    root: openapi/sandbox.v1.yaml
  retention-sandbox:
    root: openapi/retention-sandbox.yaml
