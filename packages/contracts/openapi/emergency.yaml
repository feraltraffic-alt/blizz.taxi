openapi: 3.1.0
info:
  title: Blizz Taxi — emergency access components
  version: 1.0.0
  description: >-
    Emergency access (REQ-SEC-10): a super admin gives another staff member extra permissions for at most eight hours
    with a reason. The grant ends by itself or is revoked; what the staff member did meanwhile is the staff activity
    log of that window.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths: {}
components:
  schemas:
    EmergencyGrant:
      type: object
      additionalProperties: false
      required: [id, staff_id, permissions, all_cities, city_ids, reason, granted_by, granted_at, expires_at,
                 revoked_at, revoked_by, revoke_reason, active]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        staff_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        permissions:
          type: array
          items:
            type: string
        all_cities:
          type: boolean
        city_ids:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"
        reason:
          type: string
        granted_by:
          $ref: "./common.yaml#/components/schemas/Uuid"
        granted_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        revoked_at:
          type: [string, "null"]
          format: date-time
        revoked_by:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        revoke_reason:
          type: [string, "null"]
        active:
          description: Not revoked and not expired when read.
          type: boolean

    EmergencyGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyGrant"

    GrantEmergencyAccess:
      type: object
      additionalProperties: false
      required: [command_id, permissions, all_cities, minutes, reason, password]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        permissions:
          description: From the permission catalog.
          type: array
          minItems: 1
          items:
            type: string
        all_cities:
          type: boolean
        city_ids:
          description: Required unless all_cities.
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"
        minutes:
          type: integer
          minimum: 5
          maximum: 480
        reason:
          type: string
          minLength: 10
          maxLength: 500
        password:
          description: The acting super admin's own password (REQ-ADM-10). Never stored or logged.
          type: string
          format: password
          maxLength: 128

    RevokeEmergencyAccess:
      type: object
      additionalProperties: false
      required: [command_id, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 1
          maxLength: 500

    EmergencyActivity:
      type: object
      additionalProperties: false
      required: [activity]
      properties:
        activity:
          description: The staff member's requests during the grant, oldest first, at most 1000.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [at, method, path, status, outcome]
            properties:
              at:
                $ref: "./common.yaml#/components/schemas/Timestamp"
              method:
                type: [string, "null"]
              path:
                type: [string, "null"]
              status:
                type: [integer, "null"]
              outcome:
                type: [string, "null"]
