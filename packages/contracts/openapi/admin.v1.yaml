  /api/admin/v1/retention:
    get:
      operationId: getRetention
      summary: Technical data retention by kind
      description: Requires retention.manage with all-city scope. Version 0 contains the defaults; each setting is a number of days and 0 keeps that kind forever.
      tags: [Settings]
      responses:
        "200":
          description: Current retention policy.
          content:
            application/json:
              schema:
                $ref: "./retention.yaml#/components/schemas/RetentionVersion"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    put:
      operationId: changeRetention
      summary: Change technical data retention
      description: Requires retention.manage with all-city scope. A named, idempotent command; expected_version prevents lost updates. Every version, author and reason is retained and audited. 0 keeps forever. Changes apply on the next cleanup run; deleted data cannot be restored.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./retention.yaml#/components/schemas/ChangeRetention"
      responses:
        "200":
          description: New retention version, or the stored outcome of the same command.
          content:
            application/json:
              schema:
                $ref: "./retention.yaml#/components/schemas/RetentionVersion"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/settings:
    get:
      operationId: getServiceSettings
      summary: Service settings in force
      description: Version 0 with the defaults until the first change. Needs settings.manage.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsVersion"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: changeServiceSettings
      summary: Change the brand, languages or the call mode
      description: |
        A new version with author and reason (REQ-TEN-06). Colours are checked for contrast (4.5:1). Calls
        VIA_SERVICE_NUMBERS need the service phone; note that DIRECT leaves the other party's number in the
        phone's call log (REQ-SEC-04), which the admin panel shows when switching.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSettings"
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsVersion"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/feature-flags:
    get:
      operationId: listFeatureFlags
      summary: Feature flags of the service
      description: |
