openapi: 3.1.0
info:
  title: Blizz Taxi — Admin panel API
  version: 1.0.0
  description: |
    API of the admin panel (/api/admin/v1, REQ-API-02); tokens of the admin audience only, from
    /auth/v1/staff/sign-in. Functions are ticked per admin or operator by a super admin; a super admin has
    all of them (owner decision 27.10.2026). Until the initial password is changed, everything except
    /me and /me/password returns 403.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /api/admin/v1/me:
    get:
      operationId: getAdminMe
      summary: The signed-in staff member
      description: |
        effective_permissions is what the UI may show: every function for a super admin, the ticked ones otherwise.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/admin/v1/me/password:
    post:
      operationId: changeAdminPassword
      summary: Change the own password
      description: |
        Required after the first sign-in and after a reset. 401 when the current password is wrong.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/permissions:
    get:
      operationId: listPermissions
      summary: Functions that can be ticked
      description: |
        The checkbox list for admins and operators.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCatalog"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/admin/v1/staff:
    get:
      operationId: listStaff
      summary: All staff
      description: |
        Super admin only.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createStaff
      summary: Add a staff member
      description: |
        Super admin only. First and last name, at least one contact (phone, e-mail, Telegram), login, initial
        password (must be changed at the first sign-in), role, ticked functions and cities. A taken login → 409.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaff"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}:
    get:
      operationId: getStaff
      summary: One staff member
      description: |
        A super admin reads anyone; others only themselves.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/staff/{staff_id}/update:
    post:
      operationId: updateStaff
      summary: Change names, contacts, role, functions or cities
      description: |
        Super admin only. The last active super admin cannot lose the role.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/suspend:
    post:
      operationId: suspendStaff
      summary: Suspend
      description: |
        Signs the member out everywhere. The last active super admin cannot be suspended.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/restore:
    post:
      operationId: restoreStaff
      summary: Restore a suspended member
      description: |
        Super admin only.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/reset-password:
    post:
      operationId: resetStaffPassword
      summary: Set a temporary password
      description: |
        Unlocks the account and signs it out everywhere; the member must change the password at the next sign-in.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers:
    get:
      operationId: listDriversForReview
      summary: Review queue
      description: Drivers in a review status (default IN_REVIEW — the queue), oldest first. Needs driver.review.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: status
          in: query
          schema:
            type: string
            enum: [NOT_SUBMITTED, IN_REVIEW, CHANGES_REQUIRED, APPROVED, REJECTED, SUSPENDED, EXPIRED]
            default: IN_REVIEW
        - name: after
          in: query
          description: Next page — since of the last driver of the previous page.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/drivers/{driver_id}:
    get:
      operationId: getDriverReviewCase
      summary: A driver with documents, vehicles and the history of decisions
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCase"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/drivers/{driver_id}/documents/{document_id}/file:
    get:
      operationId: getDriverDocumentFile
      summary: The scan of a driver's document
      description: Private, not cached; every opening is audited (REQ-SEC-07). Needs driver.review.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: document_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: The file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/drivers/{driver_id}/decision:
    post:
      operationId: decideDriverReview
      summary: Approve, request changes or reject
      description: IN_REVIEW only, reason required. On APPROVE the given vehicle classes are granted; otherwise rejected_documents tell the driver what to replace.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionCommand"
      responses:
        "200":
          description: The driver after the decision.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers/{driver_id}/suspend:
    post:
      operationId: suspendDriver
      summary: Suspend an approved driver
      description: No new orders; a trip in progress is not interrupted (REQ-DS-01). Reason required.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewChange"
      responses:
        "200":
          description: The driver after the decision.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers/{driver_id}/reinstate:
    post:
      operationId: reinstateDriver
      summary: Reinstate a suspended driver
      description: SUSPENDED → APPROVED, reason required.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewChange"
      responses:
        "200":
          description: The driver after the decision.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/cities:
    get:
      operationId: listCities
      summary: Cities
      description: All states; the boundary as GeoJSON. Needs geo.manage.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: state
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createCity
      summary: Create a city draft
      description: Boundary as a GeoJSON Polygon or MultiPolygon (WGS84). Publish it to put it in service.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCity"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/cities/{city_id}/publish:
    post:
      operationId: publishCity
      summary: Publish a city
      description: Versioned; reason required.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/cities/{city_id}/archive:
    post:
      operationId: archiveCity
      summary: Archive a city
      description: Versioned; reason required.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/zones/{zone_id}/publish:
    post:
      operationId: publishZone
      summary: Publish a zone
      description: Versioned; reason required.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: zone_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/zones/{zone_id}/archive:
    post:
      operationId: archiveZone
      summary: Archive a zone
      description: Versioned; reason required.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: zone_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/cities/{city_id}/zones:
    get:
      operationId: listZones
      summary: Zones of a city
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createZone
      summary: Create a zone draft
      description: Boundary as GeoJSON; type e.g. AIRPORT, STATION.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZone"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRevision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/cities/{city_id}/addresses:
    get:
      operationId: listOwnAddresses
      summary: Own addresses of a city
      description: Text fragment match; hidden ones when include_hidden. Needs geo.manage for the city.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: text
          in: query
          schema:
            type: string
        - name: include_hidden
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/admin/v1/addresses:
    post:
      operationId: createOwnAddress
      summary: Add an own address
      description: House number parsed structurally (2 ≠ 26); entrances are separate records.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddress"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/addresses/{address_id}:
    get:
      operationId: getOwnAddress
      summary: One own address, hidden included
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: address_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/admin/v1/addresses/{address_id}/update:
    post:
      operationId: updateOwnAddress
      summary: Change an own address
      description: Versioned; history and audit.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: address_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddress"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/addresses/{address_id}/aliases:
    post:
      operationId: addOwnAddressAlias
      summary: Add an alias
      description: An alias in another language finds the same address.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: address_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAlias"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/addresses/{address_id}/hide:
    post:
      operationId: hideOwnAddress
      summary: Hide an address
      description: Hidden addresses are not offered to riders.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: address_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/addresses/{address_id}/restore:
    post:
      operationId: restoreOwnAddress
      summary: Restore a hidden address
      description: Back in search.
      tags: [Geography]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: address_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoChange"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/logs/activity:
    get:
      operationId: listStaffActivity
      summary: What staff did, by role
      description: |
        Every request of every staff member to the admin and operator APIs (reads too) and every sign-in attempt,
        newest first, with the role at that moment (owner decision 27.10.2026). Bodies are never stored — the
        path template and its ids say what was touched. Needs audit.view.
      tags: [Logs]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: role
          in: query
          description: Staff role at the moment of the action.
          schema:
            $ref: "#/components/schemas/Role"
        - name: staff_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: from
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: to
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: before
          in: query
          description: Next page — occurred_at of the last entry of the previous page.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: kind
          in: query
          schema:
            type: string
            enum: [REQUEST, SIGN_IN]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/logs/changes:
    get:
      operationId: listStaffChanges
      summary: What staff changed, by role
      description: |
        The audit log of staff changes (orders, drivers, cities, addresses, tariffs, finance, staff, chat reads)
        with before/after, reason and the role at that moment, newest first. Needs audit.view.
      tags: [Logs]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: role
          in: query
          description: Staff role at the moment of the action.
          schema:
            $ref: "#/components/schemas/Role"
        - name: staff_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: from
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: to
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: before
          in: query
          description: Next page — occurred_at of the last entry of the previous page.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: action
          in: query
          schema:
            type: string
            examples: [order.cancel]
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesPage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

tags:
  - name: Geography
    description: Cities, zones and own addresses (section 14), geo.manage
  - name: Drivers
    description: Driver review (section 6), driver.review
  - name: Logs
    description: Logs of all staff actions, by role
  - name: Me
    description: The signed-in staff member
  - name: Staff
    description: Staff accounts, roles and functions (super admin)

components:
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    GeoJsonPolygon:
      description: GeoJSON Polygon or MultiPolygon, WGS84 (longitude, latitude).
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array

    GeoRevision:
      type: object
      additionalProperties: false
      required: [id, state, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64

    GeoChange:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string

    City:
      type: object
      additionalProperties: false
      required: [id, code, name, currency, timezone, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          examples: [Europe/Warsaw]
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    CityList:
      type: object
      additionalProperties: false
      required: [cities]
      properties:
        cities:
          type: array
          items:
            $ref: "#/components/schemas/City"

    CreateCity:
      type: object
      additionalProperties: false
      required: [command_id, code, name, currency, timezone, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          description: Higher wins where cities overlap.
          type: integer
        reason:
          type: string

    Zone:
      type: object
      additionalProperties: false
      required: [id, city_id, type, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    ZoneList:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    CreateZone:
      type: object
      additionalProperties: false
      required: [command_id, type, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          type: integer
        reason:
          type: string

    AddressData:
      type: object
      additionalProperties: false
      required: [city_id, kind, label, language, pickup]
      properties:
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        kind:
          type: string
          enum: [HOUSE, PLACE, ENTRANCE]
        label:
          type: string
        language:
          type: string
          examples: [uk]
        street:
          type: [string, "null"]
        house_raw:
          type: [string, "null"]
          examples: ["2А"]
        building:
          type: [string, "null"]
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        instructions:
          type: [string, "null"]
        override:
          description: Opaque link to a provider object this own address replaces (Q-08); no provider content.
          type: [object, "null"]
          properties:
            provider:
              type: string
            object_id:
              type: string

    OwnAddress:
      type: object
      required: [id, data, source, visibility, version, aliases]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        house:
          type: object
          description: Parsed house number, suffix and building.
        source:
          type: string
        visibility:
          type: string
          enum: [ACTIVE, HIDDEN]
        version:
          type: integer
          format: int64
        aliases:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              language:
                type: string

    AddressList:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/OwnAddress"

    CreateAddress:
      type: object
      additionalProperties: false
      required: [command_id, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    UpdateAddress:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    AddAlias:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, alias, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        alias:
          type: object
          required: [label, language]
          properties:
            label:
              type: string
            language:
              type: string
        reason:
          type: string

    ReviewItem:
      type: object
      additionalProperties: false
      required: [driver_id, status, since, version]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        name:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        status:
          type: string
        since:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        version:
          type: integer
          format: int64

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [drivers]
      properties:
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"

    ReviewEvent:
      type: object
      additionalProperties: false
      required: [from, to, actor_type, reason, at]
      properties:
        from:
          type: string
        to:
          type: string
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ReviewCase:
      type: object
      additionalProperties: false
      required: [profile, history]
      properties:
        profile:
          $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        phone:
          type: [string, "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvent"

    ReviewDecisionCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, decision, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        decision:
          type: string
          enum: [APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type: string
          maxLength: 1000
        vehicle_classes:
          description: Classes granted to the submitted vehicles on APPROVE, e.g. STANDARD.
          type: array
          items:
            type: string
        rejected_documents:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    ReviewChange:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 1000

    ActivityEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, kind, audience]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        kind:
          type: string
          enum: [REQUEST, SIGN_IN]
        staff_id:
          type: [string, "null"]
          format: uuid
          description: Null for a request without a valid staff token or a sign-in with an unknown login.
        staff_login:
          type: [string, "null"]
        role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        audience:
          type: string
          enum: [admin, operator]
        method:
          type: [string, "null"]
        path:
          description: Path template, e.g. /api/admin/v1/staff/{staff_id}/suspend.
          type: [string, "null"]
        resource_ids:
          description: "Values of the path template, e.g. staff_id."
          type: object
          additionalProperties:
            type: string
        status:
          type: [integer, "null"]
        outcome:
          description: OK / HTTP_4xx for requests; SUCCESS, BAD_CREDENTIALS, LOCKED, NOT_ACTIVE for sign-ins.
          type: [string, "null"]
        duration_ms:
          type: [integer, "null"]
        client_ip:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
          format: uuid

    ActivityPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"

    Change:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_type, action, resource_type, correlation_id]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        actor_role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        before:
          description: JSON snapshot before the change, as text.
          type: [string, "null"]
        after:
          description: JSON snapshot after the change, as text.
          type: [string, "null"]
        correlation_id:
          type: string
          format: uuid

    ChangesPage:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, OPERATOR]

    Contacts:
      description: At least one of phone, e-mail, Telegram.
      type: object
      additionalProperties: false
      properties:
        phone:
          type: [string, "null"]
          description: E.164 after normalization.
        email:
          type: [string, "null"]
          format: email
        telegram:
          type: [string, "null"]
          description: Telegram username, stored with a leading @.
          pattern: "^@?[A-Za-z0-9_]{5,32}$"

    Profile:
      type: object
      additionalProperties: false
      required: [first_name, last_name, contacts, role]
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        contacts:
          $ref: "#/components/schemas/Contacts"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          description: Ticked function codes from listPermissions; ignored (empty) for a super admin.
          type: array
          items:
            type: string
        all_cities:
          description: Every city, including ones added later; always true for a super admin.
          type: boolean
        city_ids:
          description: The cities the member works in when all_cities is false.
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    StaffMember:
      type: object
      additionalProperties: false
      required: [id, login, profile, state, password_change_required, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
        state:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DISABLED]
        password_change_required:
          type: boolean
        version:
          type: integer
          format: int64

    StaffList:
      type: object
      additionalProperties: false
      required: [staff]
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"

    Me:
      type: object
      additionalProperties: false
      required: [member, effective_permissions]
      properties:
        member:
          $ref: "#/components/schemas/StaffMember"
        effective_permissions:
          type: array
          items:
            type: string

    ChangePassword:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
        new_password:
          description: 12 to 128 characters by default, not equal to the login.
          type: string
          format: password
          maxLength: 128

    Permission:
      type: object
      additionalProperties: false
      required: [code, group, description]
      properties:
        code:
          type: string
          examples: [orders.create]
        group:
          type: string
        description:
          type: string

    PermissionCatalog:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    CreateStaff:
      type: object
      additionalProperties: false
      required: [command_id, login, initial_password, profile, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          description: 3 to 64 letters, digits, dots, dashes or underscores; case-insensitive.
          type: string
        initial_password:
          type: string
          format: password
          maxLength: 128
        profile:
          $ref: "#/components/schemas/Profile"
        reason:
          type: string

    UpdateStaff:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, profile, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        profile:
          $ref: "#/components/schemas/Profile"
        reason:
          type: string

    ChangeStaff:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string

    ResetPassword:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, temporary_password, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        temporary_password:
          type: string
          format: password
          maxLength: 128
        reason:
          type: string
