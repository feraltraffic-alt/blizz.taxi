              required: [command_id, currency, amount_minor, kind, reason]
              properties:
                command_id:
                  $ref: "./common.yaml#/components/schemas/Uuid"
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"
                amount_minor:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 10000000
                kind:
                  type: string
                  enum: [DEPOSIT, BONUS]
                reference:
                  type: [string, "null"]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
