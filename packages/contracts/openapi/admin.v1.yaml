  /api/admin/v1/integrations:
    get:
      operationId: listIntegrations
      summary: Keys and settings of integrations
      description: Secrets are never returned, only whether they are set and their last characters. Needs integrations.manage.
      tags: [Integrations]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./integrations.yaml#/components/schemas/IntegrationFieldList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: changeIntegrations
      summary: Set, replace or remove keys and settings
      description: >-
        All changes or none, after the password is asked again (REQ-ADM-10); a wrong password counts like a failed
        sign-in and answers 403. The audit keeps who, when, why and the last characters of a key, never the key.
        The servers use the new values within seconds, without a restart. 409 when the server has no master key
        for secrets.
      tags: [Integrations]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./integrations.yaml#/components/schemas/ChangeIntegrations"
      responses:
        "200":
          description: All fields after the change.
          content:
            application/json:
              schema:
                $ref: "./integrations.yaml#/components/schemas/IntegrationFieldList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/integrations/{group}/check:
    post:
      operationId: checkIntegration
      summary: Check the connection
      description: >-
        push — signs in to Firebase without sending anything; routing — asks GraphHopper's /info. The answer never
        contains a key.
      tags: [Integrations]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum: [push, routing, otp]
      responses:
        "200":
          description: The result, also when the check failed.
          content:
            application/json:
              schema:
                $ref: "./integrations.yaml#/components/schemas/IntegrationCheck"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/cash-disputes:
    get:
      operationId: listOpenCashDisputes
      summary: Cash disputes not decided yet
      description: >-
        Trips the driver reported as not paid in cash or at the terminal (owner decision 28.10.2026), the soonest
        deadline first. Needs finance.manage.
      tags: [Finance]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashDisputeList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/orders:
    get:
      operationId: searchAdminOrders
      summary: Find orders
      description: >-
        Orders newest first (created_at, then id), filtered (REQ-ADM-01, issue #142). Without city_id, only the cities of
        the staff member's orders.view scope; a city_id outside it → 403. A phone is a filter, never a lookup in another
        city: an unknown phone, or one whose orders are elsewhere, gives an empty page. Needs orders.view.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: status
          in: query
          description: One or more order statuses.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 12
            items:
              type: string
              enum: [SCHEDULED, AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED,
                     UNFULFILLED]
        - name: from
          in: query
          description: Created at or after this time.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: to
          in: query
          description: Created before this time.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: rider_phone
          in: query
          description: The payer's phone in E.164.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
        - name: driver_phone
          in: query
          description: The phone of a driver assigned to the order at any time, in E.164.
          schema:
            type: string
            pattern: "^\\+[1-9][0-9]{7,14}$"
        - name: short_number
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/orders/overview:
    get:
      operationId: getAdminOrderOverview
      summary: Orders of a city's day by status
      description: >-
        How many orders were created in the city on its local day (its time zone), per status (REQ-ADM-01, issue
        #142). A city outside the staff member's orders.view scope → 403.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOverview"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/orders/{order_id}/timeline:
    get:
      operationId: getAdminOrderTimeline
      summary: The order's history with its actors
      description: >-
        Every event of the order, oldest first, with who did it and why (the AC-21 registry, issue #142): the same as
        the operator's history. An order of a city outside the staff member's orders.view scope → 403. Needs
        orders.view.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/Timeline"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/orders/{order_id}/cash-dispute:
    get:
      operationId: getCashDispute
      summary: The cash dispute of an order
      description: Needs finance.manage. 404 when the driver did not report the fare as unpaid.
      tags: [Finance]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashDispute"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/orders/{order_id}/cash-dispute/decide:
    post:
      operationId: decideCashDispute
      summary: Decide a cash dispute, once
      description: >-
        RIDER_PAID: the rider had paid the driver; the rider's debt goes, the held part is released, the driver
        holds the cash and gets a CASH_DISPUTE risk flag. PAY_DRIVER: the rider did not pay; the service releases the
        held part to the driver, the rider's debt stays. KEEP_HELD: the rider did not pay; the held part stays until
        the rider pays. Nothing moves without this decision; past decide_by the dispute becomes an urgent task.
        Audited; needs finance.manage.
      tags: [Finance]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideCashDispute"
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashDispute"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/orders/{order_id}/payment-operations:
    get:
      operationId: listPaymentOperations
      summary: The card operations of an order
      description: Holds, captures, charges, refunds and tips, oldest first, with each one's state and the provider's status; a retry shows which operation it repeats and who asked. Needs payments.retry. An order without a card payment → 404.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [operations]
                properties:
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentOperation"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/admin/v1/orders/{order_id}/evidence:
    get:
      operationId: getOrderEvidence
      summary: The evidence of an order for a chargeback
      description: >-
        REQ-PAY-23, issue #103. What the payment provider's risk managers ask for, in one document: the order with
        its times, fare and breakdown; the driver and vehicle; a summary of the ride's GPS track (not its points);
        the rider's registration date and trips of the last 12 months (counts and totals only); the card operations;
        the order's chat and its support cases with what was said to and by the requester (no internal notes).
        No phone numbers and no card data: in text people typed, every run of nine or more digits is replaced by
        "[number hidden]". Needs payments.retry for the order's city and a reason; every export is audited
        (order.evidence.view).
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: reason
          in: query
          required: true
          description: Why the evidence is exported, e.g. the bank's request; kept in the audit log.
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEvidence"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/admin/v1/orders/{order_id}/chargebacks:
    get:
      operationId: listChargebacks
      summary: The chargebacks of an order
      description: Oldest first. Needs payments.retry for the order's city.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [chargebacks]
                properties:
                  chargebacks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Chargeback"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      operationId: recordChargeback
      summary: Record a chargeback of the order's card payment by hand
      description: >-
        REQ-PAY-23, issue #103. The payment provider handles chargebacks through its risk managers and tells no API, so
        finance records what the bank took. In the journal the money leaves PROVIDER_CLEARING and the rider owes it
        again (RIDER_RECEIVABLE); a PAYMENT case, HIGH, is opened to send the order's evidence. At most what is left of
        the order's card payment (captures, charges and tips, less earlier chargebacks not won back), and only on an
        order paid by card: otherwise 422 CHARGEBACK_NOT_ALLOWED. Needs payments.retry for the order's city;
        idempotent by command_id; audited.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargebackRecordRequest"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/orders/{order_id}/chargebacks/{chargeback_id}/resolve:
    post:
      operationId: resolveChargeback
      summary: Record the outcome of a chargeback
      description: >-
        Once. WON, the money came back: the exact reverse of the recording is posted. LOST: nothing is posted, the
        rider's debt stays and the driver's share is not touched. A resolved chargeback → 409 STATE_CONFLICT, a stale
        version → 409 VERSION_CONFLICT. Needs payments.retry for the order's city; idempotent; audited.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: chargeback_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargebackResolveRequest"
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chargeback"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
  /api/admin/v1/payment-operations/{operation_id}/retry:
    post:
      operationId: retryPaymentOperation
      summary: Retry a declined charge by hand
      description: >-
        REQ-PAY-14. Only a CHARGE the provider declined for sure, not retried yet, while no other operation of the
        payment is under way; anything else → 409 STATE_CONFLICT, a result not known yet → 409 PAYMENT_UNKNOWN (the
        system keeps asking the provider; never charge twice). A new charge of the same amount to the same saved card;
        it keeps the operation it repeats and who asked. When it succeeds, the rider's debt for the fare is paid
        (event CardDebtPaid). Needs payments.retry; reason required; audited.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: operation_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command_id, reason]
              properties:
                command_id:
                  $ref: "./common.yaml#/components/schemas/Uuid"
                reason:
                  type: string
      responses:
        "201":
          description: The new charge, sent shortly by the payment worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOperation"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
  /api/admin/v1/payment-reconciliations:
    get:
      operationId: listPaymentReconciliations
      summary: Daily card reconciliation runs
      description: REQ-LED-07. Needs payments.retry and every city of the merchant; unmapped merchants require all-city scope. Failed attempts are visible as FAILED, never as clean zero differences. Completed daily snapshots are immutable.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: merchant_id
          in: query
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Newest first, limited to merchants the staff member may access.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/PaymentReconciliationRun"}
                  next_cursor: {type: [string, "null"]}
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/admin/v1/payment-reconciliations/{run_id}:
    get:
      operationId: getPaymentReconciliation
      summary: A reconciliation run and its differences
      description: Needs payments.retry and all merchant cities. Provider fields are a safe projection; raw customer data and arbitrary provider references are never returned. Fees are evidence, not compared or booked.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: run_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: after
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        "200":
          description: Items ordered by id, with a continuation id when another page exists.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run, items]
                properties:
                  run: {$ref: "#/components/schemas/PaymentReconciliationRun"}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/PaymentReconciliationItem"}
                  next: {type: [string, "null"], format: uuid}
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/admin/v1/payment-reconciliations/items/{item_id}/resolve:
    post:
      operationId: resolvePaymentReconciliationItem
      summary: Record the staff decision on a difference
      description: Needs payments.retry and all merchant cities, checked again before command replay. Audited and idempotent. Records a decision only; it never applies a provider result or changes money. A later conflicting resolution is 409.
      tags: [Payments]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: item_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command_id, expected_version, decision, reason]
              properties:
                command_id: {$ref: "./common.yaml#/components/schemas/Uuid"}
                expected_version: {type: integer, minimum: 0}
                decision:
                  type: string
                  enum: [EXPLAINED, CORRECTED_BY_HAND, ESCALATED]
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: The immutable resolution, including on a same-command replay.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentReconciliationItem"}
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
