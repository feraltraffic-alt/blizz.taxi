                $ref: "./support.yaml#/components/schemas/Case"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/admin/v1/support/cases/{case_id}/assign:
    post:
      operationId: assignAdminSupportCase
      summary: Assign or return to the queue
      description: OPEN → IN_PROGRESS on assignment.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Assign"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/support/cases/{case_id}/priority:
    post:
      operationId: priorityAdminSupportCase
      summary: Change the priority
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Prioritize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/support/cases/{case_id}/comments:
    post:
      operationId: commentAdminSupportCase
      summary: Write to the requester or an internal comment
      description: INTERNAL comments are never shown to the requester.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Comment"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/support/cases/{case_id}/resolve:
    post:
      operationId: resolveAdminSupportCase
      summary: Resolve with a resolution
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/support/cases/{case_id}/reopen:
    post:
      operationId: reopenAdminSupportCase
      summary: Reopen a resolved case
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/support/cases/{case_id}/close:
    post:
      operationId: closeAdminSupportCase
      summary: Close
      description: A reason is required; it becomes the resolution when there is none.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

tags:
  - name: Integrations
    description: Keys of Firebase, GraphHopper, maps and payment merchants (REQ-ADM-10)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Settings
    description: Brand, languages and how calls work (REQ-TEN-06/07), settings.manage
  - name: Geography
    description: Cities, zones and own addresses (section 14), geo.manage
  - name: Drivers
    description: Driver review (section 6), driver.review
  - name: Logs
    description: Logs of all staff actions, by role
  - name: Me
    description: The signed-in staff member
  - name: Staff
    description: Staff accounts, roles and functions (super admin)

components:
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    Settings:
      type: object
      additionalProperties: false
      required: [brand, languages, calls]
      properties:
        preorders:
          description: Omitted — the defaults (60 min threshold, 7 days, BROADCAST_BEFORE 30 min).
          $ref: "./config.v1.yaml#/components/schemas/Preorders"
        brand:
          $ref: "./config.v1.yaml#/components/schemas/Brand"
        languages:
          $ref: "./config.v1.yaml#/components/schemas/Languages"
        calls:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [DIRECT, VIA_SERVICE_NUMBERS]
            service_phone:
              type: [string, "null"]

    SettingsVersion:
      type: object
      additionalProperties: false
      required: [version, settings]
      properties:
        version:
          type: integer
          format: int64
        settings:
          $ref: "#/components/schemas/Settings"
        changed_by:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        changed_at:
          type: [string, "null"]
          format: date-time

    SettingsHistory:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/SettingsVersion"

    ChangeSettings:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, settings, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        settings:
          $ref: "#/components/schemas/Settings"
        reason:
          type: string

    GeoJsonPolygon:
      description: GeoJSON Polygon or MultiPolygon, WGS84 (longitude, latitude).
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array

    GeoRevision:
      type: object
      additionalProperties: false
      required: [id, state, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64

    GeoChange:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string

    City:
      type: object
      additionalProperties: false
      required: [id, code, name, currency, timezone, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          examples: [Europe/Warsaw]
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    CityList:
      type: object
      additionalProperties: false
      required: [cities]
      properties:
        cities:
          type: array
          items:
            $ref: "#/components/schemas/City"

    CreateCity:
      type: object
      additionalProperties: false
      required: [command_id, code, name, currency, timezone, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          description: Higher wins where cities overlap.
          type: integer
        reason:
          type: string

    Zone:
      type: object
      additionalProperties: false
      required: [id, city_id, type, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    ZoneList:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    CreateZone:
      type: object
      additionalProperties: false
      required: [command_id, type, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          type: integer
        reason:
          type: string

    AddressData:
      type: object
      additionalProperties: false
      required: [city_id, kind, label, language, pickup]
      properties:
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        kind:
          type: string
          enum: [HOUSE, PLACE, ENTRANCE]
        label:
          type: string
        language:
          type: string
          examples: [uk]
        street:
          type: [string, "null"]
        house_raw:
          type: [string, "null"]
          examples: ["2А"]
        building:
          type: [string, "null"]
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        instructions:
          type: [string, "null"]
        override:
          description: Opaque link to a provider object this own address replaces (Q-08); no provider content.
          type: [object, "null"]
          properties:
            provider:
              type: string
            object_id:
              type: string

    OwnAddress:
      type: object
      required: [id, data, source, visibility, version, aliases]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        house:
          type: object
          description: Parsed house number, suffix and building.
        source:
          type: string
        visibility:
          type: string
          enum: [ACTIVE, HIDDEN]
        version:
          type: integer
          format: int64
        aliases:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              language:
                type: string

    AddressList:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/OwnAddress"

    CreateAddress:
      type: object
      additionalProperties: false
      required: [command_id, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    UpdateAddress:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    AddAlias:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, alias, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        alias:
          type: object
          required: [label, language]
          properties:
            label:
              type: string
            language:
              type: string
        reason:
          type: string

    ReviewItem:
      type: object
      additionalProperties: false
      required: [driver_id, status, since, version]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        name:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        status:
          type: string
        since:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        version:
          type: integer
          format: int64

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [drivers]
      properties:
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"

    ReviewEvent:
      type: object
      additionalProperties: false
      required: [from, to, actor_type, reason, at]
      properties:
        from:
          type: string
        to:
          type: string
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ReviewCase:
      type: object
      additionalProperties: false
      required: [profile, history]
      properties:
        profile:
          $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        phone:
          type: [string, "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvent"

    ReviewDecisionCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, decision, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        decision:
          type: string
          enum: [APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type: string
          maxLength: 1000
        vehicle_classes:
          description: Classes granted to the submitted vehicles on APPROVE, e.g. STANDARD.
          type: array
          items:
            type: string
        rejected_documents:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    ReviewChange:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 1000

    ActivityEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, kind, audience]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        kind:
          type: string
          enum: [REQUEST, SIGN_IN]
        staff_id:
          type: [string, "null"]
          format: uuid
          description: Null for a request without a valid staff token or a sign-in with an unknown login.
        staff_login:
          type: [string, "null"]
        role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        audience:
          type: string
          enum: [admin, operator]
        method:
          type: [string, "null"]
        path:
          description: Path template, e.g. /api/admin/v1/staff/{staff_id}/suspend.
          type: [string, "null"]
        resource_ids:
          description: "Values of the path template, e.g. staff_id."
          type: object
          additionalProperties:
            type: string
        status:
          type: [integer, "null"]
        outcome:
          description: OK / HTTP_4xx for requests; SUCCESS, BAD_CREDENTIALS, LOCKED, NOT_ACTIVE for sign-ins.
          type: [string, "null"]
        duration_ms:
          type: [integer, "null"]
        client_ip:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
          format: uuid

    ActivityPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"

    Change:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_type, action, resource_type, correlation_id]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        actor_role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        before:
          description: JSON snapshot before the change, as text.
          type: [string, "null"]
        after:
          description: JSON snapshot after the change, as text.
          type: [string, "null"]
        correlation_id:
          type: string
          format: uuid

    ChangesPage:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, OPERATOR]

    Contacts:
      description: At least one of phone, e-mail, Telegram.
      type: object
      additionalProperties: false
      properties:
        phone:
          type: [string, "null"]
          description: E.164 after normalization.
        email:
          type: [string, "null"]
          format: email
        telegram:
          type: [string, "null"]
          description: Telegram username, stored with a leading @.
          pattern: "^@?[A-Za-z0-9_]{5,32}$"

    Profile:
      type: object
      additionalProperties: false
      required: [first_name, last_name, contacts, role]
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        contacts:
          $ref: "#/components/schemas/Contacts"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          description: Ticked function codes from listPermissions; ignored (empty) for a super admin.
          type: array
          items:
            type: string
        all_cities:
          description: Every city, including ones added later; always true for a super admin.
          type: boolean
        city_ids:
          description: The cities the member works in when all_cities is false.
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    StaffMember:
      type: object
      additionalProperties: false
      required: [id, login, profile, state, password_change_required, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
        state:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DISABLED]
        password_change_required:
          type: boolean
        version:
          type: integer
          format: int64

    StaffList:
      type: object
      additionalProperties: false
      required: [staff]
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"

    Me:
      type: object
      additionalProperties: false
      required: [member, effective_permissions]
      properties:
        member:
          $ref: "#/components/schemas/StaffMember"
        effective_permissions:
          type: array
          items:
            type: string

    ChangePassword:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
        new_password:
          description: 12 to 128 characters by default, not equal to the login.
          type: string
          format: password
          maxLength: 128

    Permission:
      type: object
      additionalProperties: false
      required: [code, group, description]
      properties:
        code:
          type: string
          examples: [orders.create]
        group:
          type: string
        description:
          type: string

    PermissionCatalog:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    CreateStaff:
      type: object
      additionalProperties: false
      required: [command_id, login, initial_password, profile, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          description: 3 to 64 letters, digits, dots, dashes or underscores; case-insensitive.
          type: string
        initial_password:
          type: string
