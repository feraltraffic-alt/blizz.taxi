          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/client-deletions:
    get:
      operationId: listClientDeletions
      summary: Riders' pending deletion requests with what blocks them
      description: Oldest first; at most 100 per page. Needs clients.delete.
      tags: [Clients]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - name: after
          in: query
          deprecated: true
          description: |
            The first version's cursor: rows after this time (the list is oldest first). Rows of the same microsecond
            as the boundary can be skipped; use cursor instead. Ignored when cursor is given.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DeletionRequestList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/client-deletions/{client_id}/complete:
    post:
      operationId: completeClientDeletion
      summary: Complete a rider's deletion request
      description: >-
        Anonymizes the client: phone, name and language are cleared, every session ends, the bonuses burn, the
        saved cards, push devices and the address-search log are removed; orders, the journal, ratings and the audit
        log stay (REQ-PRV-04, AC-24). The phone becomes free: signing in with it creates a new client. 409 while a
        blocker exists or without a pending request. Needs clients.delete; audited.
      tags: [Clients]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionDecisionCommand"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DeletionDecision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/client-deletions/{client_id}/reject:
    post:
      operationId: rejectClientDeletion
      summary: Reject a rider's deletion request
      description: The account returns to the state it had before the request. Needs clients.delete; audited.
      tags: [Clients]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: client_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionDecisionCommand"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DeletionDecision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/driver-deletions:
    get:
      operationId: listDriverDeletions
      summary: Drivers' pending deletion requests with what blocks them
      description: Oldest first; at most 100 per page (issue #144). Needs drivers.delete.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DriverDeletionRequestList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/driver-deletions/{driver_id}/complete:
    post:
      operationId: completeDriverDeletion
      summary: Complete a driver's deletion request
      description: >-
        Anonymizes the driver (REQ-PRV-04, issue #144): phone, name and language are cleared, every session and push
        device ends, the document numbers are cleared and their files deleted (after DRIVER_DOCUMENT_KEEP, by default
        at once); the driver's chat messages, rating comments and support texts become "[deleted]". Earnings, the
        ledger, trips and the vehicle stay (AC-24). The phone becomes free: signing in with it creates a new driver.
        409 DRIVER_HAS_ACTIVE_WORK, DRIVER_HAS_DEBT or DRIVER_HAS_DISPUTE while a blocker exists, STATE_CONFLICT
        without a pending request. Needs drivers.delete; audited.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionDecisionCommand"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DriverDeletionDecision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/driver-deletions/{driver_id}/reject:
    post:
      operationId: rejectDriverDeletion
      summary: Reject a driver's deletion request
      description: The account returns to the state it had before the request. Needs drivers.delete; audited.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionDecisionCommand"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DriverDeletionDecision"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/otp-deliveries:
    get:
      operationId: listOtpDeliveries
      summary: How sign-in codes reached a phone
      description: >-
        Every attempt to deliver a one-time code to the phone, newest first: when, the channel (SMS or VOICE), the
        provider, the outcome and the provider's error or message id — never the code. For support, when a rider
        or a driver says the code does not come (ADR 0012 Q-18). Needs support.manage.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: phone
          in: query
          required: true
          schema:
            type: string
            examples: ["+380671234567"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/OtpDelivery"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/call-lines:
    get:
      operationId: listCallLines
      summary: The service numbers of the call centre and their cities
      description: An incoming call to a number goes to the operators of its city (card-pop). Needs settings.manage.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/CallLineList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/call-lines/{number}:
    post:
      operationId: changeCallLine
      summary: Set or remove the city of a service number
      description: >-
        number in E.164 (URL-encode the +). city_id null removes the number. Needs settings.manage for the new city
        and for the old one; audited.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: number
          in: path
          required: true
          schema:
            type: string
            examples: ["+380441234567"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./calls.yaml#/components/schemas/ChangeCallLine"
      responses:
        "200":
          description: The line as it is now; for a removal the last version with city_id of the removed line.
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/CallLine"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/staff-extensions:
    get:
      operationId: listStaffExtensions
      summary: The staff's internal numbers on the service's Asterisk
      description: >-
        Asterisk's answers on an extension name who took a call; click-to-call rings it. Needs settings.manage.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/StaffExtensionList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/staff-extensions/{staff_id}:
    post:
      operationId: changeStaffExtension
      summary: Set or remove a staff member's extension
      description: >-
        extension null removes it. One extension — one staff member (another's → 409 STATE_CONFLICT). Needs
        settings.manage; audited.
      tags: [Settings]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./calls.yaml#/components/schemas/ChangeStaffExtension"
      responses:
        "200":
          description: The extension as it is now; for a removal the last version with the removed extension.
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/StaffExtension"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/driver-risk-flags:
    get:
      operationId: listDriverRiskFlags
      summary: Risk flags of drivers to review
      description: >-
        Newest first, at most 100, in the cities where I have drivers.risk; filter by city, state and driver. A flag
        blocks nothing by itself.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: state
          in: query
          schema:
            $ref: "./risk.yaml#/components/schemas/RiskFlagState"
        - name: driver_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Before"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./risk.yaml#/components/schemas/RiskFlagList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: raiseDriverRiskFlag
      summary: Raise a risk flag by hand
      description: Needs drivers.risk for the city; audited. A repeat of the command returns the first flag.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./risk.yaml#/components/schemas/RaiseRiskFlag"
      responses:
        "201":
          description: The new flag (OPEN).
          content:
            application/json:
              schema:
                $ref: "./risk.yaml#/components/schemas/RiskFlag"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/driver-risk-flags/{flag_id}:
    get:
      operationId: getDriverRiskFlag
      summary: One risk flag
      description: Needs drivers.risk for the flag's city.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/RiskFlagId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./risk.yaml#/components/schemas/RiskFlag"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/driver-risk-flags/{flag_id}/confirm:
    post:
      operationId: confirmDriverRiskFlag
      summary: Confirm a risk flag — the suspicion holds
      description: >-
        OPEN → CONFIRMED with a reason; audited. Changes nothing for the driver: suspend them separately, naming the
        flag. Not OPEN → 409.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/RiskFlagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./risk.yaml#/components/schemas/ReviewRiskFlag"
      responses:
        "200":
          description: The flag now.
          content:
            application/json:
              schema:
                $ref: "./risk.yaml#/components/schemas/RiskFlag"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/driver-risk-flags/{flag_id}/dismiss:
    post:
      operationId: dismissDriverRiskFlag
      summary: Dismiss a risk flag — no case
      description: OPEN → DISMISSED with a reason; audited. Not OPEN → 409.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/RiskFlagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./risk.yaml#/components/schemas/ReviewRiskFlag"
      responses:
        "200":
          description: The flag now.
          content:
            application/json:
              schema:
                $ref: "./risk.yaml#/components/schemas/RiskFlag"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

tags:
  - name: Legal
    description: Legal texts and their versions (REQ-PRV-08)
  - name: Orders
    description: Orders after the fact — search, the day's overview, history and corrections (REQ-ADM-01, issue #142)
  - name: Clients
    description: Riders' accounts — deletion requests (REQ-RID-10)
  - name: Promotions
    description: Discounts and bonuses for riders (ADR 0009)
  - name: Wallets
    description: Riders' bonus accounts (ADR 0009)
  - name: Integrations
    description: Keys of Firebase, GraphHopper, maps and payment merchants (REQ-ADM-10)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Settings
    description: Brand, languages and how calls work (REQ-TEN-06/07), settings.manage
  - name: Geography
    description: Cities, zones and own addresses (section 14), geo.manage
  - name: Drivers
    description: Driver review (section 6), driver.review
  - name: Logs
    description: Logs of all staff actions, by role
  - name: Me
    description: The signed-in staff member
  - name: Staff
    description: Staff accounts, roles and functions (super admin)

components:
  parameters:
    RiskFlagId:
      name: flag_id
      in: path
      required: true
      schema:
        $ref: "./common.yaml#/components/schemas/Uuid"
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    AdminOrderRow:
      description: One order in the admin search (issue #142).
      type: object
      additionalProperties: false
      required: [id, short_number, city_id, status, channel, created_at, payer_client_id, driver_id, vehicle_class,
                 payment_method, price_minor, final_price_minor, currency]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          type: integer
          format: int64
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        status:
          type: string
        channel:
          type: string
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        payer_client_id:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        driver_id:
          description: The driver of the latest assignment, if any.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        vehicle_class:
          type: string
        payment_method:
          type: string
        price_minor:
          type: [integer, "null"]
          format: int64
        final_price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: string

    AdminOrderList:
      type: object
      additionalProperties: false
      required: [orders, page]
      properties:
        orders:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminOrderRow"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    OrderOverview:
      type: object
      additionalProperties: false
      required: [city_id, date, time_zone, total, by_status]
      properties:
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        date:
          type: string
          format: date
        time_zone:
          type: string
        total:
          type: integer
          minimum: 0
        by_status:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, count]
            properties:
              status:
                type: string
              count:
                type: integer
                minimum: 1

    PlatformVersions:
      type: object
      additionalProperties: false
      required: [minimum_version, latest_version]
      properties:
        minimum_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: Lowest build still allowed. Below this the four checked actions return 426.
        latest_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: Current recommended build. The app may show "update available".
    OtpDelivery:
      type: object
      additionalProperties: false
      required: [id, challenge_id, phone, audience, channel, provider, state, provider_ref, error, attempted_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        challenge_id:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        phone:
          type: string
        audience:
          type: string
          enum: [CLIENT, DRIVER]
        channel:
          type: string
          enum: [SMS, VOICE]
        provider:
          type: string
          enum: [TURBOSMS, ASTERISK, FAKE]
        state:
          description: >-
            SENT — the provider took it; FAILED — it refused or is not configured (the next channel was tried);
            UNKNOWN — no answer (it may still arrive; the next channel was tried).
          type: string
          enum: [SENT, FAILED, UNKNOWN]
        provider_ref:
          description: The provider's message or call id, when it gave one.
          type: [string, "null"]
        error:
          type: [string, "null"]
        attempted_at:
          type: string
          format: date-time

    Settings:
      type: object
      additionalProperties: false
      required: [brand, languages, calls]
      properties:
        preorders:
          description: Omitted — the defaults (60 min threshold, 7 days, BROADCAST_BEFORE 30 min).
          $ref: "./config.v1.yaml#/components/schemas/Preorders"
        ratings:
          type: object
          additionalProperties: false
          required: [edit_window_hours]
          properties:
            edit_window_hours:
              type: integer
              minimum: 1
              maximum: 720
              default: 24
              description: Hours after trip completion during which a rating may be submitted or replaced.
        tips:
          type: object
          additionalProperties: false
          required: [window_hours]
          properties:
            window_hours:
              type: integer
              minimum: 1
              maximum: 720
              default: 24
              description: Hours after trip completion during which the rider may leave a tip (ADR 0012).
        orders:
          type: object
          additionalProperties: false
          required: [active_per_payer]
          properties:
            active_per_payer:
              type: integer
              minimum: 1
              maximum: 10
              default: 3
              description: >-
                How many orders not in a final state (pre-orders included) one paying rider may have at once
                (active_orders_per_payer, ADR 0012 Q-03); one more is refused with 409 ACTIVE_ORDER_LIMIT.
        cash_not_received:
          description: >-
            When the driver reports that cash (or the driver's own terminal) was not paid (owner decision
            28.10.2026). The rider owes the whole fare either way. Omitted — the driver is credited the whole share.
          type: object
          additionalProperties: false
          required: [credit_driver, driver_share_percent]
          properties:
            credit_driver:
              type: boolean
              default: true
              description: Whether the driver's balance gets anything for such a trip.
            driver_share_percent:
              type: integer
              minimum: 0
              maximum: 100
              default: 100
              description: >-
                The part of the driver's share credited when credit_driver is true; the rest is held in suspense
                until support settles the dispute. Ignored (0) when credit_driver is false.
        app_versions:
          description: >-
            Per-platform version policy (REQ-API-10). Omitted when saving: no policy (every build allowed, "0.0.0").
          type: [object, "null"]
          additionalProperties: false
          properties:
            rider_android:
              oneOf:
                - $ref: "#/components/schemas/PlatformVersions"
                - type: "null"
            rider_ios:
              oneOf:
                - $ref: "#/components/schemas/PlatformVersions"
                - type: "null"
            driver_android:
              oneOf:
                - $ref: "#/components/schemas/PlatformVersions"
                - type: "null"
            driver_ios:
              oneOf:
                - $ref: "#/components/schemas/PlatformVersions"
                - type: "null"
            require_version_header:
              type: boolean
              default: false
              description: When true, the four checked actions refuse a request with no version header.
        staff_top_ups:
          description: >-
            Limit on what one staff member may top up in 24 hours (threat model C3, owner decision 30.10.2026): driver
            balance top-ups (DEPOSIT and BONUS) and rider wallet top-ups together, per currency, counted over the
            last 24 hours (a rolling window, not a calendar day). One more top-up over it is refused with 422
            TOP_UP_DAILY_LIMIT and nothing is credited. A currency not listed has no daily limit; omitted when saving:
            no daily limit. The limit of one top-up (100 000.00) stays.
          type: [object, "null"]
          additionalProperties: false
          properties:
            daily_max_per_staff_minor:
              type: object
              description: Currency code to the most one staff member may top up in 24 hours, in minor units.
              propertyNames:
                pattern: "^[A-Z]{3}$"
              additionalProperties:
                type: integer
                format: int64
                minimum: 1
                maximum: 1000000000000
              example: {UAH: 30000000, PLN: 3000000}
        brand:
          $ref: "./config.v1.yaml#/components/schemas/Brand"
        languages:
          $ref: "./config.v1.yaml#/components/schemas/Languages"
        calls:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [DIRECT, VIA_SERVICE_NUMBERS]
            service_phone:
              type: [string, "null"]

    SettingsVersion:
      type: object
      additionalProperties: false
      required: [version, settings]
      properties:
        version:
          type: integer
          format: int64
        settings:
          $ref: "#/components/schemas/Settings"
        changed_by:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        changed_at:
          type: [string, "null"]
          format: date-time

    FeatureFlag:
      type: object
      additionalProperties: false
      required: [key, description, owner, review_by, default_enabled, enabled, version, changed_by, reason, changed_at]
      properties:
        key:
          type: string
          examples: [card-payments]
        description:
          type: string
        owner:
          description: The server module that answers for the flag.
          type: string
        review_by:
          description: By this date the flag is removed or its date moved with a reason.
          type: string
          format: date
        default_enabled:
          type: boolean
        enabled:
          type: boolean
        version:
          description: 0 until the first switch.
          type: integer
          format: int64
        changed_by:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        changed_at:
          type: [string, "null"]
          format: date-time
    FeatureFlagList:
      type: object
      additionalProperties: false
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
    ChangeFeatureFlag:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, enabled, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SettingsHistory:
      description: One page of versions, newest first (REQ-API-09).
      type: object
      additionalProperties: false
      required: [versions, page]
      properties:
        versions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SettingsVersion"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    ChangeSettings:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, settings, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        settings:
          $ref: "#/components/schemas/Settings"
        reason:
          type: string

    GeoJsonPolygon:
      description: GeoJSON Polygon or MultiPolygon, WGS84 (longitude, latitude).
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array

    GeoRevision:
      type: object
      additionalProperties: false
      required: [id, state, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64

    WorkingHours:
      description: >-
        One interval of work in the city's time zone, starting on each of the given ISO days (1 = Monday). An interval
        whose `to` is not after `from` runs past midnight into the next day ("22:00"–"06:00"); `from` equal to `to`
        is 24 hours from `from`.
      type: object
      additionalProperties: false
      required: [days_of_week, from, to]
      properties:
        days_of_week:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        from:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        to:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

    CityPaymentMethod:
      type: string
      enum: [CASH, CARD, TERMINAL]

    CityOperations:
      type: object
      additionalProperties: false
      required: [city_id, working_hours, payment_methods, return_zone_meters, orders_paused, pause_reason, paused_at,
                 version]
      properties:
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        return_zone_meters:
          $ref: "#/components/schemas/ReturnZoneMeters"
        working_hours:
          description: Empty — open around the clock.
          type: array
          items:
            $ref: "#/components/schemas/WorkingHours"
        payment_methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CityPaymentMethod"
        orders_paused:
          type: boolean
        pause_reason:
          type: [string, "null"]
        paused_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0

    ReturnZoneMeters:
      description: >-
        REQ-DS-07 (issue #141): how far outside the city's polygon a driver may be and still get new orders of the
        city (the pickup radius applies as usual). 0 — none: outside the polygon the driver is not eligible
        (LOCATION_OUTSIDE_CITY). Never ends or changes a current trip.
      type: integer
      minimum: 0
      maximum: 50000

    ChangeCityOperations:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, working_hours, payment_methods, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        return_zone_meters:
          description: Left out — unchanged.
          $ref: "#/components/schemas/ReturnZoneMeters"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        working_hours:
          description: Empty — open around the clock. At most 14 intervals.
          type: array
          maxItems: 14
          items:
            $ref: "#/components/schemas/WorkingHours"
        payment_methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CityPaymentMethod"
        reason:
          type: string

    CashDispute:
      type: object
      additionalProperties: false
      required: [order_id, driver_id, payer_client_id, currency, held_minor, rider_debt_minor, opened_at, decide_by,
                 decision, decided_by, reason, decided_at, version]
      properties:
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        payer_client_id:
          type: [string, "null"]
          format: uuid
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        held_minor:
          description: The part of the driver's share held by the cash_not_received setting.
          type: integer
          format: int64
          minimum: 0
        rider_debt_minor:
          description: What the driver reported as not paid.
          type: integer
          format: int64
          minimum: 0
        opened_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        decide_by:
          description: 14 days after the trip.
          $ref: "./common.yaml#/components/schemas/Timestamp"
        decision:
          type: [string, "null"]
          enum: [RIDER_PAID, PAY_DRIVER, KEEP_HELD, null]
        decided_by:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        decided_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
    CashDisputeList:
      description: One page of undecided disputes, the soonest deadline first (decide_by, then order id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [disputes, page]
      properties:
        disputes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CashDispute"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"
    DecideCashDispute:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, decision, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        decision:
          type: string
          enum: [RIDER_PAID, PAY_DRIVER, KEEP_HELD]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    PaymentReconciliationRun:
      type: object
      additionalProperties: false
      required: [id, merchant_id, day, period_from, period_to, partial, state, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        merchant_id: {type: string, format: uuid}
        day: {type: string, format: date}
        period_from: {type: string, format: date-time}
        period_to: {type: string, format: date-time}
        observed_until: {type: [string, "null"], format: date-time}
        partial:
          type: boolean
          description: Only a sandbox preview may observe an incomplete day; production runs wait until the end overlap has elapsed.
        state:
          type: string
          enum: [RUNNING, CLEAN, OPEN, RESOLVED, FAILED]
        local_count: {type: [integer, "null"], minimum: 0}
        provider_count: {type: [integer, "null"], minimum: 0}
        item_count: {type: [integer, "null"], minimum: 0}
        open_count: {type: [integer, "null"], minimum: 0}
        failure_code:
          type: [string, "null"]
          description: Fixed diagnostic code, never a raw provider error or response.
          pattern: "^[A-Z][A-Z0-9_]{0,79}$"
        attempts: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        version: {type: integer, minimum: 0}
    PaymentReconciliationItem:
      type: object
      additionalProperties: false
      required: [id, run_id, kind, reference_fingerprint, state, version]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [MISSING_LOCALLY, MISSING_AT_PROVIDER, AMOUNT, CURRENCY, STATE, UNKNOWN_STILL, NOT_CHECKED]
        reference_fingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Merchant-scoped safe identity of the provider reference; arbitrary external reference strings may contain personal data and are not persisted.
        reference_display:
          type: [string, "null"]
          maxLength: 80
          description: >-
            The provider reference for looking the transaction up in the provider's cabinet, at most 80 characters, with
            every run of five or more digits or asterisks replaced by #####. Our own references (operation type and id) stay
            readable.
        local_operation_id: {type: [string, "null"], format: uuid}
        local_record_id:
          type: [string, "null"]
          format: uuid
          description: Payments-owned source id; an operation, top-up or verification according to local_type.
        local_type: {type: [string, "null"], maxLength: 32}
        local_state: {type: [string, "null"], maxLength: 32}
        local_amount_minor:
          type: [integer, "null"]
          minimum: 0
          description: Effective local amount used for this bank-reference comparison; for UNKNOWN_STILL, the unresolved command's requested amount.
        local_currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        provider_type: {type: [string, "null"], maxLength: 32}
        provider_state: {type: [string, "null"], maxLength: 32}
        provider_status: {type: [string, "null"], maxLength: 40}
        provider_amount_minor: {type: [integer, "null"], minimum: 0}
        provider_currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        fee_minor:
          type: [integer, "null"]
          description: Provider evidence only, not compared or booked until accounting policy is decided.
        provider_at: {type: [string, "null"], format: date-time}
        state: {type: string, enum: [OPEN, RESOLVED]}
        decision: {type: [string, "null"], enum: [EXPLAINED, CORRECTED_BY_HAND, ESCALATED, null]}
        reason: {type: [string, "null"], maxLength: 500}
        resolved_by: {type: [string, "null"], format: uuid}
        resolved_at: {type: [string, "null"], format: date-time}
        version: {type: integer, minimum: 0}

    Chargeback:
      type: object
      additionalProperties: false
      required: [id, order_id, amount_minor, currency, bank_reason, received_on, state, resolution_reason, created_at,
                 resolved_at, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        bank_reason:
          type: string
        received_on:
          type: string
          format: date
        state:
          type: string
          enum: [OPEN, WON, LOST]
        resolution_reason:
          type: [string, "null"]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        resolved_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        version:
          type: integer
          minimum: 0
    ChargebackRecordRequest:
      type: object
      additionalProperties: false
      required: [command_id, amount_minor, currency, bank_reason, received_on]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        bank_reason:
          description: The bank's reason as written in its notice.
