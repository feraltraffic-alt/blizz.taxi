          minimum: 0
        first_point_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        last_point_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        duration_seconds:
