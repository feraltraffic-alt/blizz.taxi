      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string

    City:
      type: object
      additionalProperties: false
      required: [id, code, name, currency, timezone, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
          examples: [Europe/Warsaw]
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    CityList:
      type: object
      additionalProperties: false
      required: [cities]
      properties:
        cities:
          type: array
          items:
            $ref: "#/components/schemas/City"

    CreateCity:
      type: object
      additionalProperties: false
      required: [command_id, code, name, currency, timezone, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timezone:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          description: Higher wins where cities overlap.
          type: integer
        reason:
          type: string

    Zone:
      type: object
      additionalProperties: false
      required: [id, city_id, type, priority, state, version, polygon]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        priority:
          type: integer
        state:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
          format: int64
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"

    ZoneList:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    CreateZone:
      type: object
      additionalProperties: false
      required: [command_id, type, polygon, priority, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          type: string
        polygon:
          $ref: "#/components/schemas/GeoJsonPolygon"
        priority:
          type: integer
        reason:
          type: string

    AddressData:
      type: object
      additionalProperties: false
      required: [city_id, kind, label, language, pickup]
      properties:
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        kind:
          type: string
          enum: [HOUSE, PLACE, ENTRANCE]
        label:
          type: string
        language:
          type: string
          examples: [uk]
        street:
          type: [string, "null"]
        house_raw:
          type: [string, "null"]
          examples: ["2А"]
        building:
          type: [string, "null"]
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        instructions:
          type: [string, "null"]
        override:
          description: Opaque link to a provider object this own address replaces (Q-08); no provider content.
          type: [object, "null"]
          properties:
            provider:
              type: string
            object_id:
              type: string

    OwnAddress:
      type: object
      required: [id, data, source, visibility, version, aliases]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        house:
          type: object
          description: Parsed house number, suffix and building.
        source:
          type: string
        visibility:
          type: string
          enum: [ACTIVE, HIDDEN]
        version:
          type: integer
          format: int64
        aliases:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              language:
                type: string

    AddressList:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/OwnAddress"

    CreateAddress:
      type: object
      additionalProperties: false
      required: [command_id, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    UpdateAddress:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, data, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        data:
          $ref: "#/components/schemas/AddressData"
        reason:
          type: string

    AddAlias:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, alias, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        alias:
          type: object
          required: [label, language]
          properties:
            label:
              type: string
            language:
              type: string
        reason:
          type: string

    ReviewItem:
      type: object
      additionalProperties: false
      required: [driver_id, status, since, version]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        name:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        status:
          type: string
        since:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        version:
          type: integer
          format: int64

    ReviewQueue:
      description: One page of the queue, oldest in the status first (since, then driver id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [drivers, page]
      properties:
        drivers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReviewItem"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    ReviewEvent:
      type: object
      additionalProperties: false
      required: [from, to, actor_type, reason, at]
      properties:
        from:
          type: string
        to:
          type: string
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
        at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ReviewCase:
      type: object
      additionalProperties: false
      required: [profile, history]
      properties:
        profile:
          $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        phone:
          type: [string, "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvent"
        duplicates:
          description: >-
            The driver's current documents whose file has the same content as a document of another driver (issue
            #105). A warning for the reviewer; it blocks nothing.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [document_id, other_driver_id, other_document_id]
            properties:
              document_id:
                $ref: "./common.yaml#/components/schemas/Uuid"
              other_driver_id:
                $ref: "./common.yaml#/components/schemas/Uuid"
              other_document_id:
                $ref: "./common.yaml#/components/schemas/Uuid"

    ReviewDecisionCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, decision, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        decision:
          type: string
          enum: [APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type: string
          maxLength: 1000
        vehicle_classes:
          description: Classes granted to the submitted vehicles on APPROVE, e.g. STANDARD.
          type: array
          items:
            type: string
        rejected_documents:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    CorrelationTrail:
      type: object
      additionalProperties: false
      required: [found]
      properties:
        found:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, id, order_id, at]
            properties:
              type:
                type: string
                enum: [ORDER_EVENT, PAYMENT_INTENT, PAYMENT_OPERATION, AUDIT, STAFF_ACTIVITY]
              id:
                description: The row's id (for an order event, "{order_id}:{sequence}").
                type: string
              order_id:
                description: The order it belongs to, when there is one.
                oneOf:
                  - $ref: "./common.yaml#/components/schemas/Uuid"
                  - type: "null"
              at:
                type: string
                format: date-time

    SuspendDriver:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 1000
        risk_flag_id:
          description: The driver's risk flag that caused the suspension (issue #71).
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"

    SetAdmissionCities:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, city_ids, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          description: The driver profile's version.
          type: integer
          format: int64
          minimum: 0
        city_ids:
          description: The whole new list; empty — admitted nowhere.
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    ReviewChange:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 1000

    ActivityEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, kind, audience]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        kind:
          type: string
          enum: [REQUEST, SIGN_IN]
        staff_id:
          type: [string, "null"]
          format: uuid
          description: Null for a request without a valid staff token or a sign-in with an unknown login.
        staff_login:
          type: [string, "null"]
        role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        audience:
          type: string
          enum: [admin, operator]
        method:
          type: [string, "null"]
        path:
          description: Path template, e.g. /api/admin/v1/staff/{staff_id}/suspend.
          type: [string, "null"]
        resource_ids:
          description: "Values of the path template, e.g. staff_id."
          type: object
          additionalProperties:
            type: string
        status:
          type: [integer, "null"]
        outcome:
          description: OK / HTTP_4xx for requests; SUCCESS, BAD_CREDENTIALS, LOCKED, NOT_ACTIVE for sign-ins.
          type: [string, "null"]
        duration_ms:
          type: [integer, "null"]
        client_ip:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
          format: uuid

    ActivityPage:
      description: One page of the activity log, newest first (occurred_at, then id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [entries, page]
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ActivityEntry"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    Change:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_type, action, resource_type, correlation_id]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        occurred_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        actor_type:
          type: string
        actor_id:
          type: [string, "null"]
          format: uuid
        actor_role:
          type: [string, "null"]
          enum: [SUPER_ADMIN, ADMIN, OPERATOR, null]
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        before:
          description: JSON snapshot before the change, as text.
          type: [string, "null"]
        after:
          description: JSON snapshot after the change, as text.
          type: [string, "null"]
        correlation_id:
          type: string
          format: uuid

    ChangesPage:
      description: One page of the change log, newest first (occurred_at, then id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [changes, page]
      properties:
        changes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Change"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    Role:
      type: string
      enum: [SUPER_ADMIN, ADMIN, OPERATOR]

    Contacts:
      description: At least one of phone, e-mail, Telegram.
      type: object
      additionalProperties: false
      properties:
        phone:
          type: [string, "null"]
          description: E.164 after normalization.
        email:
          type: [string, "null"]
          format: email
        telegram:
          type: [string, "null"]
          description: Telegram username, stored with a leading @.
          pattern: "^@?[A-Za-z0-9_]{5,32}$"

    Profile:
      type: object
      additionalProperties: false
      required: [first_name, last_name, contacts, role]
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        contacts:
          $ref: "#/components/schemas/Contacts"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          description: Ticked function codes from listPermissions; ignored (empty) for a super admin.
          type: array
          items:
            type: string
        all_cities:
          description: Every city, including ones added later; always true for a super admin.
          type: boolean
        city_ids:
          description: The cities the member works in when all_cities is false.
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Uuid"

    StaffMember:
      type: object
      additionalProperties: false
      required: [id, login, profile, state, password_change_required, version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
        state:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DISABLED]
        password_change_required:
          type: boolean
        version:
          type: integer
          format: int64

    StaffList:
      type: object
      additionalProperties: false
      required: [staff]
      properties:
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"

    Me:
      type: object
      additionalProperties: false
      required: [member, effective_permissions]
      properties:
        member:
          $ref: "#/components/schemas/StaffMember"
        effective_permissions:
          type: array
          items:
            type: string

    ChangePassword:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
        new_password:
          description: 12 to 128 characters by default, not equal to the login.
          type: string
          format: password
          maxLength: 128

    Permission:
      type: object
      additionalProperties: false
      required: [code, group, description]
      properties:
        code:
          type: string
          examples: [orders.create]
        group:
          type: string
        description:
          type: string

    PermissionCatalog:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    CreateStaff:
      type: object
      additionalProperties: false
      required: [command_id, login, initial_password, profile, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        login:
          description: 3 to 64 letters, digits, dots, dashes or underscores; case-insensitive.
          type: string
        initial_password:
          type: string
          format: password
          maxLength: 128
        profile:
          $ref: "#/components/schemas/Profile"
        reason:
          type: string

    UpdateStaff:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, profile, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        profile:
          $ref: "#/components/schemas/Profile"
        reason:
          type: string

    ChangeStaff:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string

    ResetPassword:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, temporary_password, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        temporary_password:
          type: string
          format: password
          maxLength: 128
        reason:
          type: string
