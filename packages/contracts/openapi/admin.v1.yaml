          format: date
    ChargebackResolveRequest:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, outcome, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          minimum: 0
        outcome:
          type: string
          enum: [WON, LOST]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    OrderEvidence:
      description: The evidence of one order for a chargeback (REQ-PAY-23). Carries no phone number and no card data.
      type: object
      additionalProperties: false
      required: [generated_at, order, driver, track, rider, card_operations, chat, support_cases]
      properties:
        generated_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        order:
          $ref: "#/components/schemas/EvidenceOrder"
        driver:
          description: The driver of the order's last assignment; null when it never had one.
          oneOf:
            - $ref: "#/components/schemas/EvidenceDriver"
            - type: "null"
        track:
          $ref: "#/components/schemas/EvidenceTrack"
        rider:
          description: The payer; null for an order without one.
          oneOf:
            - $ref: "#/components/schemas/EvidenceRider"
            - type: "null"
        card_operations:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceCardOperation"
        chat:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceChatMessage"
        support_cases:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSupportCase"
    EvidenceOrder:
      type: object
      additionalProperties: false
      required: [id, short_number, status, payment_method, payment_state, pickup_label, dropoff_label,
                 quoted_price_minor, final_price_minor, currency, wallet_minor, discount_minor, fare, created_at,
                 assigned_at, arrived_at, started_at, completed_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          type: integer
        status:
          type: string
        payment_method:
          type: [string, "null"]
        payment_state:
          type: [string, "null"]
        pickup_label:
          type: [string, "null"]
        dropoff_label:
          type: [string, "null"]
        quoted_price_minor:
          type: [integer, "null"]
        final_price_minor:
          type: [integer, "null"]
        currency:
          type: string
        wallet_minor:
          description: Paid from the rider's bonus account.
          type: integer
        discount_minor:
          type: integer
        fare:
          description: The final fare and its breakdown; null before the trip is completed.
          oneOf:
            - $ref: "#/components/schemas/EvidenceFare"
            - type: "null"
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        assigned_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        arrived_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        started_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
        completed_at:
          oneOf: [{ $ref: "./common.yaml#/components/schemas/Timestamp" }, { type: "null" }]
    EvidenceFare:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, policy, agreed_minor, waiting_seconds, free_waiting_seconds,
