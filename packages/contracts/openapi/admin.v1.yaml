openapi: 3.1.0
info:
  title: Blizz Taxi — Admin panel API
  version: 1.0.0
  description: |
    API of the admin panel (/api/admin/v1, REQ-API-02); tokens of the admin audience only, from
    /auth/v1/staff/sign-in. Functions are ticked per admin or operator by a super admin; a super admin has
    all of them (owner decision 27.10.2026). Until the initial password is changed, everything except
    /me and /me/password returns 403.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /api/admin/v1/me:
    get:
      operationId: getAdminMe
      summary: The signed-in staff member
      description: |
        effective_permissions is what the UI may show: every function for a super admin, the ticked ones otherwise.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/admin/v1/me/emergency-grants:
    get:
      operationId: getMyEmergencyGrants
      summary: My emergency access
      description: The extra permissions a super admin gave me for a limited time, and until when (REQ-SEC-10).
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyGrantList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/admin/v1/me/password:
    post:
      operationId: changeAdminPassword
      summary: Change the own password
      description: |
        Required after the first sign-in and after a reset. 401 when the current password is wrong.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/permissions:
    get:
      operationId: listPermissions
      summary: Functions that can be ticked
      description: |
        The checkbox list for admins and operators.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCatalog"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/admin/v1/staff:
    get:
      operationId: listStaff
      summary: All staff
      description: |
        Super admin only.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createStaff
      summary: Add a staff member
      description: |
        Super admin only. First and last name, at least one contact (phone, e-mail, Telegram), login, initial
        password (must be changed at the first sign-in), role, ticked functions and cities. A taken login → 409.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaff"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}:
    get:
      operationId: getStaff
      summary: One staff member
      description: |
        A super admin reads anyone; others only themselves.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/staff/{staff_id}/update:
    post:
      operationId: updateStaff
      summary: Change names, contacts, role, functions or cities
      description: |
        Super admin only. The last active super admin cannot lose the role.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/suspend:
    post:
      operationId: suspendStaff
      summary: Suspend
      description: |
        Signs the member out everywhere. The last active super admin cannot be suspended.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/restore:
    post:
      operationId: restoreStaff
      summary: Restore a suspended member
      description: |
        Super admin only.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStaff"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/staff/{staff_id}/emergency-grants:
    post:
      operationId: grantEmergencyAccess
      summary: Give emergency access
      description: >-
        Super admins only. Extra permissions from the catalog for 5 minutes to 8 hours, with a reason; never to oneself. Counted by every permission check while it lasts; ends by itself or by revoking. Audited.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./emergency.yaml#/components/schemas/GrantEmergencyAccess"
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyGrant"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/emergency-grants:
    get:
      operationId: listEmergencyGrants
      summary: Emergency access given
      description: Super admins only; active first, the latest 100.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyGrantList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/emergency-grants/{grant_id}/revoke:
    post:
      operationId: revokeEmergencyAccess
      summary: End emergency access early
      description: Super admins only. An ended grant → 409. Audited.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: grant_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./emergency.yaml#/components/schemas/RevokeEmergencyAccess"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyGrant"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/admin/v1/emergency-grants/{grant_id}/activity:
    get:
      operationId: getEmergencyGrantActivity
      summary: What was done with emergency access
      description: Super admins only. The staff member's requests while the grant lasted, from the staff activity log.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: grant_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyActivity"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/staff/{staff_id}/reset-password:
    post:
      operationId: resetStaffPassword
      summary: Set a temporary password
      description: |
        Unlocks the account and signs it out everywhere; the member must change the password at the next sign-in.
      tags: [Staff]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: staff_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers:
    get:
      operationId: listDriversForReview
      summary: Review queue
      description: Drivers in a review status (default IN_REVIEW — the queue), oldest first. Needs driver.review.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: status
          in: query
          schema:
            type: string
            enum: [NOT_SUBMITTED, IN_REVIEW, CHANGES_REQUIRED, APPROVED, REJECTED, SUSPENDED, EXPIRED]
            default: IN_REVIEW
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - name: after
          in: query
          deprecated: true
          description: |
            The first version's cursor: rows after this time (the list is oldest first). Rows of the same microsecond
            as the boundary can be skipped; use cursor instead. Ignored when cursor is given.
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/admin/v1/drivers/{driver_id}:
    get:
      operationId: getDriverReviewCase
      summary: A driver with documents, vehicles and the history of decisions
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCase"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/drivers/{driver_id}/documents/{document_id}/file:
    get:
      operationId: getDriverDocumentFile
      summary: The scan of a driver's document
      description: >-
        Private, not cached; every opening is audited (REQ-SEC-07). Needs driver.review. Always an attachment with
        `X-Content-Type-Options: nosniff`, so a PDF is never rendered inline in the admin's browser (issue #105).
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: document_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: The file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/admin/v1/drivers/{driver_id}/phone/new-code:
    post:
      operationId: sendDriverNewPhoneCodeBySupport
      summary: Send a code to the new phone, for a change by support
      description: >-
        REQ-AUTH-08, support's process, step one: after identifying the person, staff with driver.review send a code to the
        new phone; the person reads it to them. Audited with the masked number. Another account's phone is found
        out only at the change. The same phone as now → 409.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./phone-change.yaml#/components/schemas/NewPhone"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "./phone-change.yaml#/components/schemas/PhoneChangeCode"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"
  /api/admin/v1/drivers/{driver_id}/phone:
    post:
      operationId: changeDriverPhoneBySupport
      summary: Set the driver's phone when the old one is lost
      description: >-
        REQ-AUTH-08, support's process: after identifying the person, staff with driver.review set the new phone with a
        reason (how the person was identified) and the code the person received on the new phone (owner decision
        28.10.2026). Every session of the account ends. Another account's phone → 409 STATE_CONFLICT; a wrong code →
        OTP_INVALID. Audited with masked numbers.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./phone-change.yaml#/components/schemas/SupportPhoneChange"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "./phone-change.yaml#/components/schemas/PhoneChanged"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/admin/v1/drivers/{driver_id}/decision:
    post:
      operationId: decideDriverReview
      summary: Approve, request changes or reject
      description: IN_REVIEW only, reason required. On APPROVE the given vehicle classes are granted; otherwise rejected_documents tell the driver what to replace.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionCommand"
      responses:
        "200":
          description: The driver after the decision.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers/{driver_id}/suspend:
    post:
      operationId: suspendDriver
      summary: Suspend an approved driver
      description: >-
        No new orders; a trip in progress is not interrupted (REQ-DS-01). Reason required. risk_flag_id names the risk
        flag that caused it (it must be this driver's; 422 otherwise) and is kept with the change and in the audit.
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendDriver"
      responses:
        "200":
          description: The driver after the decision.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/admin/v1/drivers/{driver_id}/admission-cities:
    put:
      operationId: setDriverAdmissionCities
      summary: Set the cities a driver is admitted in
      description: >-
        REQ-DSP-01, REQ-DS-06 (issue #141). Needs driver.review for every city added or removed; the reason is
        required and the change is audited (event DriverAdmissionCitiesChanged). Replaces the whole list. A city that
        does not exist → 400 VALIDATION_FAILED. A driver online in a city taken off the list keeps the current trip and the shift but
        gets no new order there (ADMISSION_CITY).
      tags: [Drivers]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: driver_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdmissionCities"
      responses:
        "200":
          description: The driver after the change.
          content:
            application/json:
              schema:
                $ref: "./driver.v1.yaml#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
