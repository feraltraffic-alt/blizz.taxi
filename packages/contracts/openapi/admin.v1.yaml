        policy:
          type: string
        agreed_minor:
          type: integer
        waiting_seconds:
          type: integer
        free_waiting_seconds:
          type: integer
        charged_waiting_seconds:
          type: integer
        waiting_minor:
          type: integer
    EvidenceDriver:
