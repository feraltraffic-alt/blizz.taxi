openapi: 3.1.0
info:
  title: Blizz Taxi — rider wallet components
  version: 1.0.0
  description: >-
    The rider's virtual account (ADR 0009): bonuses and top-ups in the service's currency, 1 bonus = 1 unit; never
    expires, never paid out. Referenced by the rider and admin APIs.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths: {}
components:
  schemas:
    WalletBalance:
      type: object
      required: [currency, balance_minor, reserved_minor, available_minor]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        balance_minor:
          type: integer
          format: int64
          minimum: 0
        reserved_minor:
          description: Set aside for orders not finished yet.
          type: integer
          format: int64
        available_minor:
          description: What may be used in a new order now.
          type: integer
          format: int64

    WalletEntry:
      type: object
      required: [id, at, kind, currency, amount_minor, reason]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        at:
          type: string
          format: date-time
        kind:
          type: string
          description: STAFF_TOP_UP, CARD_TOP_UP, PROMOTION, TRIP_PAYMENT, TIP, … (new kinds may appear).
        currency:
          type: string
        amount_minor:
          type: integer
          format: int64
          description: Positive — in, negative — out.
        reason:
          type: string
        staff_id:
          description: Who topped up, for a top-up by staff.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        order_id:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"

    Wallet:
      type: object
      required: [client_id, balances, entries]
      properties:
        client_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        balances:
          type: array
          items:
            $ref: "#/components/schemas/WalletBalance"
        entries:
          description: Newest first.
          type: array
          items:
            $ref: "#/components/schemas/WalletEntry"

    StaffTopUp:
      type: object
      additionalProperties: false
      required: [command_id, currency, amount_minor, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: A currency of one of the service's cities.
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
        reason:
          type: string
          minLength: 1
          maxLength: 500

    StartCardTopUp:
      type: object
      additionalProperties: false
      required: [command_id, city_id, amount_minor]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          description: The city whose merchant takes the money; the currency is that merchant's.
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          description: Within the service's limits (by default 100 … 1 000 000 minor units).
          type: integer
          format: int64
          minimum: 1

    CardTopUp:
      description: >-
        A top-up on the provider's payment page (ADR 0009, ADR 0010). The app POSTs `fields` to `url` in a web view;
        when it reaches `return_url` the app reads the top-up until it is no longer PENDING. Money the provider took
        is credited even when it reports late: a FAILED or EXPIRED top-up can still become COMPLETED.
      type: object
      additionalProperties: false
      required: [id, state, amount_minor, currency, created_at, expires_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [PENDING, COMPLETED, FAILED, EXPIRED]
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        url:
          description: Where the web view POSTs the form; only in the answer to the start.
          type: [string, "null"]
        fields:
          description: Form fields to POST as application/x-www-form-urlencoded; only in the answer to the start.
          type: [object, "null"]
          additionalProperties:
            type: string
        return_url:
          type: [string, "null"]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        expires_at:
          description: The payment page stops taking the payment.
          $ref: "./common.yaml#/components/schemas/Timestamp"
        completed_at:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        masked_pan:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
