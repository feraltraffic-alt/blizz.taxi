openapi: 3.1.0
info:
  title: Blizz Taxi — account deletion components
  version: 1.0.0
  description: >-
    Shared schemas of a rider's or a driver's request to delete the account (REQ-RID-10, REQ-PRV-04, section 36.4,
    issue #144): the person asks, staff check what blocks it and complete it by hand. Completion anonymizes the
    profile; orders, the journal, ratings and the audit log stay. Referenced by the rider, driver and admin APIs.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths: {}
components:
  schemas:
    Amount:
      type: object
      additionalProperties: false
      required: [currency, amount_minor]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        amount_minor:
          type: integer
          format: int64
          minimum: 1

    DeletionBlockers:
      description: >-
        What stops staff from completing the request. blocked is true while there is an active order, an unpaid
        debt or an open support case of the rider. bonuses_to_burn never blocks: the rider's bonuses burn on
        completion (owner decision 27.10.2026).
      type: object
      additionalProperties: false
      required: [active_order_id, debt, open_support_cases, bonuses_to_burn, blocked]
      properties:
        active_order_id:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        debt:
          description: Unpaid debt per currency (RIDER_RECEIVABLE).
          type: array
          items:
            $ref: "#/components/schemas/Amount"
        open_support_cases:
          type: integer
          minimum: 0
        bonuses_to_burn:
          type: array
          items:
            $ref: "#/components/schemas/Amount"
        blocked:
          type: boolean

    DeletionRequest:
      type: object
      additionalProperties: false
      required: [client_id, previous_state, requested_at, blockers]
      properties:
        client_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        previous_state:
          description: The state the account returns to if the request is cancelled or rejected.
          type: string
          enum: [ACTIVE, BLOCKED]
        requested_at:
          type: string
          format: date-time
        blockers:
          $ref: "#/components/schemas/DeletionBlockers"

    DeletionRequestList:
      description: One page of pending requests, oldest first (requested_at, then client id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [requests, page]
      properties:
        requests:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeletionRequest"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    DeletionDecisionCommand:
      type: object
      additionalProperties: false
      required: [command_id, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        reason:
          description: Why; goes to the audit log.
          type: string
          minLength: 1
          maxLength: 500

    DeletionDecision:
      type: object
      additionalProperties: false
      required: [client_id, account_state]
      properties:
        client_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          description: ANONYMIZED after completion; after a rejection the state the account had before the request.
          type: string
          enum: [ANONYMIZED, ACTIVE, BLOCKED]

    DeletionCodeChallenge:
      description: A code of purpose ACCOUNT_DELETION was sent to the rider's current phone.
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_available_at]
      properties:
        challenge_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        resend_available_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    DeletionRequestCommand:
      description: >-
        The rider confirms the request with the code of the challenge. A sign-in code is refused (OTP_INVALID); a
        wrong code counts as an attempt.
      type: object
      additionalProperties: false
      required: [command_id, challenge_id, otp_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        challenge_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        otp_code:
          type: string
          pattern: "^[0-9]{4,8}$"

    DeletionCancelCommand:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    AccountDeletionStatus:
      type: object
      additionalProperties: false
      required: [client_id, account_state, requested_at]
      properties:
        client_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          description: DELETION_PENDING after a request; after a cancellation the state the account had before.
          type: string
          enum: [DELETION_PENDING, ACTIVE, BLOCKED]
        requested_at:
          type: [string, "null"]
          format: date-time

    DriverDeletionBlockers:
      description: >-
        What stops staff from completing a driver's request (issue #144). blocked is true while any of them is there;
        completing then answers 409 with DRIVER_HAS_ACTIVE_WORK, DRIVER_HAS_DEBT or DRIVER_HAS_DISPUTE, in that order.
      type: object
      additionalProperties: false
      required: [active_work, debt, open_cash_disputes, blocked]
      properties:
        active_work:
          description: >-
            The driver's current trip, accepted assignment, open offer or pre-order reservations: what has to end
            first, as kinds (TRIP, OFFER, RESERVATION).
          type: array
          items:
            type: string
            enum: [TRIP, OFFER, RESERVATION]
        debt:
          description: What the driver owes the service per currency (a negative balance).
          type: array
          items:
            $ref: "#/components/schemas/Amount"
        open_cash_disputes:
          type: integer
          minimum: 0
        blocked:
          type: boolean

    DriverDeletionRequest:
      type: object
      additionalProperties: false
      required: [driver_id, previous_state, requested_at, blockers]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        previous_state:
          description: The state the account returns to if the request is cancelled or rejected.
          type: string
          enum: [ACTIVE, BLOCKED]
        requested_at:
          type: string
          format: date-time
        blockers:
          $ref: "#/components/schemas/DriverDeletionBlockers"

    DriverDeletionRequestList:
      description: One page of drivers' pending requests, oldest first (requested_at, then driver id) (REQ-API-09).
      type: object
      additionalProperties: false
      required: [requests, page]
      properties:
        requests:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DriverDeletionRequest"
        page:
          $ref: "./common.yaml#/components/schemas/PageInfo"

    DriverDeletionDecision:
      type: object
      additionalProperties: false
      required: [driver_id, account_state]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          description: ANONYMIZED after completion; after a rejection the state the account had before the request.
          type: string
          enum: [ANONYMIZED, ACTIVE, BLOCKED]

    DriverAccountDeletionStatus:
      type: object
      additionalProperties: false
      required: [driver_id, account_state, requested_at]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          description: DELETION_PENDING after a request; after a cancellation the state the account had before.
          type: string
          enum: [DELETION_PENDING, ACTIVE, BLOCKED]
        requested_at:
          type: [string, "null"]
          format: date-time

    DataExportCodeChallenge:
      description: A code of purpose DATA_EXPORT was sent to the rider's current phone.
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_available_at]
      properties:
        challenge_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        resend_available_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    DataExportCommand:
      description: >-
        The rider confirms the request with the code of the challenge. A sign-in or deletion code is refused
        (OTP_INVALID); a wrong code counts as an attempt.
      type: object
      additionalProperties: false
      required: [command_id, challenge_id, otp_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        challenge_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        otp_code:
          type: string
          pattern: "^[0-9]{4,8}$"

    DataExport:
      description: >-
        A copy of the rider's personal data (REQ-PRV-07). PENDING → RUNNING → READY (downloadable until expires_at)
        or FAILED; READY → EXPIRED, the file is dropped.
      type: object
      additionalProperties: false
      required: [id, state, created_at, ready_at, expires_at, size_bytes]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [PENDING, RUNNING, READY, FAILED, EXPIRED]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        ready_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        size_bytes:
          type: [integer, "null"]
          format: int64

    DataExportList:
      type: object
      additionalProperties: false
      required: [exports]
      properties:
        exports:
          description: Newest first, at most 20.
          type: array
          items:
            $ref: "#/components/schemas/DataExport"
