  /api/operator/v1/orders/{order_id}/ratings:
    get:
      operationId: getOperatorOrderRatings
      summary: Active ratings for an order, including staff-only comments
      description: Requires orders.view for the order city.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema: {$ref: "./common.yaml#/components/schemas/Uuid"}
      responses:
        "200":
          description: Up to the rider and driver active ratings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ratings]
                properties:
                  ratings:
                    type: array
                    maxItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      required: [order_id, author_type, author_id, target_type, target_id, score, created_at]
                      properties:
                        order_id: {type: string, format: uuid}
                        author_type: {type: string, enum: [RIDER, DRIVER]}
                        author_id: {type: string, format: uuid}
                        target_type: {type: string, enum: [RIDER, DRIVER]}
                        target_id: {type: string, format: uuid}
                        score: {type: integer, minimum: 1, maximum: 5}
                        comment: {type: [string, "null"], maxLength: 500}
                        created_at: {type: string, format: date-time}
        "401": {$ref: "./common.yaml#/components/responses/Unauthorized"}
        "403": {$ref: "./common.yaml#/components/responses/Forbidden"}
        "404": {$ref: "./common.yaml#/components/responses/NotFound"}

  /ws/v1/operator:
    get:
      operationId: openOperatorLiveChannel
      summary: Live channel of the operator workstation (WebSocket)
      description: >-
        Upgrade to a WebSocket with an operator access token — the `Authorization: Bearer` header, or `access_token`
        in the query where a browser cannot set headers. The server pushes `{"type": "CallRinging", "call_id", …,
        "payload": CallRinging}` (calls.yaml) to the staff with calls.answer for the called number's city as a call
        rings (card-pop, REQ-OPS-01/08). The first message is `{"type": "Connected"}`; the client may send `ping`
        (answer `{"type": "Pong"}`). Closed with code 4403 within seconds when the session is revoked or a right it needs is taken away (sign in again), and 4401 when the access token expires — reconnect with a fresh
        one. The call log is GET /api/operator/v1/calls; commands stay REST.
      tags: [Calls]
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Switching to WebSocket.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/operator/v1/calls:
    get:
      operationId: listCalls
      summary: Recent incoming calls of my cities
      description: >-
        The call log, newest first, at most 100, for the cities where I have calls.answer or calls.listen (a number
        without a city line only for staff with all cities). With order_id — the calls during which that order was
        made. Calls are logged only while the service's Asterisk is reachable; phone
        orders work without it (REQ-OPS-07, T-36).
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: state
          in: query
          required: false
          schema:
            $ref: "./calls.yaml#/components/schemas/CallState"
        - name: order_id
          in: query
          required: false
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/CallList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/calls/{call_id}/answer:
    post:
      operationId: answerCall
      summary: I took this call
      description: >-
        Records who took the call (Asterisk knows the phone, not the staff member). A repeat returns the first
        result; a call another operator already took → 409 STATE_CONFLICT; an ended or missed call → 409.
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: call_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./calls.yaml#/components/schemas/AnswerCall"
      responses:
        "200":
          description: Taken.
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/Call"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/calls/{call_id}/recording:
    get:
      operationId: listenToCallRecording
      summary: Listen to the call's recording
      description: >-
        The whole recording as audio/wav, for staff with calls.listen in the call's city; every request is audited
        (call_recording.listen) — there is no public or signed link and no Range support, so one request is one
        listening. Sent with Cache-Control no-store. 404 while the recording is not STORED.
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: call_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: The recording.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/orders/{order_id}/calls:
    post:
      operationId: placeOrderCall
      summary: Call the order's rider, driver or caller from my phone (click-to-call)
      description: >-
        Asterisk rings my own phone (my extension) and then the other side; the number never reaches the panel, the
        response or the log (REQ-PRV-03). Needs orders.view for the order's city and an extension (409 without one, or
        when the order has no such side, e.g. no driver yet). The call is logged as OUTBOUND, linked to the order and
        recorded like incoming ones. A repeat of the command returns the first call and never rings twice. 503
        PROVIDER_UNAVAILABLE: Asterisk could not be reached or refused — the call is FAILED, place a new one (new
        command_id); or its answer was lost — repeat the same command, it does not ring a second time.
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./calls.yaml#/components/schemas/PlaceCall"
      responses:
        "201":
          description: Ringing my phone.
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/Call"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/operator/v1/me/call-status:
    get:
      operationId: getMyCallStatus
      summary: My status for incoming calls and my extension
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/MyCallStatus"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: changeMyCallStatus
      summary: Set my status — available, on a break, offline
      description: >-
        Needs calls.answer. The card-pop goes to the AVAILABLE operators of the city when there is one, else to all;
        calls are not routed by it. A repeat of the command returns the first result.
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./calls.yaml#/components/schemas/ChangeMyCallStatus"
      responses:
        "200":
          description: My status now.
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/MyCallStatus"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/operators:
    get:
      operationId: listCallOperators
      summary: The operators of a city and their status (supervisor)
      description: Staff with calls.answer in the city. Needs calls.supervise for the city.
      tags: [Calls]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./calls.yaml#/components/schemas/CallOperatorList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

tags:
  - name: Calls
    description: Calls of the call centre — card-pop, the call log, recordings, click-to-call, operator status (REQ-OPS-01/08/09)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Me
    description: The signed-in staff member
  - name: Pricing
    description: Pricing a phone order
  - name: Orders
    description: Phone orders and city order monitoring
  - name: Chat
    description: Audited support access to rider-driver conversations

components:
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: "./common.yaml#/components/schemas/Uuid"
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    CreateQuote:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_class, pickup, dropoff]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_at:
          description: >-
            Pickup time for an order for later. At least threshold_minutes ahead (config bootstrap) it is a
            pre-order that waits as SCHEDULED (ADR 0006); nearer, it is an ordinary order searched for at once. At
            most max_days_ahead days ahead; in the past → 400.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    Caller:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          description: Caller phone in E.164 form.
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    CreatePhoneOrder:
      type: object
      additionalProperties: false
      required: [command_id, quote_id, vehicle_class, pickup, dropoff, payment_method, caller]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        quote_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
          maxLength: 300
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
          maxLength: 300
        payment_method:
          type: string
          enum: [CASH, TERMINAL]
        terminal_fallback_to_cash:
          description: Only with TERMINAL — the caller agreed to pay cash if no car with a terminal takes the order.
          type: [boolean, "null"]
        call_ref:
          description: Optional telephony/call reference stored as the order source_ref; no telephony integration is implied.
          type: string
          maxLength: 200
        call_id:
          description: >-
            The incoming call this order is made during (GET /api/operator/v1/calls): the order is linked to it, and
            ending the call does not cancel the order (REQ-OPS-10). A call already linked to another order → 409
            STATE_CONFLICT unless link_again is true; the first link stays.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        link_again:
          description: Link a call that already has an order to this one too (e.g. the caller orders a second car).
          type: [boolean, "null"]
        caller:
          $ref: "#/components/schemas/Caller"
        pickup_at:
          description: The quote's pickup time; must be the same as in CreateQuote, otherwise QUOTE_MISMATCH.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    OperatorOrder:
      allOf:
        - $ref: "./rider.v1.yaml#/components/schemas/Order"
        - type: object
          properties:
            caller:
              oneOf:
                - $ref: "#/components/schemas/Caller"
                - type: "null"
            reservation:
              description: The driver holding a SCHEDULED pre-order (ADR 0006); null otherwise.
              oneOf:
                - $ref: "#/components/schemas/ReservationHolder"
                - type: "null"

    InterruptOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code, follow_up]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: From GET /api/operator/v1/cancel-reasons, e.g. VEHICLE_BREAKDOWN, ACCIDENT.
          type: string
          minLength: 1
          maxLength: 40
        comment:
          type: string
          maxLength: 500
        follow_up:
          type: boolean
        follow_up_pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        follow_up_pickup_label:
          type: string
          maxLength: 300

    InterruptedOrder:
      type: object
      additionalProperties: false
      required: [order, follow_up]
      properties:
        order:
          $ref: "#/components/schemas/OperatorOrder"
        follow_up:
          oneOf:
            - $ref: "#/components/schemas/OperatorOrder"
            - type: "null"

    ReservationHolder:
      type: object
      additionalProperties: false
      required: [reservation_id, driver_id, driver_name, reserved_at]
      properties:
        reservation_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_name:
          type: [string, "null"]
        reserved_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    RemoveReservation:
      type: object
      additionalProperties: false
      required: [command_id, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 1
          maxLength: 500

    OperatorSwitchToCash:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          description: That the rider asked, and how; audited.
          type: string
          minLength: 1
          maxLength: 500
    CancelOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: A code from GET /api/operator/v1/cancel-reasons; the order shows cancellation.by = STAFF.
          type: string
          minLength: 1
          maxLength: 40

    RevokeAssignment:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
