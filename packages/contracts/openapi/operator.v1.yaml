openapi: 3.1.0
info:
  title: Blizz Taxi — Operator workstation API
  version: 1.0.0
  description: |
    API of the dispatcher / call-centre workstation (/api/operator/v1, REQ-API-02); tokens of the operator
    audience only, from /auth/v1/staff/sign-in.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /api/operator/v1/me:
    get:
      operationId: getOperatorMe
      summary: The signed-in staff member
      description: Same shape as in the admin API.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./admin.v1.yaml#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/operator/v1/me/password:
    post:
      operationId: changeOperatorPassword
      summary: Change the own password
      description: Required after the first sign-in and after a reset.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.v1.yaml#/components/schemas/ChangePassword"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/operator/v1/quotes:
    post:
      operationId: createOperatorQuote
      summary: Price a phone order
      description: |
        The pickup determines the service city. The operator needs orders.create for that city. The quote
        belongs to the signed-in operator, expires after the normal quote lifetime and can be consumed once
        by the matching phone order (REQ-OPS-03, REQ-PRC-06).
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuote"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "./rider.v1.yaml#/components/schemas/Quote"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/operator/v1/orders:
    post:
      operationId: createOperatorOrder
      summary: Create a phone order from a quote
      description: |
        The order is created as channel PHONE by the signed-in employee. The quote must belong to that
        operator and match the class and points. CASH is the only payment method until S-09. The caller is
        contact data for this order only and is not linked to or turned into a client account (REQ-OPS-02,
        REQ-OPS-03, REQ-PRC-06).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePhoneOrder"
      responses:
        "201":
          description: The order, already searching for a driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
    get:
      operationId: listOperatorOrders
      summary: Orders of one city
      description: Newest first. The operator needs orders.view for the requested city.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, all]
            default: active
        - name: before
          in: query
          required: false
          description: Exclusive created_at cursor; returns older orders.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Orders of the requested city, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/orders/{order_id}:
    get:
      operationId: getOperatorOrder
      summary: One order with its caller contact
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order and caller contact when it is a phone order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOperatorOrder
      summary: Cancel an order before the trip starts
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
      responses:
        "200":
          description: Cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/revoke-assignment:
    post:
      operationId: revokeOperatorOrderAssignment
      summary: Take the driver off an order and search again
      description: Requires orders.reassign for the order city; reason is mandatory (REQ-OPS-05).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAssignment"
      responses:
        "200":
          description: Order after the assignment was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/events:
    get:
      operationId: getOperatorOrderEvents
      summary: Order history — who did what and why
      description: >-
        Every change of the order, oldest first, with the actor's name and role and the reason, for lines like
        "Operator Anna cancelled the order: passenger asked". Requires orders.view for the order city.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/Timeline"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/cancel-reasons:
    get:
      operationId: listOperatorCancelReasons
      summary: Reasons staff can give when cancelling
      description: The staff list from the admin panel. Requires orders.cancel.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active reasons in display order.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/ReasonList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/orders/{order_id}/messages:
    get:
      operationId: getOperatorOrderConversation
      summary: Read the order conversation for support
      description: This access is audited and requires orders.view for the order city.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
        - name: reason
          in: query
          required: true
          description: Why the operator opened the conversation; written to audit.
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: Complete conversation, oldest first.
          content:
            application/json:
              schema:
                $ref: "./rider.v1.yaml#/components/schemas/ChatMessages"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/support/cases:
    get:
      operationId: listOperatorSupportQueue
      summary: Support queue
      description: Urgent first, then newest. Needs support.manage for the city. Problem queues (CASH_DISPUTE, TRIP_REVIEW) come from events.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          description: The queue of one city; without it, the cases without a city.
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: state
          in: query
          schema:
            $ref: "./support.yaml#/components/schemas/State"
        - name: priority
          in: query
          schema:
            $ref: "./support.yaml#/components/schemas/Priority"
        - name: category
          in: query
          schema:
            $ref: "./support.yaml#/components/schemas/Category"
        - name: assigned_staff_id
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: unassigned
          in: query
          schema:
            type: boolean
            default: false
        - name: before
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/CaseList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/operator/v1/support/cases/{case_id}:
    get:
      operationId: getOperatorSupportCase
      summary: A case with INTERNAL comments
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/operator/v1/support/cases/{case_id}/assign:
    post:
      operationId: assignOperatorSupportCase
      summary: Assign or return to the queue
      description: OPEN → IN_PROGRESS on assignment.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Assign"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/operator/v1/support/cases/{case_id}/priority:
    post:
      operationId: priorityOperatorSupportCase
      summary: Change the priority
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Prioritize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/operator/v1/support/cases/{case_id}/comments:
    post:
      operationId: commentOperatorSupportCase
      summary: Write to the requester or an internal comment
      description: INTERNAL comments are never shown to the requester.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Comment"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/operator/v1/support/cases/{case_id}/resolve:
    post:
      operationId: resolveOperatorSupportCase
      summary: Resolve with a resolution
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/operator/v1/support/cases/{case_id}/reopen:
    post:
      operationId: reopenOperatorSupportCase
      summary: Reopen a resolved case
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/operator/v1/support/cases/{case_id}/close:
    post:
      operationId: closeOperatorSupportCase
      summary: Close
      description: A reason is required; it becomes the resolution when there is none.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Decision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

tags:
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Me
    description: The signed-in staff member
  - name: Pricing
    description: Pricing a phone order
  - name: Orders
    description: Phone orders and city order monitoring
  - name: Chat
    description: Audited support access to rider-driver conversations

components:
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: "./common.yaml#/components/schemas/Uuid"
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    CreateQuote:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_class, pickup, dropoff]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"

    Caller:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          description: Caller phone in E.164 form.
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    CreatePhoneOrder:
      type: object
      additionalProperties: false
      required: [command_id, quote_id, vehicle_class, pickup, dropoff, payment_method, caller]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        quote_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
          maxLength: 300
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
          maxLength: 300
        payment_method:
          type: string
          enum: [CASH]
        call_ref:
          description: Optional telephony/call reference stored as the order source_ref; no telephony integration is implied.
          type: string
          maxLength: 200
        caller:
          $ref: "#/components/schemas/Caller"

    OperatorOrder:
      allOf:
        - $ref: "./rider.v1.yaml#/components/schemas/Order"
        - type: object
          properties:
            caller:
              oneOf:
                - $ref: "#/components/schemas/Caller"
                - type: "null"

    CancelOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: A code from GET /api/operator/v1/cancel-reasons; the order shows cancellation.by = STAFF.
          type: string
          minLength: 1
          maxLength: 40

    RevokeAssignment:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
