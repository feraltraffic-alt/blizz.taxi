openapi: 3.1.0
info:
  title: Blizz Taxi — Operator workstation API
  version: 1.0.0
  description: |
    API of the dispatcher / call-centre workstation (/api/operator/v1, REQ-API-02); tokens of the operator
    audience only, from /auth/v1/staff/sign-in.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /api/operator/v1/me:
    get:
      operationId: getOperatorMe
      summary: The signed-in staff member
      description: Same shape as in the admin API.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./admin.v1.yaml#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/operator/v1/me/emergency-grants:
    get:
      operationId: getMyEmergencyGrants
      summary: My emergency access
      description: The extra permissions a super admin gave me for a limited time, and until when (REQ-SEC-10).
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./emergency.yaml#/components/schemas/EmergencyGrantList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/operator/v1/me/password:
    post:
      operationId: changeOperatorPassword
      summary: Change the own password
      description: Required after the first sign-in and after a reset.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.v1.yaml#/components/schemas/ChangePassword"
      responses:
        "204":
          description: Done.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/operator/v1/me/bonus:
    get:
      operationId: getMyOperatorBonus
      summary: The signed-in staff member's bonus points in the current period
      description: Points for phone orders this staff member created (ADR 0011). Any staff member.
      tags: [Me]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./operator-bonuses.yaml#/components/schemas/OperatorBonusAccount"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/operator/v1/places:
    get:
      operationId: searchOperatorPlaces
      summary: Address search
      description: >-
        For a phone order; needs orders.create for the city. With caller_phone the caller's order history comes first.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: query
          in: query
          description: Blank — the latest places of the order history only.
          schema:
            type: string
            maxLength: 200
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: caller_phone
          in: query
          description: Adds the order history of the caller's rider account, when there is one.
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: History first, then own addresses, then the provider's results; at most limit.
          content:
            application/json:
              schema:
                $ref: "./places.yaml#/components/schemas/PlaceList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          description: OUTSIDE_SERVICE_AREA — the point is in no city of the service.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/operator/v1/places/reverse:
    get:
      operationId: reverseOperatorPlace
      summary: The address at a point on the map
      description: An own address within 100 m, else the provider's nearest; 204 when there is none.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: language
          in: query
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./places.yaml#/components/schemas/Place"
        "204":
          description: No address there.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          description: OUTSIDE_SERVICE_AREA — the point is in no city of the service.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/operator/v1/drivers/live:
    get:
      operationId: getLiveDrivers
      summary: The cars on the line in a city
      description: >-
        Every driver with an open or closing work session in the city, with the car, the status and the last known
        position, for the call centre's map (REQ-OPS-01). Needs orders.view for the city. Poll it; no phone numbers.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: status
          in: query
          description: Any of these (repeat the parameter).
          schema:
            type: array
            items:
              type: string
              enum: [FREE, ON_ORDER, PAUSED, CLOSING, NO_SIGNAL]
        - name: vehicle_class
          in: query
          schema:
            type: string
        - name: fresh
          in: query
          description: Only drivers with a fresh position.
          schema:
            type: boolean
            default: false
        - name: box
          in: query
          description: The part of the map in view, min_lat,min_lon,max_lat,max_lon.
          style: form
          explode: false
          schema:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: number
      responses:
        "200":
          description: By name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [city_id, at, drivers]
                properties:
                  city_id:
                    $ref: "./common.yaml#/components/schemas/Uuid"
                  at:
                    $ref: "./common.yaml#/components/schemas/Timestamp"
                  drivers:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [driver_id, has_payment_terminal, status, occupancy, connection, geolocation]
                      properties:
                        driver_id:
                          $ref: "./common.yaml#/components/schemas/Uuid"
                        name:
                          type: [string, "null"]
                        car:
                          oneOf:
                            - type: "null"
                            - type: object
                              additionalProperties: false
                              required: [registration_number, make, model, color, classes]
                              properties:
                                registration_number:
                                  type: string
                                make:
                                  type: string
                                model:
                                  type: string
                                color:
                                  type: string
                                classes:
                                  type: array
                                  items:
                                    type: string
                        has_payment_terminal:
                          type: boolean
                        status:
                          description: >-
                            FREE — may get an order now; ON_ORDER; PAUSED — not accepting; CLOSING — finishing the
                            last order; NO_SIGNAL — connection or position lost.
                          type: string
                          enum: [FREE, ON_ORDER, PAUSED, CLOSING, NO_SIGNAL]
                        occupancy:
                          type: string
                        connection:
                          type: string
                          enum: [CONNECTED, STALE, DISCONNECTED]
                        geolocation:
                          type: string
                          enum: [FRESH, STALE, UNAVAILABLE]
                        location:
                          oneOf:
                            - type: "null"
                            - type: object
                              additionalProperties: false
                              required: [lat, lon]
                              properties:
                                lat:
                                  type: number
                                lon:
                                  type: number
                        last_location_at:
                          oneOf:
                            - $ref: "./common.yaml#/components/schemas/Timestamp"
                            - type: "null"
                        order_id:
                          description: The order the driver is on.
                          oneOf:
                            - $ref: "./common.yaml#/components/schemas/Uuid"
                            - type: "null"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/quotes:
    post:
      operationId: createOperatorQuote
      summary: Price a phone order
      description: |
        The pickup determines the service city. The operator needs orders.create for that city. The quote
        belongs to the signed-in operator, expires after the normal quote lifetime and can be consumed once
        by the matching phone order (REQ-OPS-03, REQ-PRC-06).
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuote"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "./rider.v1.yaml#/components/schemas/Quote"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/operator/v1/orders:
    post:
      operationId: createOperatorOrder
      summary: Create a phone order from a quote
      description: |
        The order is created as channel PHONE by the signed-in employee. The quote must belong to that
        operator and match the class and points. Paid in CASH or by a card at the driver's own TERMINAL (owner
        decision 27.10.2026; a payment link comes later). A TERMINAL order is offered only to drivers with a terminal;
        with terminal_fallback_to_cash, drivers without one may take it from the broadcast phase and it becomes a
        CASH order on assignment (event PaymentMethodChanged). The caller is
        contact data for this order only and is not linked to or turned into a client account (REQ-OPS-02,
        REQ-OPS-03, REQ-PRC-06). The city's pause, working hours and payment methods apply as for the apps:
        422 CITY_PAUSED, CITY_CLOSED or PAYMENT_METHOD_NOT_OFFERED (REQ-TEN-03/06). When the caller's phone belongs to a rider account that is BLOCKED or has a
        pending deletion request, the order is refused with 403 ACCOUNT_NOT_ACTIVE, so the operator can tell the
        caller why; a caller without an account is not affected. The caller's phone counts toward the order limit
        (active_orders_per_payer, ADR 0012): together with that rider's app orders when the phone has an account,
        by the number alone otherwise → 409 ACTIVE_ORDER_LIMIT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePhoneOrder"
      responses:
        "201":
          description: The order, already searching for a driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
    get:
      operationId: listOperatorOrders
      summary: Orders of one city
      description: Newest first. The operator needs orders.view for the requested city.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, all]
            default: active
        - name: before
          in: query
          required: false
          description: Exclusive created_at cursor; returns older orders.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Orders of the requested city, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/orders/{order_id}:
    get:
      operationId: getOperatorOrder
      summary: One order with its caller contact
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order and caller contact when it is a phone order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/orders/{order_id}/switch-to-cash:
    post:
      operationId: operatorSwitchOrderToCash
      summary: Pay in cash instead of by card
      description: >-
        REQ-PAY-20 (owner decision 28.10.2026): a card order not yet finished (AWAITING_PAYMENT with the hold in place, SCHEDULED, READY, SEARCHING, ASSIGNED, IN_SERVICE) becomes a cash order. The card hold is released at once and the card is never charged for it. A hold whose result is not known yet → 409 PAYMENT_UNKNOWN (try again); not a card order, or nothing left to pay by card → 409 STATE_CONFLICT. Needs orders.create in the order's city; the operator acts at the rider's request and gives a reason.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorSwitchToCash"
      responses:
        "200":
          description: The order, now CASH with payment_state CASH_EXPECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOperatorOrder
      summary: Cancel an order before the trip starts
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
      responses:
        "200":
          description: Cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/revoke-assignment:
    post:
      operationId: revokeOperatorOrderAssignment
      summary: Take the driver off an order and search again
      description: Requires orders.reassign for the order city; reason is mandatory (REQ-OPS-05).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAssignment"
      responses:
        "200":
          description: Order after the assignment was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/interrupt:
    post:
      operationId: interruptTrip
      summary: Interrupt a trip in progress
      description: >-
        Only IN_SERVICE (before the start cancel or take the driver off → 409). Requires orders.interrupt for the order
        city (T-22, REQ-OPS-05). The order is cancelled by staff with a reason from the staff list; the trip is
        ABORTED where the car stopped, the part driven is free and the driver is released. With follow_up a new order
        linked by related_order_id takes the rider from follow_up_pickup (default: the driver's last position) to the
        original destination; the rider pays nothing (payment_method SERVICE) and the service pays its driver by the
        tariff. The interrupted driver is not offered it. Audited.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterruptOrder"
      responses:
        "200":
          description: The interrupted order and the follow-up, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterruptedOrder"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/remove-reservation:
    post:
      operationId: removePreorderReservation
      summary: Take the driver off a reserved pre-order
      description: >-
        At any time before the driver confirms; the pre-order stays SCHEDULED and other drivers can reserve it, or it
        goes to the search at its release time. Requires orders.reassign for the order city. Audited.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveReservation"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "./rider.v1.yaml#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/operator/v1/orders/{order_id}/events:
    get:
      operationId: getOperatorOrderEvents
      summary: Order history — who did what and why
      description: >-
        Every change of the order, oldest first, with the actor's name and role and the reason, for lines like
        "Operator Anna cancelled the order: passenger asked". Requires orders.view for the order city.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/Timeline"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/cancel-reasons:
    get:
      operationId: listOperatorCancelReasons
      summary: Reasons staff can give when cancelling
      description: The staff list from the admin panel. Requires orders.cancel.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active reasons in display order.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/ReasonList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /api/operator/v1/orders/{order_id}/messages:
    get:
      operationId: getOperatorOrderConversation
      summary: Read the order conversation for support
      description: This access is audited and requires orders.view for the order city.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrderId"
        - name: reason
          in: query
          required: true
          description: Why the operator opened the conversation; written to audit.
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        "200":
          description: Complete conversation, oldest first.
          content:
            application/json:
              schema:
                $ref: "./rider.v1.yaml#/components/schemas/ChatMessages"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/operator/v1/support/cases:
    get:
      operationId: listOperatorSupportQueue
      summary: Support queue
      description: Urgent first, then newest. Needs support.manage for the city. Problem queues (CASH_DISPUTE, TRIP_REVIEW) come from events.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          description: The queue of one city; without it, the cases without a city.
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: state
          in: query
          schema:
            $ref: "./support.yaml#/components/schemas/State"
        - name: priority
          in: query
          schema:
            $ref: "./support.yaml#/components/schemas/Priority"
        - name: category
          in: query
          schema:
