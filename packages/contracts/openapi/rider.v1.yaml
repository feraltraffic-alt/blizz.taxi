openapi: 3.1.0
info:
  title: Blizz Taxi — Rider app API
  version: 1.0.0
  description: |
    API for the rider app (/api/rider/v1, REQ-API-02). Every operation needs an access token issued
    for the `rider` audience; tokens of other audiences are rejected (REQ-USR-08).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /ws/v1/rider:
    get:
      operationId: openRiderLiveChannel
      summary: Live channel (WebSocket)
      description: >-
        Upgrade to a WebSocket with the rider access token — the `Authorization: Bearer` header, or `access_token` in
        the query where headers cannot be set. The server pushes a message for every change of an order the rider
        takes part in (section 20, REQ-NTF-04): `{"event_id", "type", "schema_version", "aggregate_type": "Order",
        "aggregate_id", "aggregate_version", "occurred_at", "correlation_id", "payload": {}}`. It carries no personal
        data: on a message the app reads the order over REST; duplicates and older versions are dropped, a gap in
        versions means read the snapshot (REQ-NTF-01). The first message is `{"type": "Connected"}`; the client may
        send `ping` (answer `{"type": "Pong"}`). Closed with code 4401 when the access token expires — reconnect with
        a fresh one. Commands stay REST (REQ-NTF-06).
      tags: [Live]
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Switching to WebSocket.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/me:
    get:
      operationId: getRiderMe
      summary: Who the access token belongs to
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current subject and session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/addresses:
    get:
      operationId: searchRiderAddresses
      summary: Search the service's own addresses near a point
      description: |
        Resolves the service city from lat/lon, searches visible service-owned addresses only and uses
        the point to break ranking ties by distance (REQ-GEO-13, REQ-GEO-15, REQ-GEO-16). Provider
        geocoding is intentionally not part of this endpoint (Q-08).
      tags: [Addresses]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 256
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Visible service-owned addresses matching the query.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/RiderAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "429":
          description: Per-rider address search rate limit exceeded.
          headers:
            Retry-After:
              $ref: "./common.yaml#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/rider/v1/addresses/nearest:
    get:
      operationId: getNearestRiderAddress
      summary: Closest visible service-owned address within 100 metres
      tags: [Addresses]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Closest visible address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderAddress"
        "204":
          description: No visible address within 100 metres.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/vehicle-classes:
    get:
      operationId: listVehicleClasses
      summary: Classes that can be ordered at a point
      description: The city comes from the point; only active classes with a tariff in force now.
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleClassOption"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/quotes:
    post:
      operationId: createQuote
      summary: Price for a class and two points
      description: |
        The server computes the price from the tariff in force (REQ-PRC-05); the quote belongs to the
        rider, lives 5 minutes and serves one order (REQ-PRC-06). Pickup outside every city → 422
        OUTSIDE_SERVICE_AREA; no tariff in force → 404.
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuote"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/rider/v1/orders:
    get:
      operationId: listRiderOrderHistory
      summary: Own order history
      description: Own orders as payer, newest first. Use created_at of the last item as the next before cursor.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: before
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Order history.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/OrderHistoryItem"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      summary: Order from a quote
      description: |
        Consumes the quote atomically with the order (REQ-PRC-06): it must belong to this rider and match
        the class and both points, otherwise 409 QUOTE_MISMATCH; used or expired → 409 QUOTE_EXPIRED. The
        price is the quote's, never the client's. A repeat of the same command returns the same order. Card
        payment is not available yet (S-09). One active order per payer → 409 ORDER_ALREADY_ACTIVE.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: The order, already searching for a driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/orders/active:
    get:
      operationId: getActiveOrder
      summary: The canonical snapshot of the current order
      description: After an app restart the rider sees the same order; 204 when there is none.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "204":
          description: No active order.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: One own order
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/orders/{order_id}/call:
    get:
      operationId: getRiderOrderCallTarget
      summary: Phone target for the active assigned driver
      description: |
        Available only to the order's payer while the assignment is COMMITTED and the order is ASSIGNED or
        IN_SERVICE. DIRECT returns the assigned driver's phone; VIA_SERVICE_NUMBERS returns only the configured
        service phone. Other orders are hidden as 404; outside the active call window → 409 STATE_CONFLICT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: Number the rider app should dial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTarget"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/cards:
    get:
      operationId: listCards
      summary: The rider's saved cards
      description: Only the masked number and type; the provider's token never leaves the server (REQ-PAY-08, ADR 0008).
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/card-bindings:
    post:
      operationId: startCardBinding
      summary: Start adding a card
      description: >-
        For the merchant of the city (404 when the city takes no cards). The app POSTs `fields` to `url` in a web view
        (the provider's page with 3-D Secure); when the web view reaches `return_url` the app reads the binding.
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCardBinding"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardBinding"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/card-bindings/{binding_id}:
    get:
      operationId: getCardBinding
      summary: Result of adding a card
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: binding_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: PENDING until the provider reports; then COMPLETED with the card, FAILED or EXPIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardBinding"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/cards/{card_id}/remove:
    post:
      operationId: removeCard
      summary: Remove a saved card
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: card_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCommand"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/push-devices:
    get:
      operationId: listRiderPushDevices
      summary: The phones that receive pushes
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active devices, oldest first.
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDeviceList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: registerRiderPushDevice
      summary: Register the app's push token
      description: >-
        Tied to the session of the access token: after a logout or a revoked session nothing more is sent to the
        phone (REQ-AUTH-07). A push is never a confirmation by itself — the app reads the order over REST
        (REQ-NTF-01). The push data carries `type` (the template), `event_type`, `event_id`, `order_id` and
        `order_version`; nothing personal.
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceRegistration"
      responses:
        "201":
          description: Registered (or refreshed, for the same token).
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDevice"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/push-devices/{device_id}/remove:
    post:
      operationId: removeRiderPushDevice
      summary: Stop pushes to a phone
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: device_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceCommand"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/cancel-reasons:
    get:
      operationId: listRiderCancelReasons
      summary: Reasons a rider can give when cancelling
      description: The rider's list from the admin panel; the app shows the label in the user's language and sends the code.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active reasons in display order.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/ReasonList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel before the trip starts
      description: >-
        reason_code is a code from GET /api/rider/v1/cancel-reasons; an unknown or inactive code → 400. The order
        shows cancellation.by = RIDER. No fee while the cancellation policy is not set (Q-07). A stale
        expected_version gets VERSION_CONFLICT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/orders/{order_id}/messages:
    get:
      operationId: listRiderMessages
      summary: Chat messages of the order
      description: Oldest first, after the given sequence. The rider reads the whole order.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessages"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      operationId: postRiderMessage
      summary: Write to the driver
      description: |
        Open once a driver is assigned and stays open in the order history (completed, cancelled), so the
        rider can write from the order details; with no driver ever assigned → 409 STATE_CONFLICT. A driver
        who withdrew or was taken off the order cannot write → 404.
        1 to 1000 characters. A repeat of the same command_id returns the same message. The conversation is
        kept for the order details in the admin panel.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessage"
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/support/cases:
    get:
      operationId: listRiderSupportCases
      summary: My support cases
      description: Newest first.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: before
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/CaseList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: openRiderSupportCase
      summary: Open a support case
      description: About one of my orders or in general; the first message is PUBLIC.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenCase"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/rider/v1/support/cases/{case_id}:
    get:
      operationId: getRiderSupportCase
      summary: One of my cases
      description: PUBLIC messages only.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/rider/v1/support/cases/{case_id}/messages:
    post:
      operationId: replyRiderSupportCase
      summary: Answer support
      description: A case waiting for me goes back to work; a resolved one is reopened; a closed one → 409.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Reply"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/support/uploads:
    post:
      operationId: openRiderSupportAttachmentUpload
      summary: Open an upload session for one support attachment
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenAttachmentUpload"
      responses:
        "201":
          description: Upload session.
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/UploadSession"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/uploads/{file_id}:
    put:
      operationId: uploadRiderSupportAttachment
      summary: Upload support attachment bytes
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
          application/pdf:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Stored file.
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/StoredFile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/support/cases/{case_id}/attachments/{file_id}:
    get:
      operationId: downloadRiderSupportAttachment
      summary: Download a PUBLIC attachment of my support case
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: Attachment bytes.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/orders/{order_id}/rating:
    get:
      operationId: getRiderOrderRating
      summary: My rating after a fulfilled trip
      description: The comment is staff-only and is never returned to the rider. Non-participants and non-fulfilled orders look like 404.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema: {$ref: "./common.yaml#/components/schemas/Uuid"}
      responses:
        "200":
          description: Active rating.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order_id, score, created_at]
                properties:
                  order_id: {type: string, format: uuid}
                  score: {type: integer, minimum: 1, maximum: 5}
                  created_at: {type: string, format: date-time}
        "401": {$ref: "./common.yaml#/components/responses/Unauthorized"}
        "404": {$ref: "./common.yaml#/components/responses/NotFound"}
    post:
      operationId: rateDriver
      summary: Rate the driver after a fulfilled trip
      description: Score 1–5. A blank comment is stored as absent. The rating may be replaced during the configured edit window; later → 409.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema: {$ref: "./common.yaml#/components/schemas/Uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command_id, score]
              properties:
                command_id: {$ref: "./common.yaml#/components/schemas/Uuid"}
                score: {type: integer, minimum: 1, maximum: 5}
                comment: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: Active rating; comment stays staff-only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order_id, score, created_at]
                properties:
                  order_id: {type: string, format: uuid}
                  score: {type: integer, minimum: 1, maximum: 5}
                  created_at: {type: string, format: date-time}
        "400": {$ref: "./common.yaml#/components/responses/BadRequest"}
        "401": {$ref: "./common.yaml#/components/responses/Unauthorized"}
        "404": {$ref: "./common.yaml#/components/responses/NotFound"}
        "409": {$ref: "./common.yaml#/components/responses/Conflict"}

  /api/rider/v1/safety-contacts:
    get:
      operationId: getRiderSafetyContacts
      summary: Support and emergency contacts for the safety button
      description: >-
        For city_id, or without it for the city of the rider's active order; neither → 400. A city without
        configured contacts gets 112 and no support phone. Labels in the rider's language. Nothing is sent to
        emergency services automatically (REQ-RID-09).
      tags: [Safety]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: false
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./safety.yaml#/components/schemas/SafetyContacts"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

tags:
  - name: Safety
    description: The safety button — support and emergency contacts (REQ-RID-09)
  - name: Push
    description: Push notifications to the app (section 20)
  - name: Live
    description: Live updates over WebSocket (section 20)
  - name: Cards
    description: Saved cards for paying by card (ADR 0008)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Chat
    description: Rider–driver chat of the order
  - name: Account
    description: The signed-in rider
  - name: Addresses
    description: Service-owned pickup and drop-off addresses
  - name: Pricing
    description: Vehicle classes and quotes (section 15)
  - name: Orders
    description: Orders of the rider (section 9)

components:
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, session_id, account_state]
      properties:
        subject_type:
          type: string
          const: CLIENT
        subject_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        session_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          type: string

    RiderAddress:
      type: object
      additionalProperties: false
      required: [id, kind, label, street, house, pickup]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        kind:
          type: string
          enum: [HOUSE, PLACE, ENTRANCE]
        label:
          type: string
        street:
          type: string
        house:
          description: Display form of the house number, including suffix/building when present.
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        instructions:
          type: [string, "null"]

    VehicleClassOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          examples: [STANDARD]
        name:
          type: string

    CreateQuote:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_class, pickup, dropoff]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          description: Class code from listVehicleClasses.
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_at:
          description: >-
            Pickup time for an order for later. At least threshold_minutes ahead (config bootstrap) it is a
            pre-order that waits as SCHEDULED (ADR 0006); nearer, it is an ordinary order searched for at once. At
            most max_days_ahead days ahead; in the past → 400.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    Quote:
      type: object
      additionalProperties: false
      required: [id, vehicle_class, city_id, amount_minor, currency, distance_m, duration_s, expires_at, waiting,
                 pickup_at, preorder]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        distance_m:
          description: Estimated route length.
          type: integer
          format: int64
        duration_s:
          description: Estimated travel time.
          type: integer
          format: int64
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        waiting:
          $ref: "#/components/schemas/WaitingTerms"
        pickup_at:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        preorder:
          description: True when the order will be a pre-order; the price includes the pre-order surcharge.
          type: boolean

    WaitingTerms:
      description: |
        Paid waiting at the pickup, set per tariff by the admin (REQ-PRC-09, Q-07). After free_minutes from
        the driver's confirmed arrival, waiting is counted in steps of step_seconds (1 = per second,
        60 = per minute); the number of steps is rounded — UP every started step, DOWN only full steps,
        HALF_UP the nearer one; each charged minute costs per_minute_minor. The charge is added to the final
        fare (final_price_minor).
      type: object
      additionalProperties: false
      required: [free_minutes, per_minute_minor, step_seconds, rounding]
      properties:
        free_minutes:
          type: integer
          minimum: 0
        per_minute_minor:
          description: Minor units per minute; may be fractional.
          type: number
          minimum: 0
        step_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        rounding:
          type: string
          enum: [UP, DOWN, HALF_UP]

    CreateOrder:
      type: object
      additionalProperties: false
      required: [command_id, quote_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        quote_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
          maxLength: 300
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
          maxLength: 300
        payment_method:
          description: >-
            CARD — the rider's saved card for the city (GET /api/rider/v1/cards; no card → 400). The order is created
            AWAITING_PAYMENT; the agreed price is held on the card and only then the search starts (or a pre-order
            waits SCHEDULED). A declined hold ends the order UNFULFILLED with status_reason PAYMENT_DECLINED.
          type: string
          enum: [CASH, CARD]
        channel:
          description: APP (default) or WEB; where the rider ordered from.
          type: string
          enum: [APP, WEB]
        pickup_at:
          description: The quote's pickup time; must be the same as in CreateQuote, otherwise QUOTE_MISMATCH.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, order_id, sequence, sender_role, body, sent_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        sequence:
          type: integer
          format: int64
          minimum: 1
        sender_role:
          type: string
          enum: [RIDER, DRIVER]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        sent_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ChatMessages:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    PostChatMessage:
      type: object
      additionalProperties: false
      required: [command_id, body]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        body:
          type: string
          minLength: 1
          maxLength: 1000

    Card:
      type: object
      additionalProperties: false
      required: [id, merchant_id, masked_pan, card_type, created_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        merchant_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        masked_pan:
          type: string
          examples: ["41****1111"]
        card_type:
          type: [string, "null"]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"

    StartCardBinding:
      type: object
      additionalProperties: false
      required: [command_id, city_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    CardBinding:
      type: object
      additionalProperties: false
      required: [id, state, expires_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [PENDING, COMPLETED, FAILED, EXPIRED]
        url:
          description: Where the web view POSTs the form; only in the answer to the start.
          type: [string, "null"]
        fields:
          description: Form fields to POST as application/x-www-form-urlencoded.
          type: [object, "null"]
          additionalProperties:
            type: string
        return_url:
          type: [string, "null"]
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        card:
          oneOf:
            - $ref: "#/components/schemas/Card"
            - type: "null"
        failure_reason:
          type: [string, "null"]

    CardCommand:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    CancelOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: A code from the rider's list of cancellation reasons.
          type: string
          minLength: 1
          maxLength: 40

    CallTarget:
      type: object
      additionalProperties: false
      required: [mode, phone]
      properties:
        mode:
          type: string
          enum: [DIRECT, VIA_SERVICE_NUMBERS]
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    Assignment:
      type: object
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
        trip_phase:
          type: [string, "null"]

    HistoryVehicle:
      type: object
      additionalProperties: false
      required: [make, model, color, registration_number]
      properties:
        make:
          type: string
        model:
          type: string
        color:
          type: string
        registration_number:
          type: string

    HistoryDriver:
      type: object
      additionalProperties: false
      required: [name, vehicle]
      properties:
        name:
          type: [string, "null"]
        vehicle:
          $ref: "#/components/schemas/HistoryVehicle"

    OrderHistoryItem:
      type: object
      additionalProperties: false
      required: [id, short_number, status, created_at, pickup_label, dropoff_label, vehicle_class,
                 price_minor, final_price_minor, currency, payment_method, driver, chat_available, cancellation,
                 pickup_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        status:
          type: string
          enum: [SCHEDULED, AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED, UNFULFILLED]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        vehicle_class:
          type: string
        price_minor:
          type: [integer, "null"]
          format: int64
        final_price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        driver:
          oneOf:
            - $ref: "#/components/schemas/HistoryDriver"
            - type: "null"
        chat_available:
          description: True for the last assigned driver only while that assignment was not released or revoked.
          type: boolean
        cancellation:
          $ref: "./cancellation.yaml#/components/schemas/Cancellation"
        pickup_at:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"

    Order:
      type: object
      required: [id, short_number, status, version, channel, city_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        status:
          type: string
          enum: [SCHEDULED, AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED, UNFULFILLED]
        status_reason:
          type: [string, "null"]
        version:
          type: integer
          format: int64
        channel:
          description: Where the order came from.
          type: string
          enum: [APP, WEB, PHONE, PARTNER]
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
        payment_method:
          type: string
          description: TERMINAL — a card at the driver's own terminal, only in phone orders.
          enum: [CASH, CARD, SERVICE, TERMINAL]
        payment_state:
          type: [string, "null"]
          description: >-
            Cash — what the driver reported. Card (ADR 0008) — AUTH_PENDING while the hold is asked for (the order is
            AWAITING_PAYMENT and no search runs), AUTHORIZED once it is held, PAYMENT_DECLINED when the bank refused.
            Terminal — what the driver reported, like cash.
          enum: [CASH_EXPECTED, CASH_REPORTED, CASH_NOT_RECEIVED, AUTH_PENDING, AUTHORIZED, PAYMENT_DECLINED,
                 HOLD_RELEASED, CAPTURE_PENDING, PAID, PARTIALLY_PAID, TERMINAL_EXPECTED, TERMINAL_REPORTED,
                 TERMINAL_NOT_RECEIVED, null]
        price_minor:
          description: Agreed price from the quote.
          type: [integer, "null"]
          format: int64
        final_price_minor:
          description: Final fare, set when the trip is completed (REQ-PRC-10).
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        search_phase:
          type: [string, "null"]
          enum: [PERSONAL, BROADCAST, STOPPED, EXHAUSTED, null]
        assignment:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        cancellation:
          $ref: "./cancellation.yaml#/components/schemas/Cancellation"
        pickup_at:
          description: Requested pickup time of an order for later; null for an order for now.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        related_order_id:
          description: >-
            On a follow-up: the interrupted order it continues (T-22). Its payment_method is SERVICE — the rider pays
            nothing for it.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        preorder:
          description: >-
            A pre-order (ADR 0006): SCHEDULED until it is released into the search before pickup_at. It does not
            count as the rider's active order, so the rider can order a ride now as well.
          type: boolean