              $ref: "./support.yaml#/components/schemas/Reply"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/support/uploads:
    post:
      operationId: openRiderSupportAttachmentUpload
      summary: Open an upload session for one support attachment
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenAttachmentUpload"
      responses:
        "201":
