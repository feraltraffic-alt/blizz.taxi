openapi: 3.1.0
info:
  title: Blizz Taxi — Rider app API
  version: 1.0.0
  description: |
    API for the rider app (/api/rider/v1, REQ-API-02). Every operation needs an access token issued
    for the `rider` audience; tokens of other audiences are rejected (REQ-USR-08).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /api/rider/v1/me:
    get:
      operationId: getRiderMe
      summary: Who the access token belongs to
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current subject and session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/vehicle-classes:
    get:
      operationId: listVehicleClasses
      summary: Classes that can be ordered at a point
      description: The city comes from the point; only active classes with a tariff in force now.
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleClassOption"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/quotes:
    post:
      operationId: createQuote
      summary: Price for a class and two points
      description: |
        The server computes the price from the tariff in force (REQ-PRC-05); the quote belongs to the
        rider, lives 5 minutes and serves one order (REQ-PRC-06). Pickup outside every city → 422
        OUTSIDE_SERVICE_AREA; no tariff in force → 404.
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuote"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/rider/v1/orders:
    post:
      operationId: createOrder
      summary: Order from a quote
      description: |
        Consumes the quote atomically with the order (REQ-PRC-06): it must belong to this rider and match
        the class and both points, otherwise 409 QUOTE_MISMATCH; used or expired → 409 QUOTE_EXPIRED. The
        price is the quote's, never the client's. A repeat of the same command returns the same order. Card
        payment is not available yet (S-09). One active order per payer → 409 ORDER_ALREADY_ACTIVE.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: The order, already searching for a driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/orders/active:
    get:
      operationId: getActiveOrder
      summary: The canonical snapshot of the current order
      description: After an app restart the rider sees the same order; 204 when there is none.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "204":
          description: No active order.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: One own order
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel before the trip starts
      description: No fee while the cancellation policy is not set (Q-07). A stale expected_version gets VERSION_CONFLICT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

tags:
  - name: Account
    description: The signed-in rider
  - name: Pricing
    description: Vehicle classes and quotes (section 15)
  - name: Orders
    description: Orders of the rider (section 9)

components:
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, session_id, account_state]
      properties:
        subject_type:
          type: string
          const: CLIENT
        subject_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        session_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          type: string

    VehicleClassOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          examples: [STANDARD]
        name:
          type: string

    CreateQuote:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_class, pickup, dropoff]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          description: Class code from listVehicleClasses.
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"

    Quote:
      type: object
      additionalProperties: false
      required: [id, vehicle_class, city_id, amount_minor, currency, distance_m, duration_s, expires_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        distance_m:
          description: Estimated route length.
          type: integer
          format: int64
        duration_s:
          description: Estimated travel time.
          type: integer
          format: int64
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    CreateOrder:
      type: object
      additionalProperties: false
      required: [command_id, quote_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        quote_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
          maxLength: 300
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
          maxLength: 300
        payment_method:
          type: string
          enum: [CASH, CARD]
        channel:
          description: APP (default) or WEB; where the rider ordered from.
          type: string
          enum: [APP, WEB]

    CancelOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          type: string

    Assignment:
      type: object
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
        trip_phase:
          type: [string, "null"]

    Order:
      type: object
      required: [id, short_number, status, version, channel, city_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        status:
          type: string
          enum: [AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED, UNFULFILLED]
        status_reason:
          type: [string, "null"]
        version:
          type: integer
          format: int64
        channel:
          description: Where the order came from.
          type: string
          enum: [APP, WEB, PHONE, PARTNER]
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
        payment_method:
          type: string
          enum: [CASH, CARD]
        payment_state:
          type: [string, "null"]
          enum: [CASH_EXPECTED, CASH_REPORTED, CASH_NOT_RECEIVED, null]
        price_minor:
          description: Agreed price from the quote.
          type: [integer, "null"]
          format: int64
        final_price_minor:
          description: Final fare, set when the trip is completed (REQ-PRC-10).
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        search_phase:
          type: [string, "null"]
          enum: [PERSONAL, BROADCAST, STOPPED, EXHAUSTED, null]
        assignment:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
