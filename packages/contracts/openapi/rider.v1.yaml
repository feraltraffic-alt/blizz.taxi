          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/orders/{order_id}/messages:
    get:
      operationId: listRiderMessages
      summary: Chat messages of the order
      description: Oldest first, after the given sequence. The rider reads the whole order.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessages"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      operationId: postRiderMessage
      summary: Write to the driver
      description: |
        Open once a driver is assigned and for 24 hours after the trip or the cancellation, so the rider can
        write from the order details; later it is read-only and contact goes through support (owner decision
        29.10.2026) → 409 STATE_CONFLICT; with no driver ever assigned → 409 STATE_CONFLICT. A driver
        who withdrew or was taken off the order cannot write → 404.
        1 to 1000 characters. A repeat of the same command_id returns the same message. The conversation is
        kept for the order details in the admin panel.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessage"
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/support/cases:
    get:
      operationId: listRiderSupportCases
      summary: My support cases
      description: Newest first.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Before"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/CaseList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: openRiderSupportCase
      summary: Open a support case
      description: About one of my orders or in general; the first message is PUBLIC.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenCase"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/rider/v1/support/cases/{case_id}:
    get:
      operationId: getRiderSupportCase
      summary: One of my cases
      description: PUBLIC messages only.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/rider/v1/support/cases/{case_id}/messages:
    post:
      operationId: replyRiderSupportCase
      summary: Answer support
      description: A case waiting for me goes back to work; a resolved one is reopened; a closed one → 409.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
