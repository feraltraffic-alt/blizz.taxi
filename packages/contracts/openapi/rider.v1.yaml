  /api/rider/v1/orders/{order_id}/rating:
    get:
      operationId: getRiderOrderRating
      summary: My rating after a fulfilled trip
      description: The comment is staff-only and is never returned to the rider. Non-participants and non-fulfilled orders look like 404.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema: {$ref: "./common.yaml#/components/schemas/Uuid"}
      responses:
        "200":
          description: Active rating.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order_id, score, created_at]
                properties:
                  order_id: {type: string, format: uuid}
                  score: {type: integer, minimum: 1, maximum: 5}
                  created_at: {type: string, format: date-time}
        "401": {$ref: "./common.yaml#/components/responses/Unauthorized"}
        "404": {$ref: "./common.yaml#/components/responses/NotFound"}
    post:
      operationId: rateDriver
      summary: Rate the driver after a fulfilled trip
      description: Score 1–5. A blank comment is stored as absent. The rating may be replaced during the configured edit window; later → 409.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema: {$ref: "./common.yaml#/components/schemas/Uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command_id, score]
              properties:
                command_id: {$ref: "./common.yaml#/components/schemas/Uuid"}
                score: {type: integer, minimum: 1, maximum: 5}
                comment: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: Active rating; comment stays staff-only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order_id, score, created_at]
                properties:
                  order_id: {type: string, format: uuid}
                  score: {type: integer, minimum: 1, maximum: 5}
                  created_at: {type: string, format: date-time}
        "400": {$ref: "./common.yaml#/components/responses/BadRequest"}
        "401": {$ref: "./common.yaml#/components/responses/Unauthorized"}
        "404": {$ref: "./common.yaml#/components/responses/NotFound"}
        "409": {$ref: "./common.yaml#/components/responses/Conflict"}

  /api/rider/v1/orders/{order_id}/tip:
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Uuid"
    get:
      operationId: getTipOptions
      summary: The tip screen of a fulfilled trip
      description: Presets, the bounds of an own amount, how the tip would be paid, until when; the tip already left.
      tags: [Tips]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./tips.yaml#/components/schemas/TipOptions"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      operationId: leaveTip
      summary: Leave a tip for the driver
      description: >-
        Once per order (a declined card tip may be left again), within the window after the trip. By card the
        answer is PENDING until the bank answers — read the tip screen again. Without enough bonuses the order's own
        method is used.
      tags: [Tips]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./tips.yaml#/components/schemas/LeaveTip"
      responses:
        "201":
          description: Left.
          content:
            application/json:
              schema:
                $ref: "./tips.yaml#/components/schemas/Tip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/places:
    get:
      operationId: searchRiderPlaces
      summary: Address search
      description: >-
        The rider's past order places, the service's own addresses, the chosen provider's results; nothing is stored.
      tags: [Places]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: query
          in: query
          description: Blank — the latest places of the order history only.
          schema:
            type: string
            maxLength: 200
            default: ""
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: language
          in: query
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: History first, then own addresses, then the provider's results; at most limit.
          content:
            application/json:
              schema:
                $ref: "./places.yaml#/components/schemas/PlaceList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          description: OUTSIDE_SERVICE_AREA — the point is in no city of the service.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/rider/v1/places/reverse:
    get:
      operationId: reverseRiderPlace
      summary: The address at a point on the map
      description: An own address within 100 m, else the provider's nearest; 204 when there is none.
      tags: [Places]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: language
          in: query
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./places.yaml#/components/schemas/Place"
        "204":
          description: No address there.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          description: OUTSIDE_SERVICE_AREA — the point is in no city of the service.
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/rider/v1/safety-contacts:
    get:
      operationId: getRiderSafetyContacts
      summary: Support and emergency contacts for the safety button
      description: >-
        For city_id, or without it for the city of the rider's active order; neither → 400. A city without
        configured contacts gets 112 and no support phone. Labels in the rider's language. Nothing is sent to
        emergency services automatically (REQ-RID-09).
      tags: [Safety]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: city_id
          in: query
          required: false
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./safety.yaml#/components/schemas/SafetyContacts"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/wallet:
    get:
      operationId: getRiderWallet
      summary: My bonus account
      description: Balances per currency and the latest movements with who and why (ADR 0009).
      tags: [Wallet]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./wallets.yaml#/components/schemas/Wallet"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/wallet/card-top-ups:
    post:
      operationId: startRiderCardTopUp
      summary: Top up the bonus account by card
      description: >-
        Opens the provider's payment page of the city's merchant (404 when the city takes no cards). The app POSTs
        `fields` to `url` in a web view; the account is credited when the provider confirms the payment.
      tags: [Wallet]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./wallets.yaml#/components/schemas/StartCardTopUp"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "./wallets.yaml#/components/schemas/CardTopUp"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/wallet/card-top-ups/{top_up_id}:
    get:
      operationId: getRiderCardTopUp
      summary: Result of a card top-up
      tags: [Wallet]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: top_up_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: PENDING until the provider reports; then COMPLETED, FAILED or EXPIRED.
          content:
            application/json:
              schema:
                $ref: "./wallets.yaml#/components/schemas/CardTopUp"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/me/phone-change/current-code:
    post:
      operationId: requestRiderCurrentPhoneCode
      summary: Step one of a phone change — a code to the current phone
      description: >-
        REQ-AUTH-08. A code of purpose PHONE_CHANGE to the account's current phone, with the same resend delay and
        budgets as sign-in. Together with the code to the new phone it protects the account from a stolen session
        or a stolen SIM alone.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: "./phone-change.yaml#/components/schemas/PhoneChangeCode"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"
  /api/rider/v1/me/phone-change/new-code:
    post:
      operationId: requestRiderNewPhoneCode
      summary: Step two of a phone change — a code to the new phone
      description: >-
        A code of purpose NEW_PHONE to the new phone, bound to this account. The answer is the same whoever has the
        number; the account's own current phone → 409 STATE_CONFLICT.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./phone-change.yaml#/components/schemas/NewPhone"
      responses:
        "201":
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: "./phone-change.yaml#/components/schemas/PhoneChangeCode"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"
  /api/rider/v1/me/phone-change:
    post:
      operationId: changeRiderPhone
      summary: Step three — change the phone with both codes
      description: >-
        A command. The phone becomes the new one and every other session of the account ends; this one stays. A
        wrong code → 422 OTP_INVALID. The new phone being the current one or another account's → 409 STATE_CONFLICT
        (accounts are never merged). An account that is not ACTIVE → 403 ACCOUNT_NOT_ACTIVE. Audited with masked
        numbers.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./phone-change.yaml#/components/schemas/PhoneChangeCommand"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "./phone-change.yaml#/components/schemas/PhoneChanged"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/me/data-exports/challenge:
    post:
      operationId: requestDataExportCode
      summary: Send a code to confirm a copy of my data
      description: >-
        Step one of getting a copy of the personal data (REQ-PRV-07): a code of purpose DATA_EXPORT goes to the rider's current phone, with the same resend delay and budgets as sign-in.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DataExportCodeChallenge"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"

  /api/rider/v1/me/data-exports:
    post:
      operationId: requestDataExport
      summary: Ask for a copy of my data
      description: >-
        Step two, a command: with the code of step one the server starts building one JSON file with the rider's data in every part of the service — profile and sessions, orders with routes and prices, ratings, tips, chat messages sent, money movements, cards and card payments, promotion bonuses, push devices, support cases, calls and codes sent. Other people's data (the driver, the person an order was for) and staff are left out. At most one a day (409 STATE_CONFLICT); an account that is not ACTIVE or DELETION_PENDING → 403 ACCOUNT_NOT_ACTIVE; wrong code → 422 OTP_INVALID. Audited.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DataExportCommand"
      responses:
        "202":
          description: Queued; poll the export until READY.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DataExport"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
    get:
      operationId: listDataExports
      summary: My copies of my data
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DataExportList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/me/data-exports/{export_id}:
    get:
      operationId: getDataExport
      summary: A copy of my data
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: export_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DataExport"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/me/data-exports/{export_id}/file:
    get:
      operationId: downloadDataExport
      summary: Download the copy of my data
      description: >-
        The JSON file, as an attachment, Cache-Control no-store; only while READY and not expired (7 days), otherwise 409 STATE_CONFLICT. Audited.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: export_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: The file. `sections` holds one key per part of the service.
          content:
            application/json:
              schema:
                type: object
                required: [format, generated_at, client_id, sections]
                properties:
                  format:
                    type: integer
                    const: 1
                  generated_at:
                    $ref: "./common.yaml#/components/schemas/Timestamp"
                  client_id:
                    $ref: "./common.yaml#/components/schemas/Uuid"
                  sections:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/me/deletion-request/challenge:
    post:
      operationId: requestAccountDeletionCode
      summary: Send a code to confirm the account deletion
      description: >-
        Step one of deleting the account (REQ-RID-10): a code of purpose ACCOUNT_DELETION goes to the rider's current
        phone, with the same resend delay and budgets as sign-in. A sign-in code does not confirm a deletion.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/DeletionCodeChallenge"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"

  /api/rider/v1/me/deletion-request:
    post:
      operationId: requestAccountDeletion
      summary: Ask to delete the account
      description: >-
        Step two, a command: with the code of step one, ACTIVE or BLOCKED → DELETION_PENDING. Every other session
        of the rider ends; this one stays, so the app can show the request and offer to cancel it. While the
        request is pending the rider can sign in but not order (403 ACCOUNT_NOT_ACTIVE). Staff complete it by
        hand: the profile is anonymized, the bonuses burn; orders, payments and the journal stay. Wrong or used
        code → 422 OTP_INVALID; from another state → 409 STATE_CONFLICT.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionRequestCommand"
      responses:
        "200":
          description: Requested.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/AccountDeletionStatus"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/me/deletion-request/cancel:
    post:
      operationId: cancelAccountDeletion
      summary: Withdraw the deletion request
      description: >-
        A command: DELETION_PENDING → the state the account had before, as long as staff have not completed the
        request; otherwise 409 STATE_CONFLICT.
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./privacy.yaml#/components/schemas/DeletionCancelCommand"
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: "./privacy.yaml#/components/schemas/AccountDeletionStatus"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

tags:
  - name: Legal
    description: Legal texts in force and their acceptance (REQ-PRV-08)
  - name: Places
    description: Address search (ADR 0012, Q-08)
  - name: Tips
    description: Tips for the driver after the trip (ADR 0012)
  - name: Safety
    description: The safety button — support and emergency contacts (REQ-RID-09)
  - name: Wallet
    description: The bonus account (ADR 0009)
  - name: Push
    description: Push notifications to the app (section 20)
  - name: Live
    description: Live updates over WebSocket (section 20)
  - name: Cards
    description: Saved cards for paying by card (ADR 0008)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Chat
    description: Rider–driver chat of the order
  - name: Account
    description: The signed-in rider
  - name: Addresses
    description: Service-owned pickup and drop-off addresses
  - name: Pricing
    description: Vehicle classes and quotes (section 15)
  - name: Orders
    description: Orders of the rider (section 9)

components:
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, session_id, account_state]
      properties:
        subject_type:
          type: string
          const: CLIENT
        subject_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        session_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          type: string

    RiderAddress:
      type: object
      additionalProperties: false
      required: [id, kind, label, street, house, pickup]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        kind:
          type: string
          enum: [HOUSE, PLACE, ENTRANCE]
        label:
          type: string
        street:
          type: string
        house:
          description: Display form of the house number, including suffix/building when present.
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        instructions:
          type: [string, "null"]

    VehicleClassOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          examples: [STANDARD]
        name:
          type: string

    CreateQuote:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_class, pickup, dropoff]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          description: Class code from listVehicleClasses.
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_at:
          description: >-
            Pickup time for an order for later. At least threshold_minutes ahead (config bootstrap) it is a
            pre-order that waits as SCHEDULED (ADR 0006); nearer, it is an ordinary order searched for at once. At
            most max_days_ahead days ahead; in the past → 400.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    Quote:
      type: object
      additionalProperties: false
      required: [id, vehicle_class, city_id, amount_minor, currency, distance_m, duration_s, route_source,
                 expires_at, waiting, pickup_at, preorder, discount_minor, to_pay_minor, promotions, payment_methods,
                 card_hold_minor]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        distance_m:
          description: Estimated route length.
          type: integer
          format: int64
        duration_s:
          description: Estimated travel time.
          type: integer
          format: int64
        route_source:
          description: >-
            ROUTER — the distance and time of a route on the roads; STRAIGHT_LINE — an estimate from the straight line,
            because no router is configured or it did not answer (REQ-GEO-08). The apps say so next to the price.
            A server may refuse straight-line prices instead (503 PROVIDER_UNAVAILABLE).
          type: string
          enum: [ROUTER, STRAIGHT_LINE]
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        waiting:
          $ref: "#/components/schemas/WaitingTerms"
        pickup_at:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        preorder:
          description: True when the order will be a pre-order; the price includes the pre-order surcharge.
          type: boolean
        discount_minor:
          description: What the rider's promotions take off amount_minor (ADR 0009); the service pays it.
          type: integer
          format: int64
        to_pay_minor:
          description: What the rider pays (before bonuses of the account) — amount_minor minus discount_minor.
          type: integer
          format: int64
        promotions:
          description: Promotions that applied; a BONUS is credited to the account after the trip.
          type: array
          items:
            $ref: "./promotions.yaml#/components/schemas/AppliedPromotion"
        payment_methods:
          description: >-
            How the payer of this quote may pay an order made from it (REQ-PRC-05), sorted: the methods the city
            offers, of them CASH and CARD for a rider (CARD only while card payments are switched on) and CASH and
            TERMINAL for an operator's phone order. Vehicle classes have no payment rule of their own, so every class
            of the city has the same list. Whether the rider has a saved card is not checked here.
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [CASH, CARD, TERMINAL]
        card_hold_minor:
          description: >-
            What a card order made from this quote holds on the card: to_pay_minor, less the bonuses the rider
            chooses to use at the order. Null when CARD is not in payment_methods.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"

    WaitingTerms:
      description: |
        Paid waiting at the pickup, set per tariff by the admin (REQ-PRC-09, Q-07). After free_minutes from
        the driver's confirmed arrival, waiting is counted in steps of step_seconds (1 = per second,
        60 = per minute); the number of steps is rounded — UP every started step, DOWN only full steps,
        HALF_UP the nearer one; each charged minute costs per_minute_minor. The charge is added to the final
        fare (final_price_minor).
      type: object
      additionalProperties: false
      required: [free_minutes, per_minute_minor, step_seconds, rounding]
      properties:
        free_minutes:
          type: integer
          minimum: 0
        per_minute_minor:
          description: Minor units per minute; may be fractional.
          type: number
          minimum: 0
        step_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        rounding:
          type: string
          enum: [UP, DOWN, HALF_UP]

    CreateOrder:
      type: object
      additionalProperties: false
      required: [command_id, quote_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        comment:
          description: >-
            For the driver (REQ-DRV-07, issue #143): what to know at the pickup, up to 500 characters. Shown in the
            offer and the trip.
          type: [string, "null"]
          maxLength: 500
        entrance:
          description: Where exactly to come, e.g. "entrance 3, from the yard", up to 100 characters.
          type: [string, "null"]
          maxLength: 100
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        quote_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
          maxLength: 64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
          maxLength: 300
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
          maxLength: 300
        payment_method:
          description: >-
            CARD — the rider's saved card for the city (GET /api/rider/v1/cards; no card → 400). The order is created
            AWAITING_PAYMENT; the agreed price is held on the card and only then the search starts (or a pre-order
            waits SCHEDULED). A declined hold ends the order UNFULFILLED with status_reason PAYMENT_DECLINED. A hold
            the bank has not answered within the deadline (blizz.orders.card-hold-deadline, 3 minutes by default;
            REQ-PAY-02) ends it UNFULFILLED with status_reason PAYMENT_TIMEOUT and payment_state HOLD_RELEASED: a
            success that comes later is voided, never captured.
          type: string
          enum: [CASH, CARD]
        channel:
          description: APP (default) or WEB; where the rider ordered from.
          type: string
          enum: [APP, WEB]
        pickup_at:
          description: The quote's pickup time; must be the same as in CreateQuote, otherwise QUOTE_MISMATCH.
          $ref: "./common.yaml#/components/schemas/Timestamp"
        wallet_minor:
          description: >-
            Bonuses of my account to pay part of the price (ADR 0009); at most the price is used, the rest is paid in
            CASH or by CARD. More than available → 422 WALLET_INSUFFICIENT ("not enough on the balance, choose another
            way to pay"). A CARD order the bonuses pay in full becomes CASH for anything the trip adds.
          type: [integer, "null"]
          format: int64
          minimum: 0
        recipient:
          description: >-
            The person the taxi is for, when it is not me (ADR 0012 Q-03, REQ-OPS-02). The driver sees the name and
            calls this phone once the order is assigned, never before; I stay the payer.
          type: [object, "null"]
          additionalProperties: false
          required: [phone]
          properties:
            name:
              type: [string, "null"]
              maxLength: 120
            phone:
              description: International format (E.164); separators are ignored.
              type: string

    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, order_id, sequence, sender_role, body, sent_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        sequence:
          type: integer
          format: int64
          minimum: 1
        sender_role:
          type: string
          enum: [RIDER, DRIVER]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        sent_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ChatMessages:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    PostChatMessage:
      type: object
      additionalProperties: false
      required: [command_id, body]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        body:
          type: string
          minLength: 1
          maxLength: 1000

    Card:
      type: object
      additionalProperties: false
      required: [id, merchant_id, masked_pan, card_type, created_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        merchant_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        masked_pan:
          type: string
          examples: ["41****1111"]
        card_type:
          type: [string, "null"]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    CardList:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"

    StartCardBinding:
      type: object
      additionalProperties: false
      required: [command_id, city_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    CardBinding:
      type: object
      additionalProperties: false
      required: [id, state, expires_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [PENDING, COMPLETED, FAILED, EXPIRED]
        url:
          description: Where the web view POSTs the form; only in the answer to the start.
          type: [string, "null"]
        fields:
          description: Form fields to POST as application/x-www-form-urlencoded.
          type: [object, "null"]
          additionalProperties:
            type: string
        return_url:
          type: [string, "null"]
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        card:
          oneOf:
            - $ref: "#/components/schemas/Card"
            - type: "null"
        failure_reason:
          type: [string, "null"]

    CardCommand:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    SwitchToCash:
      type: object
      additionalProperties: false
      required: [command_id, expected_version]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
    CancelOrder:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: A code from the rider's list of cancellation reasons.
          type: string
          minLength: 1
          maxLength: 40

    CallTarget:
      type: object
      additionalProperties: false
      required: [mode, phone]
      properties:
        mode:
          type: string
          enum: [DIRECT, VIA_SERVICE_NUMBERS]
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    Assignment:
      type: object
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        source:
          type: string
          enum: [OFFER, BROADCAST, RESERVATION]
        trip_id:
          type: [string, "null"]
          format: uuid
        state:
          type: string
          enum: [RESERVED, COMMITTED, RELEASED, REVOKED, COMPLETED]
        trip_phase:
          type: [string, "null"]
          enum: [TO_PICKUP, WAITING, IN_PROGRESS, COMPLETED, ABORTED, null]

    DriverCard:
      type: object
      additionalProperties: false
      required: [name, make, model, color, registration_number, photo_url]
      properties:
        name:
          type: [string, "null"]
        make:
          type: string
        model:
          type: string
        color:
          type: string
        registration_number:
          type: string
        photo_url:
          description: Null until driver photos exist (REQ-DRV-01).
          type: [string, "null"]

    HistoryVehicle:
      type: object
      additionalProperties: false
      required: [make, model, color, registration_number]
      properties:
        make:
          type: string
        model:
          type: string
        color:
          type: string
        registration_number:
          type: string

    HistoryDriver:
      type: object
      additionalProperties: false
      required: [name, vehicle]
      properties:
        name:
          type: [string, "null"]
        vehicle:
          $ref: "#/components/schemas/HistoryVehicle"

    OrderHistoryItem:
      type: object
      additionalProperties: false
      required: [id, short_number, status, created_at, pickup_label, dropoff_label, vehicle_class,
                 price_minor, final_price_minor, currency, payment_method, driver, chat_available, cancellation,
                 pickup_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        status:
          type: string
          enum: [SCHEDULED, AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED, UNFULFILLED]
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        vehicle_class:
          type: string
        price_minor:
          type: [integer, "null"]
          format: int64
        final_price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        driver:
          oneOf:
            - $ref: "#/components/schemas/HistoryDriver"
            - type: "null"
        chat_available:
          description: True for the last assigned driver only while that assignment was not released or revoked.
          type: boolean
        cancellation:
          $ref: "./cancellation.yaml#/components/schemas/Cancellation"
        pickup_at:
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"

    Order:
      type: object
      required: [id, short_number, status, version, channel, city_id, vehicle_class, pickup, dropoff, payment_method]
      properties:
        pickup_eta:
          description: >-
            While the driver is on the way to the pickup (trip TO_PICKUP): a forecast, never a promise (REQ-RID-04), from
            the driver's last position on the server. Null in every other state and when no position is known — never
            a made-up value. Shown in the rider's order reads (GET /orders/{id}, /current, /active); command answers
            leave it null.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [seconds, distance_metres, source, location_at, stale]
              properties:
                seconds:
                  description: Driving time from that position to the pickup.
                  type: integer
                  format: int64
                  minimum: 0
                distance_metres:
                  type: integer
                  format: int64
                  minimum: 0
                source:
                  description: ROUTER — on the roads; STRAIGHT_LINE — from the straight line, when no router answered.
                  type: string
                  enum: [ROUTER, STRAIGHT_LINE]
                location_at:
                  description: When the driver was at that position; the ETA counts from then.
                  type: string
                  format: date-time
                stale:
                  description: The position is older than the freshness limit; show the forecast as uncertain.
                  type: boolean
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        status:
          type: string
          enum: [SCHEDULED, AWAITING_PAYMENT, READY, SEARCHING, ASSIGNED, IN_SERVICE, FULFILLED, CANCELLED, UNFULFILLED]
        status_reason:
          type: [string, "null"]
        version:
          type: integer
          format: int64
        channel:
          description: Where the order came from.
          type: string
          enum: [APP, WEB, PHONE, PARTNER]
        payer_client_id:
          description: The client who pays for this order (the signed-in rider, or the account created for a phone order). Null while the phone order has no account yet.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        city_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
        payment_method:
          type: string
          description: TERMINAL — a card at the driver's own terminal, only in phone orders.
          enum: [CASH, CARD, SERVICE, TERMINAL]
        payment_state:
          type: [string, "null"]
          description: >-
            Cash — what the driver reported. Card (ADR 0008) — AUTH_PENDING while the hold is asked for (the order is
            AWAITING_PAYMENT and no search runs), AUTHORIZED once it is held, PAYMENT_DECLINED when the bank refused,
            HOLD_RELEASED when the order ended before the hold was used (cancelled, or the hold deadline passed).
            Terminal — what the driver reported, like cash.
          enum: [CASH_EXPECTED, CASH_REPORTED, CASH_NOT_RECEIVED, AUTH_PENDING, AUTHORIZED, PAYMENT_DECLINED,
                 HOLD_RELEASED, CAPTURE_PENDING, PAID, PARTIALLY_PAID, TERMINAL_EXPECTED, TERMINAL_REPORTED,
                 TERMINAL_NOT_RECEIVED, null]
        price_minor:
          description: Agreed price from the quote.
          type: [integer, "null"]
          format: int64
        final_price_minor:
          description: Final fare, set when the trip is completed (REQ-PRC-10).
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        search_phase:
          type: [string, "null"]
          enum: [PERSONAL, BROADCAST, STOPPED, EXHAUSTED, null]
        assignment:
          description: >-
            The order's assignment (REQ-RID-05, issue #143): null while the order searches again after a driver change,
            so the old driver leaves the screen; a cancelled order keeps its released assignment as history.
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        driver:
          description: >-
            Who is coming (REQ-RID-05): the driver and car of an assignment that stands (reserved, committed or
            completed); null otherwise. No phone — calls go through the order.
          oneOf:
            - $ref: "#/components/schemas/DriverCard"
            - type: "null"
        comment:
          description: The rider's or operator's note for the driver (REQ-DRV-07, issue #143).
          type: [string, "null"]
        entrance:
          description: Where exactly to come (REQ-DRV-07, issue #143).
          type: [string, "null"]
        driver_change:
          description: >-
            Set after the driver was changed before the start, with a reason the rider may see; null otherwise.
            DRIVER_CANCELLED — the driver withdrew; SERVICE_REASSIGNED — the service took the driver off.
          oneOf:
            - type: object
              additionalProperties: false
              required: [reason_code, at]
              properties:
                reason_code:
                  type: string
                  enum: [DRIVER_CANCELLED, SERVICE_REASSIGNED]
                at:
                  $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        cancellation:
          $ref: "./cancellation.yaml#/components/schemas/Cancellation"
        pickup_at:
          description: Requested pickup time of an order for later; null for an order for now.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Timestamp"
            - type: "null"
        related_order_id:
          description: >-
            On a follow-up: the interrupted order it continues (T-22). Its payment_method is SERVICE — the rider pays
            nothing for it.
          oneOf:
            - $ref: "./common.yaml#/components/schemas/Uuid"
            - type: "null"
        wallet_minor:
          description: Bonuses paying part of the price (ADR 0009); after the trip at most the final fare is taken.
          type: integer
          format: int64
        discount_minor:
          description: Taken off the price by the rider's promotions (ADR 0009); the service pays it.
          type: integer
          format: int64
        preorder:
          description: >-
            A pre-order (ADR 0006): SCHEDULED until it is released into the search before pickup_at. It does not
            count as the rider's active order, so the rider can order a ride now as well.
          type: boolean