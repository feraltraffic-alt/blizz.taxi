openapi: 3.1.0
info:
  title: Blizz Taxi — Rider app API
  version: 1.0.0
  description: |
    API for the rider app (/api/rider/v1, REQ-API-02). Every operation needs an access token issued
    for the `rider` audience; tokens of other audiences are rejected (REQ-USR-08).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /ws/v1/rider:
    get:
      operationId: openRiderLiveChannel
      summary: Live channel (WebSocket)
      description: >-
        Upgrade to a WebSocket with the rider access token — the `Authorization: Bearer` header, or from a browser the
        subprotocols `blizz.v1, blizz.bearer.<token>` (never in the address, REQ-SEC-08). The server pushes a message for every change of an order the rider
        takes part in (section 20, REQ-NTF-04): `{"event_id", "type", "schema_version", "aggregate_type": "Order",
        "aggregate_id", "aggregate_version", "occurred_at", "correlation_id", "payload": {}}`. It carries no personal
        data: on a message the app reads the order over REST; duplicates and older versions are dropped, a gap in
        versions means read the snapshot (REQ-NTF-01). The first message is `{"type": "Connected"}`; the client may
        send `ping` (answer `{"type": "Pong"}`). Closed with code 4403 within seconds when the session is revoked or a right it needs is taken away (sign in again), and 4401 when the access token expires — reconnect with
        a fresh one. Commands stay REST (REQ-NTF-06).
      tags: [Live]
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          description: |
            From a browser, which cannot set Authorization on a WebSocket: `blizz.v1, blizz.bearer.<access token>`.
            The server answers `blizz.v1` only. A token in the address (`?access_token=`) is refused with 401: it
            would reach proxy logs (REQ-SEC-08).
          schema:
            type: string
      responses:
        "101":
          description: Switching to WebSocket.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/legal:
    get:
      operationId: getLegalInForce
      summary: Legal texts in force and what I still have to accept
      description: >-
        The versions in force for riders. One with acceptance_required and not accepted blocks new orders (403 ACCEPTANCE_REQUIRED); a trip in progress goes on. The text itself — GET /api/config/v1/legal/{audience}/{kind}.
      tags: [Legal]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./legal.yaml#/components/schemas/LegalInForceList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/legal/acceptances:
    post:
      operationId: acceptLegalText
      summary: Accept a legal text
      description: >-
        A command: records that the person accepted the version in force, shown in the language given, from this session. Accepted once: a repeat, also with another language, returns the first acceptance. A version that is no longer in force → 409 STATE_CONFLICT. Kept as a legal fact, also after the account is deleted.
      tags: [Legal]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./legal.yaml#/components/schemas/AcceptLegalText"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "./legal.yaml#/components/schemas/LegalAcceptance"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/me:
    get:
      operationId: getRiderMe
      summary: Who the access token belongs to
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current subject and session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/addresses:
    get:
      operationId: searchRiderAddresses
      summary: Search the service's own addresses near a point
      description: |
        Resolves the service city from lat/lon, searches visible service-owned addresses only and uses
        the point to break ranking ties by distance (REQ-GEO-13, REQ-GEO-15, REQ-GEO-16). Provider
        geocoding is intentionally not part of this endpoint (Q-08).
      tags: [Addresses]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 256
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Visible service-owned addresses matching the query.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/RiderAddress"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "429":
          description: Per-rider address search rate limit exceeded.
          headers:
            Retry-After:
              $ref: "./common.yaml#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/rider/v1/addresses/nearest:
    get:
      operationId: getNearestRiderAddress
      summary: Closest visible service-owned address within 100 metres
      tags: [Addresses]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Closest visible address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderAddress"
        "204":
          description: No visible address within 100 metres.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/vehicle-classes:
    get:
      operationId: listVehicleClasses
      summary: Classes that can be ordered at a point
      description: The city comes from the point; only active classes with a tariff in force now.
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleClassOption"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/rider/v1/quotes:
    post:
      operationId: createQuote
      summary: Price for a class and two points
      description: |
        The server computes the price from the tariff in force (REQ-PRC-05); the quote belongs to the
        rider, lives 5 minutes and serves one order (REQ-PRC-06). Pickup outside every city → 422
        OUTSIDE_SERVICE_AREA; no tariff in force → 404. A drop-off outside the pickup city that the city does not
        allow, or farther from it than the city's limit → 422 DROPOFF_OUTSIDE_CITY (REQ-TEN-05).
      tags: [Pricing]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/AppPlatform"
        - $ref: "./common.yaml#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuote"
      responses:
        "201":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "426":
          description: App build is below the minimum for its platform (REQ-API-10).
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceUnavailable"

  /api/rider/v1/orders:
    get:
      operationId: listRiderOrderHistory
      summary: Own order history
      description: |
        Own orders as payer, newest first (created_at, then id). Read the next page with page.next_cursor
        (REQ-API-09).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Before"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the order history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OrderHistoryItem"
                  page:
                    $ref: "./common.yaml#/components/schemas/PageInfo"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      summary: Order from a quote
      description: |
        Consumes the quote atomically with the order (REQ-PRC-06): it must belong to this rider and match
        the class and both points, otherwise 409 QUOTE_MISMATCH; used or expired → 409 QUOTE_EXPIRED, and the same
        when the quote has an "every N-th trip" promotion another open order of mine already took (get a new price). The
        price is the quote's, never the client's. A repeat of the same command returns the same order. A card order
        is 202: it waits in AWAITING_PAYMENT for the bank's hold before the search (ADR 0008, REQ-API-11). At most active_orders_per_payer orders not in a final state, pre-orders
        included, together with phone orders from my phone (ADR 0012) → 409 ACTIVE_ORDER_LIMIT. A rider whose
        account is not ACTIVE (e.g. a deletion request is pending) → 403 ACCOUNT_NOT_ACTIVE.
        The pickup city refuses new orders while paused (422 CITY_PAUSED), an order for now outside its working hours or
        one for later whose pickup time is outside them (422 CITY_CLOSED), and a payment method it does not offer
        (422 PAYMENT_METHOD_NOT_OFFERED); see the cities in the bootstrap (REQ-TEN-03/06).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "./common.yaml#/components/parameters/AppPlatform"
        - $ref: "./common.yaml#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: The order, created and searching for a driver (or scheduled); not paid by card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "202":
          description: |
            A card order, accepted: AWAITING_PAYMENT with payment_state AUTH_PENDING until the bank answers. Follow
            it at Location (GET /api/rider/v1/orders/{order_id}); 202 never means the bank has taken the money.
          headers:
            Location:
              description: The order, which shows the payment state and then the search.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
        "426":
          description: App build is below the minimum for its platform (REQ-API-10).
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/rider/v1/orders/current:
    get:
      operationId: listCurrentOrders
      summary: Every order not yet finished
      description: >-
        All my orders not in a final state, pre-orders included, newest first (ADR 0012 Q-03: up to
        active_orders_per_payer at once).
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/active:
    get:
      operationId: getActiveOrder
      summary: The most recent active order
      description: >-
        After an app restart the rider sees the same order; 204 when there is none. A rider may now hold several
        orders (ADR 0012): this one is the most recently created order for now (an order for later only when there
        is none, and pre-orders still SCHEDULED are not included). Kept for existing clients; the whole list is
        GET /api/rider/v1/orders/current.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "204":
          description: No active order.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: One own order
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/orders/{order_id}/call:
    get:
      operationId: getRiderOrderCallTarget
      summary: Phone target for the active assigned driver
      description: |
        Available only to the order's payer while the assignment is COMMITTED and the order is ASSIGNED or
        IN_SERVICE. DIRECT returns the assigned driver's phone; VIA_SERVICE_NUMBERS returns only the configured
        service phone. Other orders are hidden as 404; outside the active call window → 409 STATE_CONFLICT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: Number the rider app should dial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTarget"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/cards:
    get:
      operationId: listCards
      summary: The rider's saved cards
      description: Only the masked number and type; the provider's token never leaves the server (REQ-PAY-08, ADR 0008).
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/card-bindings:
    post:
      operationId: startCardBinding
      summary: Start adding a card
      description: >-
        For the merchant of the city (404 when the city takes no cards). The app POSTs `fields` to `url` in a web view
        (the provider's page with 3-D Secure); when the web view reaches `return_url` the app reads the binding.
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCardBinding"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardBinding"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/card-bindings/{binding_id}:
    get:
      operationId: getCardBinding
      summary: Result of adding a card
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: binding_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: PENDING until the provider reports; then COMPLETED with the card, FAILED or EXPIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardBinding"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/cards/{card_id}/remove:
    post:
      operationId: removeCard
      summary: Remove a saved card
      tags: [Cards]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: card_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCommand"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/push-devices:
    get:
      operationId: listRiderPushDevices
      summary: The phones that receive pushes
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active devices, oldest first.
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDeviceList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: registerRiderPushDevice
      summary: Register the app's push token
      description: >-
        Tied to the session of the access token: after a logout or a revoked session nothing more is sent to the
        phone (REQ-AUTH-07). A push is never a confirmation by itself — the app reads the order over REST
        (REQ-NTF-01). The push data carries `type` (the template), `event_type`, `event_id`, `order_id` and
        `order_version`; nothing personal.
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceRegistration"
      responses:
        "201":
          description: Registered (or refreshed, for the same token).
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDevice"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/push-devices/{device_id}/remove:
    post:
      operationId: removeRiderPushDevice
      summary: Stop pushes to a phone
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: device_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceCommand"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/rider/v1/cancel-reasons:
    get:
      operationId: listRiderCancelReasons
      summary: Reasons a rider can give when cancelling
      description: The rider's list from the admin panel; the app shows the label in the user's language and sends the code.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active reasons in display order.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/ReasonList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/rider/v1/orders/{order_id}/switch-to-cash:
    post:
      operationId: switchOrderToCash
      summary: Pay in cash instead of by card
      description: >-
        REQ-PAY-20 (owner decision 28.10.2026): a card order not yet finished (AWAITING_PAYMENT with the hold in place, SCHEDULED, READY, SEARCHING, ASSIGNED, IN_SERVICE) becomes a cash order. The card hold is released at once and the card is never charged for it. A hold whose result is not known yet → 409 PAYMENT_UNKNOWN (try again); not a card order, or nothing left to pay by card → 409 STATE_CONFLICT. The rider's own choice.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchToCash"
      responses:
        "200":
          description: The order, now CASH with payment_state CASH_EXPECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel before the trip starts
      description: >-
        reason_code is a code from GET /api/rider/v1/cancel-reasons; an unknown or inactive code → 400. The order
        shows cancellation.by = RIDER. No fee while the cancellation policy is not set (Q-07). A stale
        expected_version gets VERSION_CONFLICT.
      tags: [Orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
