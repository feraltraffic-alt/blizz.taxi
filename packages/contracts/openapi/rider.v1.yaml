        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/rider/v1/support/cases/{case_id}/attachments/{file_id}:
    get:
      operationId: downloadRiderSupportAttachment
      summary: Download a PUBLIC attachment of my support case
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
