openapi: 3.1.0
info:
  title: Blizz Taxi — Public configuration API
  version: 1.0.0
  description: |
    Start-up data of the rider and driver apps (/api/config/v1), needed before sign in: brand, languages,
    how "Call" works and the cities in service. Public, no token, no secrets (section 22).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security: []

paths:
  /api/config/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: Brand, languages, call mode and cities
      description: >-
        Cacheable for a minute. settings_version grows with every change in the admin panel. The cities are those of
        the app's taxi service (ADR 0016); an unknown or suspended service → 400 VALIDATION_FAILED.
      tags: [Config]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: service
          in: query
          required: false
          description: The code of the app's taxi service; omitted — the first service.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,39}$"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"
  /api/config/v1/legal/{audience}/{kind}:
    get:
      operationId: getLegalText
      summary: A legal text in force
      description: >-
        For showing before sign-in: the version in force of a document, in the language asked for or the first of uk, pl, ru, en it has. 404 when no version is in force.
      tags: [Config]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: service
          in: query
          required: false
          description: >-
            The code of the app's taxi service (ADR 0016): its own texts. Omitted — the first service; unknown → 404.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,39}$"
        - name: audience
          in: path
          required: true
          schema:
            type: string
            enum: [rider, driver]
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [terms, privacy_notice, driver_agreement]
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./legal.yaml#/components/schemas/LegalText"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "429":
          $ref: "./common.yaml#/components/responses/TooManyRequests"

tags:
  - name: Config
    description: Public start-up data

components:
  schemas:
    Bootstrap:
      type: object
      additionalProperties: false
      required: [settings_version, brand, languages, calls, preorders, maps, cities]
      properties:
        settings_version:
          type: integer
          format: int64
        brand:
          $ref: "#/components/schemas/Brand"
        languages:
          $ref: "#/components/schemas/Languages"
        calls:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              description: DIRECT — the app dials the other party; VIA_SERVICE_NUMBERS — through service_phone.
              type: string
              enum: [DIRECT, VIA_SERVICE_NUMBERS]
            service_phone:
              type: [string, "null"]
        preorders:
          description: What the rider app needs to offer "order for later".
          type: object
          additionalProperties: false
          required: [threshold_minutes, max_days_ahead]
          properties:
            threshold_minutes:
              type: integer
            max_days_ahead:
              type: integer
        maps:
          description: >-
            The map of the apps, as set in the admin panel (Integrations). The keys are restricted to the apps'
            package names, bundle ids and domains at the provider, so they are not secrets. Null until set.
          type: object
          additionalProperties: false
          required: [provider, android_key, ios_key, web_key]
          properties:
            provider:
              type: [string, "null"]
              enum: [GOOGLE, MAPBOX, MAPTILER, null]
            android_key:
              type: [string, "null"]
            ios_key:
              type: [string, "null"]
            web_key:
              type: [string, "null"]
        app_versions:
          description: >-
            Per-platform version policy (REQ-API-10): below minimum_version the app must update, below
            latest_version it may. "0.0.0" means no policy.
          type: [object, "null"]
          additionalProperties: false
          properties:
            rider_android:
              oneOf:
                - $ref: "./admin.v1.yaml#/components/schemas/PlatformVersions"
                - type: "null"
            rider_ios:
              oneOf:
                - $ref: "./admin.v1.yaml#/components/schemas/PlatformVersions"
                - type: "null"
            driver_android:
              oneOf:
                - $ref: "./admin.v1.yaml#/components/schemas/PlatformVersions"
                - type: "null"
            driver_ios:
              oneOf:
                - $ref: "./admin.v1.yaml#/components/schemas/PlatformVersions"
                - type: "null"
            require_version_header:
              type: boolean
        cities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, name, currency, timezone, working_hours, payment_methods, orders_paused]
            properties:
              id:
                $ref: "./common.yaml#/components/schemas/Uuid"
              code:
                type: string
              name:
                type: string
              currency:
                type: string
              timezone:
                type: string
              working_hours:
                description: >-
                  In the city's time zone; empty — around the clock. An order for now outside them is refused
                  (CITY_CLOSED); one for later only needs its pickup time inside them (REQ-TEN-03).
                type: array
                items:
                  $ref: "./admin.v1.yaml#/components/schemas/WorkingHours"
              payment_methods:
                description: The methods an order in this city may use.
                type: array
                items:
                  $ref: "./admin.v1.yaml#/components/schemas/CityPaymentMethod"
              orders_paused:
                description: New orders are refused with CITY_PAUSED for now (REQ-TEN-06).
                type: boolean

    Brand:
      description: Shown by the apps; never changes business rules (REQ-TEN-07).
      type: object
      additionalProperties: false
      required: [service_name, primary_color, on_primary_color]
      properties:
        service_name:
          type: string
          maxLength: 60
        primary_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        on_primary_color:
          description: Text on the primary colour; contrast with it at least 4.5:1.
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accent_color:
          type: [string, "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
        logo_url:
          type: [string, "null"]
          format: uri
        support_phone:
          type: [string, "null"]
        support_email:
          type: [string, "null"]
          format: email
        support_telegram:
          type: [string, "null"]
        privacy_policy_url:
          type: [string, "null"]
          format: uri
        terms_url:
          type: [string, "null"]
          format: uri

    Languages:
      type: object
      additionalProperties: false
      required: [default_language, enabled]
      properties:
        default_language:
          type: string
          enum: [uk, pl, ru, en]
        enabled:
          type: array
          items:
            type: string
            enum: [uk, pl, ru, en]

    Preorders:
      description: |
        Pre-orders (ADR 0006). A pickup time at least threshold_minutes ahead makes a pre-order; at most
        max_days_ahead days ahead. BROADCAST_BEFORE — the search starts release_minutes_before the pickup.
        RESERVATION — drivers see it at once and reserve it; the driver confirms "On my way" from
        confirm_minutes_before the pickup, within confirm_window_minutes, or loses it; he may drop it himself
        until driver_cancel_until_minutes_before the pickup, later only a dispatcher can.
      type: object
      additionalProperties: false
      required: [threshold_minutes, max_days_ahead, dispatch, release_minutes_before, confirm_minutes_before,
                 confirm_window_minutes, driver_cancel_until_minutes_before]
      properties:
        threshold_minutes:
          type: integer
          minimum: 15
          maximum: 1440
        max_days_ahead:
          description: Two weeks at most (owner decision 28.10.2026).
          type: integer
          minimum: 1
          maximum: 14
        dispatch:
          type: string
          enum: [RESERVATION, BROADCAST_BEFORE]
        release_minutes_before:
          type: integer
          minimum: 5
        confirm_minutes_before:
          type: integer
          minimum: 5
        confirm_window_minutes:
          type: integer
          minimum: 1
        driver_cancel_until_minutes_before:
          type: integer
          minimum: 5
          maximum: 10080
