openapi: 3.1.0
info:
  title: Blizz Taxi — sandbox observations
  version: 1.0.0
  description: Fake provider observations and ARI input; available only under the sandbox profile, never in production.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: The sandbox instance.
security: []
tags:
  - name: Sandbox
    description: Fictional provider data, without authentication in the sandbox.
paths:
  /sandbox/v1/otp:
    get:
      operationId: sandboxObserveOtp
      summary: Last fake sign-in code
      description: Sandbox profile only. Last fake sign-in code.
      tags: [Sandbox]
      parameters:
        - name: phone
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Fake provider observations.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "required": ["phone", "audience", "code", "sent_at", "channel"], "properties": {"phone": {"type": "string"}, "audience": {"type": "string"}, "code": {"type": "string"}, "sent_at": {"type": "string", "format": "date-time"}, "channel": {"type": "string", "enum": ["SMS", "VOICE"]}}}
        "400":
          description: Invalid request parameters.
        "404":
          description: No code has been sent to this phone.
  /sandbox/v1/sms:
    get:
      operationId: sandboxObserveSms
      summary: Fake text messages, oldest first
      description: Sandbox profile only. Fake text messages, oldest first.
      tags: [Sandbox]
      parameters:
        - name: phone
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Fake provider observations.
          content:
            application/json:
              schema: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["phone", "text", "sent_at"], "properties": {"phone": {"type": "string"}, "text": {"type": "string"}, "sent_at": {"type": "string", "format": "date-time"}}}}
        "400":
          description: Invalid request parameters.
  /sandbox/v1/pushes:
    get:
      operationId: sandboxObservePushes
      summary: Fake pushes for currently active devices, at most 100
      description: Sandbox profile only. Returns no pushes for devices signed out since delivery; tokens are reduced to a suffix.
      tags: [Sandbox]
      parameters:
        - name: phone
          in: query
          required: true
          schema: {type: string}
        - name: after
          in: query
          required: false
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Fake provider observations.
          content:
            application/json:
              schema: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["at", "token_suffix", "title", "body", "data"], "properties": {"at": {"type": "string", "format": "date-time"}, "token_suffix": {"type": "string"}, "title": {"type": "string"}, "body": {"type": "string"}, "data": {"type": "object", "additionalProperties": {"type": "string"}}}}}
        "400":
          description: Invalid request parameters.
  /sandbox/v1/notifications:
    get:
      operationId: sandboxObserveNotifications
      summary: The notifications of an order, oldest first
      description: >-
        Sandbox profile only. Every push and SMS row created for the order and what became of it: SENT, EXPIRED,
        FAILED, or SUPERSEDED — no longer current when its turn came (the offer closed, the assignment replaced;
        REQ-NTF-03, AC-19, issue #143) and never sent.
      tags: [Sandbox]
      parameters:
        - name: order_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The notification rows.
          content:
            application/json:
              schema: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["recipient_type", "recipient_id", "channel", "template", "state", "data", "created_at"], "properties": {"recipient_type": {"type": "string"}, "recipient_id": {"type": "string", "format": "uuid"}, "channel": {"type": "string"}, "template": {"type": "string"}, "state": {"type": "string"}, "data": {"type": "object", "additionalProperties": {"type": "string"}}, "created_at": {"type": "string", "format": "date-time"}}}}
        "400":
          description: Invalid request parameters.
  /sandbox/v1/calls/originated:
    get:
      operationId: sandboxObserveCallsOriginated
      summary: Fake outgoing call requests, oldest first
      description: Sandbox profile only. Fake outgoing call requests, oldest first.
      tags: [Sandbox]
      responses:
        "200":
          description: Fake provider observations.
          content:
            application/json:
              schema: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["channel_id", "endpoint", "context", "dial", "at"], "properties": {"channel_id": {"type": "string"}, "endpoint": {"type": "string"}, "context": {"type": "string"}, "dial": {"type": "string"}, "at": {"type": "string", "format": "date-time"}}}}
        "400":
          description: Invalid request parameters.
  /sandbox/v1/calls/events:
    post:
      operationId: sandboxInjectCallEvent
      summary: Inject an ARI event into the fake Asterisk
      description: Handled like a real Asterisk event. Sandbox profile only.
      tags: [Sandbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Event accepted by the fake provider.
        "404":
          description: This instance uses a real Asterisk and ignored the event.
