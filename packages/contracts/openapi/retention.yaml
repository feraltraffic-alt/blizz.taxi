openapi: 3.1.0
info:
  title: Technical data retention
  version: 1.0.0
paths: {}
components:
  schemas:
    RetentionDays:
      type: object
      additionalProperties: false
      description: The taxi service's own retention in whole days for each kind of its rows (ADR 0016, #276); delivered events and receipts belong to no service and are kept a fixed 30 days (fixed_days). 0 always means keep forever. A change applies to the next cleanup run; already deleted data cannot be restored. Cleanup never deletes the audit log, journal, orders, payments or FAILED outbox events.
      required: [sessions, sign_in_codes, code_deliveries, upload_sessions, quarantined_files, call_recordings]
      properties:
        sessions:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 30
          description: "Refresh tokens after expiry or session revocation; active tokens are preserved. 0 means keep forever."
        sign_in_codes:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 90
          description: "One-time sign-in challenges, measured from creation. 0 means keep forever."
        code_deliveries:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 90
          description: "Code delivery attempts, measured from the attempt time. 0 means keep forever."
        upload_sessions:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 7
          description: "Expired uploads never completed, or uploaded files never attached. Documents, support attachments and call recordings are preserved. 0 means keep forever."
        quarantined_files:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 30
          description: "Files stuck in quarantine; call recordings use their separate setting. 0 means keep forever."
        call_recordings:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
          description: "Recording files and metadata, including refused recordings still on Asterisk. Defaults to keeping forever. 0 means keep forever."
    RetentionVersion:
      type: object
      additionalProperties: false
      required: [version, days, changed_by, reason, changed_at, fixed_days]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        days:
          $ref: '#/components/schemas/RetentionDays'
        changed_by:
          type: [string, 'null']
          format: uuid
        reason:
          type: [string, 'null']
        changed_at:
          type: [string, 'null']
          format: date-time
        fixed_days:
          description: Rows of no service, kept a fixed number of days whatever is set (owner answer 02.11.2026).
          type: object
          additionalProperties: false
          required: [delivered_events, consumer_receipts, command_receipts]
          properties:
            delivered_events:
              type: integer
              const: 30
            consumer_receipts:
              type: integer
              const: 30
            command_receipts:
              type: integer
              const: 30
    ChangeRetention:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, days, reason]
      properties:
        command_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 0
        days:
          $ref: '#/components/schemas/RetentionDays'
        reason:
          type: string
          minLength: 1
