openapi: 3.1.0
info:
  title: Blizz Taxi — Driver app API
  version: 1.0.0
  description: |
    API for the driver app (/api/driver/v1, REQ-API-02). Every operation needs an access token issued
    for the `driver` audience; tokens of other audiences are rejected (REQ-USR-08).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder; each instance has its own trusted API domain (REQ-TEN-08)
security:
  - SubjectBearer: []

paths:
  /ws/v1/driver:
    get:
      operationId: openDriverLiveChannel
      summary: Live channel (WebSocket)
      description: >-
        Upgrade to a WebSocket with the driver access token — the `Authorization: Bearer` header, or `access_token` in
        the query where headers cannot be set. The server pushes a message for every change of an order the driver (also an order offered to him)
        takes part in (section 20, REQ-NTF-04): `{"event_id", "type", "schema_version", "aggregate_type": "Order",
        "aggregate_id", "aggregate_version", "occurred_at", "correlation_id", "payload": {}}`. It carries no personal
        data: on a message the app reads the order over REST; duplicates and older versions are dropped, a gap in
        versions means read the snapshot (REQ-NTF-01). The first message is `{"type": "Connected"}`; the client may
        send `ping` (answer `{"type": "Pong"}`). Closed with code 4401 when the access token expires — reconnect with
        a fresh one. Commands stay REST (REQ-NTF-06).
      tags: [Live]
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Switching to WebSocket.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/me:
    get:
      operationId: getDriverMe
      summary: Who the access token belongs to
      tags: [Account]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current subject and session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/profile:
    get:
      operationId: getDriverProfile
      summary: Own admission profile
      description: Profile, vehicles and the current document of each type with its review decision.
      tags: [Admission]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    patch:
      operationId: updateDriverProfile
      summary: Change own name or language
      description: Only the listed fields can be changed; admission status changes only through commands (REQ-API-03).
      tags: [Admission]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/vehicles:
    post:
      operationId: addVehicle
      summary: Add a vehicle for review
      tags: [Admission]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Vehicle added as DRAFT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/documents:
    post:
      operationId: addDocument
      summary: Add a document
      description: |
        A new document never overwrites an older one; the latest of each type becomes current
        (REQ-DRV-02). VEHICLE_REGISTRATION and INSURANCE need vehicle_id, other types must not have it.
        file_id is a file of this driver that passed the checks (state SAFE), uploaded through
        /documents/upload-sessions and /uploads/{file_id}.
      tags: [Admission]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document added, pending review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/verification/submit:
    post:
      operationId: submitForVerification
      summary: Submit for review
      description: |
        NOT_SUBMITTED, CHANGES_REQUIRED or EXPIRED → IN_REVIEW. Needs a vehicle and every required,
        non-rejected, currently valid document; otherwise VALIDATION_FAILED lists what is missing.
      tags: [Admission]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/documents/upload-sessions:
    post:
      operationId: openDocumentUpload
      summary: Open an upload session for one document file
      description: |
        Declares the type and size of one file. The session is short-lived and single-use
        (REQ-SEC-06). Accepted types: image/jpeg, image/png, application/pdf; at most 10 MB by default.
      tags: [Files]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenUploadRequest"
      responses:
        "201":
          description: Upload the bytes to upload_path before expires_at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/uploads/{file_id}:
    put:
      operationId: uploadFile
      summary: Upload the file bytes
      description: |
        The raw body with the declared Content-Type. The server checks the real type by content,
        the size, removes photo metadata and scans the file. The result is SAFE or REJECTED with a
        reason; a rejected file is deleted and needs a new session.
      tags: [Files]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/png:
            schema:
              type: string
              contentMediaType: image/png
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
          application/pdf:
            schema:
              type: string
              contentMediaType: application/pdf
      responses:
        "200":
          description: Outcome of the checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredFile"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/files/{file_id}:
    get:
      operationId: downloadFile
      summary: Download an own file
      description: Only the owner, only SAFE files; anyone else gets 404 (REQ-SEC-07).
      tags: [Files]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: The file, as an attachment, not cached.
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/driver/v1/work-sessions:
    post:
      operationId: openWorkSession
      summary: Go online
      description: |
        Requires an active account, admission, an approved own vehicle and a fresh location inside a
        published city (REQ-DRV-04). The device of the access token becomes the controlling device;
        another device gets STATE_CONFLICT and must use handover (REQ-DRV-03).
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenWorkSession"
      responses:
        "201":
          description: Online.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/work-sessions/current:
    get:
      operationId: getDriverAvailability
      summary: Current state on every axis
      description: Session, intent, connection, location freshness, occupancy, account and admission, with eligibility reasons (section 12.1).
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Snapshot; the app shows it after restart instead of local state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/work-sessions/{id}/handover:
    post:
      operationId: handoverWorkSession
      summary: Take control from another device
      description: Moves control of the open session to the device of this token; the session and any trip continue (T-16).
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommand"
      responses:
        "200":
          description: State after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/work-sessions/{id}/pause:
    post:
      operationId: pauseWorkSession
      summary: Stop receiving orders
      description: FREE → NOT_ACCEPTING; on a trip → PAUSE_AFTER_CURRENT (REQ-DRV-13).
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommand"
      responses:
        "200":
          description: State after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/work-sessions/{id}/resume:
    post:
      operationId: resumeWorkSession
      summary: Receive orders again
      description: Re-checks admission and vehicle; DRIVER_NOT_ELIGIBLE otherwise.
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommand"
      responses:
        "200":
          description: State after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/work-sessions/{id}/close:
    post:
      operationId: closeWorkSession
      summary: Go offline
      description: FREE → CLOSED; on a trip → CLOSING, closed when the trip ends (REQ-DRV-13).
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCommand"
      responses:
        "200":
          description: State after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/work-sessions/{id}/heartbeat:
    post:
      operationId: workSessionHeartbeat
      summary: Keep the connection and send the current location
      description: |
        Safe to repeat. A point whose sequence is not newer than the stored one does not move the
        current position (REQ-GEO-02). Without a location the connection is restored but location
        freshness is not (REQ-DS-04). Batched track upload comes with the location module.
      tags: [Work session]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
      responses:
        "200":
          description: State after the heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAvailability"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/location-batches:
    post:
      operationId: storeDriverLocationBatch
      summary: Store buffered GPS track points
      description: |
        Stores points from the device session in the access token. Points may arrive out of order or
        after newer heartbeats; this endpoint only appends to the location track and never updates the
        current position in the work session (REQ-GEO-02, REQ-GEO-05, T-14).
      tags: [Location]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationBatch"
      responses:
        "200":
          description: Batch outcome. Repeating command_id returns the same counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBatchResult"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "429":
          description: Per-driver location batch rate limit exceeded.
          headers:
            Retry-After:
              $ref: "./common.yaml#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "./common.yaml#/components/schemas/Problem"

  /api/driver/v1/offers:
    get:
      operationId: listOffers
      summary: Open personal offers
      description: At most one in M1; expires_at is the server deadline (REQ-DRV-07).
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/preorders:
    get:
      operationId: listPreorders
      summary: Pre-orders the driver can reserve
      description: >-
        Only when the service releases pre-orders by reservation (settings, ADR 0006); otherwise an empty list.
        Pre-orders of the driver's city and vehicle class that nobody holds and the driver has not held before.
        Needs an open work session; being busy with another ride is fine.
      tags: [Pre-orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Nearest pickup first, at most 50.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/preorders/reservations:
    get:
      operationId: listPreorderReservations
      summary: The driver's open reservations
      tags: [Pre-orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Nearest pickup first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderReservationList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/preorders/{order_id}/reserve:
    post:
      operationId: reservePreorder
      summary: Reserve a pre-order
      description: >-
        One driver per pre-order (taken → ORDER_ALREADY_ASSIGNED); at most 3 open reservations per driver; not again
        an order the driver held before. In BROADCAST_BEFORE mode → 409.
      tags: [Pre-orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderReservation"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/preorders/reservations/{reservation_id}/drop:
    post:
      operationId: dropPreorderReservation
      summary: Give the pre-order back
      description: >-
        Until drop_until (driver_cancel_until_minutes_before the pickup); later → 409, only a dispatcher can take
        the driver off. reason_code is from the drivers' list of cancellation reasons. The pre-order stays SCHEDULED.
      tags: [Pre-orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: reservation_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DropReservationCommand"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderReservation"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/preorders/reservations/{reservation_id}/confirm:
    post:
      operationId: confirmPreorderReservation
      summary: On my way
      description: >-
        Between confirm_from and confirm_until; earlier or later → 409. The driver must be free, online and eligible.
        The order becomes ASSIGNED to the driver (source RESERVATION) and the trip starts in TO_PICKUP. Not confirmed
        by confirm_until, the reservation expires and the order goes to the search.
      tags: [Pre-orders]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: reservation_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/offers/{offer_id}/accept:
    post:
      operationId: acceptOffer
      summary: Accept an offer
      description: Before the server deadline only; a late or revoked offer gets OFFER_EXPIRED / OFFER_REVOKED. A repeated command returns the original assignment (T-10).
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: offer_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/offers/{offer_id}/reject:
    post:
      operationId: rejectOffer
      summary: Decline an offer
      description: The search continues with the next driver.
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: offer_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "204":
          description: Declined.
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/driver/v1/broadcast-orders:
    get:
      operationId: listBroadcastOrders
      summary: Orders in the ALL tab
      description: Only for an eligible driver, filtered by city, class and distance; no passenger contact (REQ-DRV-08).
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BroadcastOrder"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/orders/{order_id}/claim:
    post:
      operationId: claimOrder
      summary: Take an order from the ALL tab
      description: Exactly one of many simultaneous claims wins; the others get ORDER_ALREADY_ASSIGNED (T-05).
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: order_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/assignments/current:
    get:
      operationId: getCurrentAssignment
      summary: The authoritative current assignment
      description: 204 when there is none.
      tags: [Dispatch]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "204":
          description: No current assignment.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/trips:
    get:
      operationId: listDriverTripHistory
      summary: Own completed and aborted trips
      description: Completed and aborted trips of the signed-in driver, newest first. Use created_at of the last item as before.
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: before
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Trip history.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/TripHistoryItem"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/trips/current:
    get:
      operationId: getCurrentTrip
      summary: The current trip
      description: Restores the trip after an app restart; 204 when there is none.
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "204":
          description: No current trip.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/trips/{trip_id}/call:
    get:
      operationId: getDriverTripCallTarget
      summary: Phone target for the active rider or phone caller
      description: |
        Available only to the driver of the COMMITTED assignment while the order is ASSIGNED or IN_SERVICE.
        DIRECT returns the rider account phone or the caller phone stored on a staff PHONE order.
        VIA_SERVICE_NUMBERS returns only the configured service phone. A released or revoked assignment is hidden
        as 404; outside the active call window → 409 STATE_CONFLICT.
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: Number the driver app should dial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallTarget"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/trips/{trip_id}/arrive:
    post:
      operationId: arriveAtPickup
      summary: I have arrived
      description: TO_PICKUP → WAITING. The last server-side position must be fresh and within 150 m of the pickup; otherwise PICKUP_TOO_FAR or LOCATION_NOT_FRESH — repeat with exception_reason to confirm, the trip is then flagged for review (REQ-ASG-06).
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhaseCommand"
      responses:
        "200":
          description: Trip after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/trips/{trip_id}/start:
    post:
      operationId: startTrip
      summary: Start the trip
      description: WAITING → IN_PROGRESS. Starting without a confirmed arrival needs exception_reason and is flagged for review (REQ-ASG-05).
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhaseCommand"
      responses:
        "200":
          description: Trip after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/trips/{trip_id}/complete:
    post:
      operationId: completeTrip
      summary: Complete the trip
      description: IN_PROGRESS → COMPLETED; the driver is free at once. reported_at is the device time; a large difference from server time is flagged. For CASH and TERMINAL (a card at the driver's own terminal), cash_received is required — the driver's statement that the money came, not proof (REQ-PAY-15).
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCommand"
      responses:
        "200":
          description: Trip after the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/trips/{trip_id}/cancel:
    post:
      operationId: cancelTrip
      summary: Cancel with a reason from the drivers' list
      description: >-
        Only before the start (TO_PICKUP or WAITING); after the start → 409. reason_code is a code from
        GET /api/driver/v1/cancel-reasons; an unknown or inactive code → 400. The reason decides the outcome
        (owner decision 27.10.2026): RETURN_TO_SEARCH — the driver is free at once, is not offered this order again
        and the order goes back to the search with the remaining search time (REQ-ASG-04, REQ-CAN-05);
        CANCEL_ORDER — the order is cancelled with cancellation.by = DRIVER; NO_SHOW — the rules of /no-show apply.
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelTripCommand"
      responses:
        "200":
          description: Trip after the command (phase ABORTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/cancel-reasons:
    get:
      operationId: listDriverCancelReasons
      summary: Reasons a driver can give when cancelling
      description: The drivers' list from the admin panel; driver_outcome tells the app whether the order will go back to the search or be cancelled.
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active reasons in display order.
          content:
            application/json:
              schema:
                $ref: "./cancellation.yaml#/components/schemas/ReasonList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/trips/{trip_id}/no-show:
    post:
      operationId: reportNoShow
      summary: The passenger did not come out
      description: Only in WAITING and not earlier than the minimum waiting time after the server-side arrival (REQ-CAN-06, T-20); earlier → 409. The order is cancelled by the driver (cancellation.by = DRIVER) with reason NO_SHOW and the driver is free. No fee until the cancellation policy is decided (Q-07).
      tags: [Trip]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCommand"
      responses:
        "200":
          description: Trip after the command (phase ABORTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/balance:
    get:
      operationId: getDriverBalance
      summary: Settlement balance with the service
      description: |
        Per currency, from the journal (REQ-LED-01). Positive — the service owes the driver; negative — the
        driver owes the service, e.g. the commission of cash trips (REQ-PAY-16). This is the settlement
        balance only; "available for payout" is a separate figure that arrives with payouts (REQ-LED-06).
      tags: [Finance]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverBalance"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/trips/{trip_id}/messages:
    get:
      operationId: listDriverMessages
      summary: Chat messages of the order
      description: Oldest first, after the given sequence. The driver reads only the messages of his own assignment.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessages"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    post:
      operationId: postDriverMessage
      summary: Write to the rider
      description: |
        Open once a driver is assigned and stays open in the order history (completed, cancelled), so the
        rider can write from the order details; with no driver ever assigned → 409 STATE_CONFLICT. A driver
        who withdrew or was taken off the order cannot write → 404.
        1 to 1000 characters. A repeat of the same command_id returns the same message. The conversation is
        kept for the order details in the admin panel.
      tags: [Chat]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: trip_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessage"
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"

  /api/driver/v1/support/cases:
    get:
      operationId: listDriverSupportCases
      summary: My support cases
      description: Newest first.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: before
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Timestamp"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/CaseList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: openDriverSupportCase
      summary: Open a support case
      description: About one of my orders or in general; the first message is PUBLIC.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenCase"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"
  /api/driver/v1/support/cases/{case_id}:
    get:
      operationId: getDriverSupportCase
      summary: One of my cases
      description: PUBLIC messages only.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/driver/v1/support/cases/{case_id}/messages:
    post:
      operationId: replyDriverSupportCase
      summary: Answer support
      description: A case waiting for me goes back to work; a resolved one is reopened; a closed one → 409.
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/Reply"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/Case"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "409":
          $ref: "./common.yaml#/components/responses/Conflict"
        "422":
          $ref: "./common.yaml#/components/responses/UnprocessableEntity"

  /api/driver/v1/push-devices:
    get:
      operationId: listDriverPushDevices
      summary: The phones that receive pushes
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Active devices, oldest first.
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDeviceList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
    post:
      operationId: registerDriverPushDevice
      summary: Register the app's push token
      description: >-
        Tied to the session of the access token: after a logout or a revoked session nothing more is sent to the
        phone (REQ-AUTH-07). A push is never a confirmation by itself — the app reads the order over REST
        (REQ-NTF-01). The push data carries `type` (the template), `event_type`, `event_id`, `order_id` and
        `order_version`; nothing personal.
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceRegistration"
      responses:
        "201":
          description: Registered (or refreshed, for the same token).
          content:
            application/json:
              schema:
                $ref: "./push.yaml#/components/schemas/PushDevice"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/push-devices/{device_id}/remove:
    post:
      operationId: removeDriverPushDevice
      summary: Stop pushes to a phone
      tags: [Push]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: device_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./push.yaml#/components/schemas/PushDeviceCommand"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

  /api/driver/v1/support/uploads:
    post:
      operationId: openDriverSupportAttachmentUpload
      summary: Open an upload session for one support attachment
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./support.yaml#/components/schemas/OpenAttachmentUpload"
      responses:
        "201":
          description: Upload session.
          content:
            application/json:
              schema:
                $ref: "./support.yaml#/components/schemas/UploadSession"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"

  /api/driver/v1/support/cases/{case_id}/attachments/{file_id}:
    get:
      operationId: downloadDriverSupportAttachment
      summary: Download a PUBLIC attachment of my support case
      tags: [Support]
      parameters:
        - $ref: "./common.yaml#/components/parameters/CorrelationId"
        - name: case_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
        - name: file_id
          in: path
          required: true
          schema:
            $ref: "./common.yaml#/components/schemas/Uuid"
      responses:
        "200":
          description: Attachment bytes.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

tags:
  - name: Push
    description: Push notifications to the app (section 20)
  - name: Live
    description: Live updates over WebSocket (section 20)
  - name: Support
    description: Support cases (REQ-ADM-09)
  - name: Chat
    description: Rider–driver chat of the order
  - name: Account
    description: The signed-in driver
  - name: Admission
    description: Profile, vehicles, documents and review (section 6)
  - name: Files
    description: Private document uploads (REQ-SEC-06, REQ-SEC-07)
  - name: Work session
    description: Going online and offline, presence (sections 6, 12)
  - name: Location
    description: Buffered GPS track upload (REQ-GEO-01, REQ-GEO-02, REQ-GEO-05, REQ-GEO-06)
  - name: Dispatch
    description: Offers, the ALL tab and assignments (sections 10, 11)
  - name: Finance
    description: Settlement with the service (section 17)
  - name: Trip
    description: Arrival, start, completion, cancellation and no-show (sections 9, 10)
  - name: Pre-orders
    description: Reserving orders for a set time and confirming "On my way" (ADR 0006)

components:
  parameters:
    WorkSessionId:
      name: id
      in: path
      required: true
      schema:
        $ref: "./common.yaml#/components/schemas/Uuid"
  securitySchemes:
    SubjectBearer:
      $ref: "./common.yaml#/components/securitySchemes/SubjectBearer"
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, session_id, account_state]
      properties:
        subject_type:
          type: string
          const: DRIVER
        subject_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        session_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        account_state:
          type: string

    Created:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    ReviewStatus:
      type: string
      enum: [NOT_SUBMITTED, IN_REVIEW, CHANGES_REQUIRED, APPROVED, REJECTED, SUSPENDED, EXPIRED]

    DocumentType:
      type: string
      enum: [DRIVER_LICENSE, IDENTITY, TAXI_PERMIT, VEHICLE_REGISTRATION, INSURANCE, OTHER]

    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 120
        language:
          type: string
          minLength: 2
          maxLength: 8

    VehicleInput:
      type: object
      additionalProperties: false
      required: [command_id, registration_number, make, model, color, production_year]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        registration_number:
          type: string
          maxLength: 16
        make:
          type: string
          maxLength: 60
        model:
          type: string
          maxLength: 60
        color:
          type: string
          maxLength: 40
        production_year:
          type: integer
          minimum: 1950
          maximum: 2100

    DocumentInput:
      type: object
      additionalProperties: false
      required: [command_id, type, file_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/DocumentType"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        file_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        number:
          type: string
          maxLength: 64
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date

    SubmitRequest:
      type: object
      additionalProperties: false
      required: [command_id, expected_version]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0

    Vehicle:
      type: object
      additionalProperties: false
      required: [id, registration_number, make, model, color, production_year, state, class_approvals]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        registration_number:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string
        production_year:
          type: integer
        state:
          type: string
          enum: [DRAFT, IN_REVIEW, APPROVED, SUSPENDED, EXPIRED]
        class_approvals:
          type: array
          items:
            type: string

    Document:
      type: object
      additionalProperties: false
      required: [id, type, decision]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/DocumentType"
        vehicle_id:
          type: [string, "null"]
          format: uuid
        file_id:
          type: [string, "null"]
          format: uuid
        number:
          type: [string, "null"]
        valid_from:
          type: [string, "null"]
          format: date
        valid_to:
          type: [string, "null"]
          format: date
        decision:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        decision_reason:
          type: [string, "null"]

    DriverProfile:
      type: object
      additionalProperties: false
      required: [id, review_status, has_payment_terminal, version, vehicles, documents]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        name:
          type: [string, "null"]
        language:
          type: [string, "null"]
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        has_payment_terminal:
          description: >-
            The driver takes cards at an own terminal (as a sole trader). Phone orders paid at a terminal are offered
            to such drivers; the money stays with the driver like cash, the commission comes from the balance.
          type: boolean
        version:
          description: Pass as expected_version to commands.
          type: integer
          format: int64
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        documents:
          description: Current document of each type.
          type: array
          items:
            $ref: "#/components/schemas/Document"

    OpenUploadRequest:
      type: object
      additionalProperties: false
      required: [command_id, content_type, size_bytes]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size_bytes:
          type: integer
          format: int64
          minimum: 1

    UploadSession:
      type: object
      additionalProperties: false
      required: [file_id, upload_path, expires_at, max_bytes]
      properties:
        file_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        upload_path:
          description: Relative path for the PUT with the file bytes.
          type: string
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        max_bytes:
          type: integer
          format: int64

    StoredFile:
      type: object
      additionalProperties: false
      required: [file_id, state, size_bytes]
      properties:
        file_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [SAFE, REJECTED]
        content_type:
          type: [string, "null"]
        size_bytes:
          type: integer
          format: int64
        reject_reason:
          type: [string, "null"]

    Location:
      type: object
      additionalProperties: false
      required: [lat, lon, recorded_at, sequence]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
        recorded_at:
          description: Device time; not used to order points.
          $ref: "./common.yaml#/components/schemas/Timestamp"
        sequence:
          description: Grows with every point of this app session.
          type: integer
          format: int64
          minimum: 0

    LocationBatchPoint:
      type: object
      additionalProperties: false
      required: [sequence, lat, lon, accuracy_m, recorded_at]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 0
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
        speed_mps:
          type: number
          minimum: 0
        heading_deg:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        recorded_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    LocationBatch:
      type: object
      additionalProperties: false
      required: [command_id, points]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        points:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/LocationBatchPoint"

    LocationBatchResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates, flagged]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        flagged:
          type: integer
          minimum: 0

    OpenWorkSession:
      type: object
      additionalProperties: false
      required: [command_id, vehicle_id, location]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        location:
          $ref: "#/components/schemas/Location"

    SessionCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          description: session_version from the last snapshot.
          type: integer
          format: int64
          minimum: 0

    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: "#/components/schemas/Location"

    DriverAvailability:
      type: object
      additionalProperties: false
      required: [driver_id, session_version, session_state, connection, geolocation, occupancy, account_state,
                 review_status, eligible, ineligible_reasons]
      properties:
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        session_id:
          type: [string, "null"]
          format: uuid
        session_version:
          type: integer
          format: int64
        session_state:
          type: string
          enum: [OPEN, CLOSING, CLOSED]
        intent:
          type: [string, "null"]
          enum: [ACCEPTING, PAUSE_AFTER_CURRENT, NOT_ACCEPTING, null]
        connection:
          type: string
          enum: [CONNECTED, STALE, DISCONNECTED]
        geolocation:
          type: string
          enum: [FRESH, STALE, UNAVAILABLE]
        occupancy:
          type: string
          enum: [FREE, OFFERED, RESERVED, TO_PICKUP, WAITING, ON_TRIP]
        account_state:
          type: string
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        city_id:
          type: [string, "null"]
          format: uuid
        vehicle_id:
          type: [string, "null"]
          format: uuid
        last_heartbeat_at:
          type: [string, "null"]
          format: date-time
        last_location_at:
          type: [string, "null"]
          format: date-time
        eligible:
          description: May receive a new order right now.
          type: boolean
        ineligible_reasons:
          description: |
            Why no new order is offered, e.g. ACCOUNT_BLOCKED, ADMISSION_EXPIRED, LOCATION_STALE, OCCUPANCY_ON_TRIP,
            DEBT_LIMIT (the debt to the service is above the admin's limit, REQ-PAY-16).
          type: array
          items:
            type: string

    Command:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"

    Assignment:
      type: object
      additionalProperties: false
      required: [id, order_id, driver_id, vehicle_id, source, state]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        driver_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        source:
          type: string
          enum: [OFFER, BROADCAST, RESERVATION]
        state:
          type: string
          enum: [RESERVED, COMMITTED, RELEASED, REVOKED, COMPLETED]
        trip_id:
          type: [string, "null"]
          format: uuid
        trip_phase:
          type: [string, "null"]
          enum: [TO_PICKUP, WAITING, IN_PROGRESS, COMPLETED, ABORTED, null]

    CallTarget:
      type: object
      additionalProperties: false
      required: [mode, phone]
      properties:
        mode:
          type: string
          enum: [DIRECT, VIA_SERVICE_NUMBERS]
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    Preorder:
      type: object
      additionalProperties: false
      required: [order_id, short_number, pickup_at, vehicle_class, pickup, pickup_label, dropoff_label, price_minor,
                 currency, payment_method]
      properties:
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        short_number:
          type: integer
          format: int64
        pickup_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]

    PreorderList:
      type: object
      additionalProperties: false
      required: [preorders]
      properties:
        preorders:
          type: array
          items:
            $ref: "#/components/schemas/Preorder"

    PreorderReservation:
      type: object
      additionalProperties: false
      required: [id, state, order, reserved_at, confirm_from, confirm_until, drop_until]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        state:
          type: string
          enum: [RESERVED, CONFIRMED, DROPPED, REMOVED, EXPIRED, CANCELLED]
        order:
          $ref: "#/components/schemas/Preorder"
        reserved_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        confirm_from:
          description: '"On my way" is accepted from here…'
          $ref: "./common.yaml#/components/schemas/Timestamp"
        confirm_until:
          description: …until here; after that the reservation expires.
          $ref: "./common.yaml#/components/schemas/Timestamp"
        drop_until:
          description: The driver may give the order back himself until here.
          $ref: "./common.yaml#/components/schemas/Timestamp"

    PreorderReservationList:
      type: object
      additionalProperties: false
      required: [reservations]
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/PreorderReservation"

    DropReservationCommand:
      type: object
      additionalProperties: false
      required: [command_id, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        reason_code:
          type: string
          minLength: 1
          maxLength: 40

    Offer:
      type: object
      additionalProperties: false
      required: [id, order_id, expires_at, vehicle_class, pickup, pickup_label, dropoff_label, payment_method]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expires_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        distance_m:
          type: [integer, "null"]

    BroadcastOrder:
      type: object
      additionalProperties: false
      required: [order_id, vehicle_class, pickup, pickup_label, dropoff_label, payment_method, distance_m]
      properties:
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        vehicle_class:
          type: string
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        distance_m:
          type: integer

    PhaseCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          description: Trip version from the last snapshot.
          type: integer
          format: int64
          minimum: 0
        exception_reason:
          description: Confirms an arrival or start that failed the normal checks; flags the trip for review.
          type: string
          maxLength: 500

    DriverBalance:
      type: object
      additionalProperties: false
      required: [balances]
      properties:
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [currency, balance_minor, debt_limit_minor, blocked]
            properties:
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              balance_minor:
                description: Positive — owed to the driver; negative — owed by the driver.
                type: integer
                format: int64
              debt_limit_minor:
                description: The admin's debt limit for the currency; null when there is none.
                type: [integer, "null"]
                format: int64
              blocked:
                description: The debt is above the limit; no new orders until it is paid in (REQ-PAY-16).
                type: boolean

    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, order_id, sequence, sender_role, body, sent_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        sequence:
          type: integer
          format: int64
          minimum: 1
        sender_role:
          type: string
          enum: [RIDER, DRIVER]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        sent_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"

    ChatMessages:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    PostChatMessage:
      type: object
      additionalProperties: false
      required: [command_id, body]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        body:
          type: string
          minLength: 1
          maxLength: 1000

    CancelTripCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reason_code]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          description: Trip version from the last snapshot.
          type: integer
          format: int64
          minimum: 0
        reason_code:
          description: A code from the drivers' list of cancellation reasons.
          type: string
          minLength: 1
          maxLength: 40

    VersionCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          description: Trip version from the last snapshot.
          type: integer
          format: int64
          minimum: 0

    CompleteCommand:
      type: object
      additionalProperties: false
      required: [command_id, expected_version, reported_at]
      properties:
        command_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        expected_version:
          type: integer
          format: int64
          minimum: 0
        reported_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        cash_received:
          description: CASH — the cash was received; TERMINAL — the card payment at the driver's terminal went through.
          type: boolean

    TripHistoryItem:
      type: object
      additionalProperties: false
      required: [id, order_id, order_short_number, created_at, pickup_label, dropoff_label,
                 final_price_minor, currency, payment_method, phase]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_short_number:
          description: For support conversations; not a secret (REQ-DATA-03).
          type: integer
          format: int64
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        pickup_label:
          type: string
        dropoff_label:
          type: string
        final_price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        phase:
          type: string
          enum: [COMPLETED, ABORTED]

    Trip:
      type: object
      additionalProperties: false
      required: [id, order_id, assignment_id, phase, version, pickup, pickup_label, dropoff, dropoff_label,
                 payment_method, needs_review]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        order_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        assignment_id:
          $ref: "./common.yaml#/components/schemas/Uuid"
        phase:
          type: string
          enum: [TO_PICKUP, WAITING, IN_PROGRESS, COMPLETED, ABORTED]
        version:
          type: integer
          format: int64
        pickup:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        pickup_label:
          type: string
        dropoff:
          $ref: "./common.yaml#/components/schemas/GeoPoint"
        dropoff_label:
          type: string
        payment_method:
          type: string
          enum: [CASH, CARD, SERVICE, TERMINAL]
        price_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
        arrived_at:
          type: [string, "null"]
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        needs_review:
          type: boolean