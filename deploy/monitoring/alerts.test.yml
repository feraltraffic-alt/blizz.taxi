# promtool test rules deploy/monitoring/alerts.test.yml (issue #101)
rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  # 120 codes an hour for 193 hours (an instance restarts), then 600 an hour: both alerts fire; before, none.
  - interval: 1m
    input_series:
      - series: 'blizz_otp_sent_total{channel="SMS",country="380"}'
        values: '0+2x11580 0+10x120'
      - series: 'blizz_otp_hourly_alarm'
        values: '500x11700'
    alert_rule_test:
      - eval_time: 195h
        alertname: OtpVolumeSpike
        exp_alerts:
          - exp_labels: {severity: critical, owner: backend-oncall}
            exp_annotations:
              summary: "One-time codes in the last hour are more than 3x the usual for this hour: possible SMS pumping"
              runbook: docs/runbooks/sms.md
      - eval_time: 195h
        alertname: OtpHourlyAlarm
        exp_alerts:
          - exp_labels: {severity: critical, owner: backend-oncall}
            exp_annotations:
              summary: "More one-time codes in the last hour than blizz.otp.hourly-alarm: possible SMS pumping"
              runbook: docs/runbooks/sms.md
      - eval_time: 190h
        alertname: OtpVolumeSpike
        exp_alerts: []
      - eval_time: 190h
        alertname: OtpHourlyAlarm
        exp_alerts: []

  # A file has waited 30 minutes, then keeps waiting: the alert fires after an hour and 5 minutes, not before (#105).
  - interval: 1m
    input_series:
      - series: 'blizz_files_quarantine_oldest_seconds'
        values: '1800+60x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FileQuarantineStuck
        exp_alerts: []
      - eval_time: 40m
        alertname: FileQuarantineStuck
        exp_alerts:
          - exp_labels: {severity: warning, owner: backend-oncall}
            exp_annotations:
              summary: "An uploaded file has waited more than an hour for its antivirus verdict"
              runbook: docs/runbooks/providers.md

  # A held capture whose card hold expires in 30 hours, an hour later in 24.5, then in under 24: the alert fires five
  # minutes after it is under 24 hours, not before; with nothing held a zero expiry does not fire (review of #169).
  - interval: 1m
    input_series:
      - series: 'blizz_trips_held_captures'
        values: '1x400 0x60'
      - series: 'blizz_trips_held_capture_expiry_seconds'
        values: '108000-60x400 0x60'
    alert_rule_test:
      - eval_time: 90m
        alertname: HeldCaptureNearHoldExpiry
        exp_alerts: []
      - eval_time: 363m
        alertname: HeldCaptureNearHoldExpiry
        exp_alerts: []
      - eval_time: 370m
        alertname: HeldCaptureNearHoldExpiry
        exp_alerts:
          - exp_labels: {severity: warning, owner: payments-oncall}
            exp_annotations:
              summary: "A card trip's capture waits for a facts review and its card hold expires within 24 hours"
              runbook: docs/runbooks/payment-unknown.md
      - eval_time: 440m
        alertname: HeldCaptureNearHoldExpiry
        exp_alerts: []
