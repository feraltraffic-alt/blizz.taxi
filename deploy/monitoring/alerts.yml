# Prometheus alert rules of the server (REQ-OBS-03). Every alert names its owner and its runbook; thresholds are the
# starting ones of the specification, to be tuned on real traffic. Scrape the management port (MANAGEMENT_PORT,
# default 8081) at /actuator/prometheus; never publish that port.
groups:
  - name: blizz-server
    rules:
      - alert: ServerDown
        expr: up{job="blizz-server"} == 0
        for: 2m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "An instance of the server does not answer"
          runbook: docs/runbooks/database-and-server.md

      - alert: ServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.01
        for: 5m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "More than 1 % of requests fail with a server error"
          runbook: docs/runbooks/database-and-server.md

      - alert: OutboxStuck
        expr: max(blizz_outbox_oldest_seconds) > 60
        for: 2m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "An event has waited for delivery for more than a minute"
          runbook: docs/runbooks/outbox.md

      - alert: OutboxFailed
        expr: max(blizz_outbox_failed) > 0
        for: 5m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "Events could not be delivered"
          runbook: docs/runbooks/outbox.md

      - alert: PaymentOutcomeUnknown
        expr: max(blizz_payments_unknown_oldest_seconds) > 300
        for: 1m
        labels: {severity: critical, owner: payments-oncall}
        annotations:
          summary: "A card operation's outcome has been unknown for more than 5 minutes"
          runbook: docs/runbooks/payment-unknown.md

      - alert: LedgerUnbalanced
        expr: max(blizz_ledger_unbalanced) > 0
        for: 1m
        labels: {severity: critical, owner: finance-oncall}
        annotations:
          summary: "A journal transaction does not balance"
          runbook: docs/runbooks/ledger.md

      - alert: ClockSkew
        expr: max(abs(blizz_clock_skew_seconds)) > 2
        for: 5m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "An instance's clock is more than 2 s away from the database's"
          runbook: docs/runbooks/clock.md

      - alert: SignInCodesFailing
        expr: |
          max(blizz_otp_failed_last_15m) >= 5
            and max(blizz_otp_failed_last_15m) / clamp_min(max(blizz_otp_sent_last_15m), 1) > 0.2
        for: 5m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "More than 20 % of sign-in codes do not go out"
          runbook: docs/runbooks/sms.md

      # SMS pumping (issue #101): codes sent in the last hour against the same hour of the previous 7 days, and against
      # the instance's own ceiling blizz.otp.hourly-alarm. The floor of 50 keeps a quiet first week from paging.
      - alert: OtpVolumeSpike
        expr: |
          sum(increase(blizz_otp_sent_total[1h])) > 50
            and sum(increase(blizz_otp_sent_total[1h])) > 3 * (
              (sum(increase(blizz_otp_sent_total[1h] offset 1d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 2d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 3d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 4d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 5d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 6d)) or vector(0)) +
              (sum(increase(blizz_otp_sent_total[1h] offset 7d)) or vector(0))
            ) / 7
        for: 10m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "One-time codes in the last hour are more than 3x the usual for this hour: possible SMS pumping"
          runbook: docs/runbooks/sms.md

      - alert: OtpHourlyAlarm
        expr: sum(increase(blizz_otp_sent_total[1h])) > on() max(blizz_otp_hourly_alarm)
        for: 5m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "More one-time codes in the last hour than blizz.otp.hourly-alarm: possible SMS pumping"
          runbook: docs/runbooks/sms.md

      - alert: OrdersWaitingLong
        expr: max(blizz_orders_searching_oldest_seconds) > 900
        for: 5m
        labels: {severity: warning, owner: operations}
        annotations:
          summary: "An order has looked for a driver for more than 15 minutes"
          runbook: docs/runbooks/orders-and-gps.md

      - alert: OrdersUnfulfilledRate
        expr: |
          sum(rate(blizz_orders_unfulfilled_total[5m]))
            / clamp_min(sum(rate(blizz_orders_total[5m])), 1e-9) > 0.2
        for: 15m
        labels: {severity: warning, owner: operations}
        annotations:
          summary: "More than 20 % of orders end without a car for 15 minutes"
          runbook: docs/runbooks/orders-and-gps.md

      - alert: DriversLosingGps
        expr: |
          max(blizz_drivers_online) >= 10
            and max(blizz_drivers_online_stale_location) / max(blizz_drivers_online) > 0.5
        for: 10m
        labels: {severity: warning, owner: operations}
        annotations:
          summary: "More than half of the drivers on the line have no fresh position"
          runbook: docs/runbooks/orders-and-gps.md

      - alert: MetricsMissing
        expr: absent(blizz_outbox_pending) or max(blizz_outbox_pending) != max(blizz_outbox_pending)
        for: 10m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "The server's own metrics are not read (the database may be unreachable)"
          runbook: docs/runbooks/database-and-server.md

      - alert: TrackRetentionStuck
        expr: max(blizz_location_oldest_off_trip_seconds) > (24 + 1) * 3600
        for: 30m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "GPS points outside trips are kept longer than their retention: the clean-up stopped"
          runbook: docs/runbooks/orders-and-gps.md

      - alert: PaymentReconciliationMissing
        expr: max(blizz_payments_reconciliation_oldest_success_age_seconds) > 26 * 3600
        for: 1m
        labels: {severity: critical, owner: payments-oncall}
        annotations:
          summary: "A merchant has no successful daily card reconciliation for 26 hours"
          runbook: docs/runbooks/payment-reconciliation.md

      - alert: PaymentReconciliationFailed
        expr: max(blizz_payments_reconciliation_failed) > 0
        for: 5m
        labels: {severity: warning, owner: payments-oncall}
        annotations:
          summary: "A card statement could not be reconciled; FAILED does not mean zero differences"
          runbook: docs/runbooks/payment-reconciliation.md

      - alert: PaymentReconciliationMetricsMissing
        expr: absent(blizz_payments_reconciliation_oldest_success_age_seconds) or max(blizz_payments_reconciliation_oldest_success_age_seconds) != max(blizz_payments_reconciliation_oldest_success_age_seconds)
        for: 10m
        labels: {severity: warning, owner: payments-oncall}
        annotations:
          summary: "Card reconciliation freshness cannot be measured"
          runbook: docs/runbooks/payment-reconciliation.md

      - alert: ProviderBreakerOpen
        expr: max by (provider) (blizz_provider_breaker_state) == 2
        for: 5m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "Provider {{ $labels.provider }} is down: its circuit breaker has been open for 5 minutes"
          runbook: docs/runbooks/providers.md

      - alert: InvariantViolation
        expr: blizz_invariant_violations > 0
        for: 20m
        labels: {severity: critical, owner: backend-oncall}
        annotations:
          summary: "Invariant {{ $labels.check }} found inconsistent objects for 20 minutes"
          runbook: docs/runbooks/invariants.md

      - alert: InvariantCheckFailed
        expr: blizz_invariant_violations != blizz_invariant_violations
        for: 20m
        labels: {severity: warning, owner: backend-oncall}
        annotations:
          summary: "Invariant {{ $labels.check }} cannot produce a reliable result"
          runbook: docs/runbooks/invariants.md
