; Development only: no real trunk. A call to PJSIP/{phone}@trunk fails here until a SIP provider is configured; the
; ARI request itself (and the server's record of the attempt) can still be tried. Put the provider's trunk below on
; a real instance (Q-18: own Asterisk with the service's SIP provider).
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk]
type=endpoint
context=from-trunk
disallow=all
allow=alaw,ulaw
