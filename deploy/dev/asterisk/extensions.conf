; The server originates a call into this context through ARI with the channel variables OTP_CODE and
; OTP_LANGUAGE (pl for Polish numbers, uk otherwise; the digits need that language's sounds installed)
; (telephony/internal/AsteriskVoiceSender). It answers, says the digits twice and hangs up. Keep verbose logging low:
; at high verbosity Asterisk prints dialplan arguments, which would include the code.
[blizz-otp]
exten => s,1,Set(CHANNEL(language)=${OTP_LANGUAGE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${OTP_CODE})
 same => n,Wait(1)
 same => n,SayDigits(${OTP_CODE})
 same => n,Hangup()

; Incoming calls of the call centre (issues #64, #60). The server sees every channel through the ARI events of the app
; blizz-calls (subscribeAll), without taking control; the dialplan routes the call. Point the trunk's incoming context
; here and Dial the operators' phones as the service needs.
[blizz-incoming]
exten => _X.,1,NoOp(Incoming call to ${EXTEN})
 same => n,Dial(PJSIP/operators,30,U(blizz-record^${UNIQUEID}))
 same => n,Hangup()

; Runs on the operator's leg when it answers (Dial's U option), so a call nobody took has no recording. Records the
; conversation into the stored-recordings directory of ARI under the caller's channel id (ARG1) — the server fetches it
; after the call as /ari/recordings/stored/{channel id}/file and then removes it.
[blizz-record]
exten => s,1,MixMonitor(/var/spool/asterisk/recording/${ARG1}.wav)
 same => n,Return()
