# Local development infrastructure only. Not a production profile.
name: blizz-taxi-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: blizz
      POSTGRES_USER: blizz
      POSTGRES_PASSWORD: blizz-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizz -d blizz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data:
