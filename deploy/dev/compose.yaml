# Local development infrastructure only. Not a production profile.
name: blizz-taxi-dev

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    environment:
      POSTGRES_DB: blizz
      POSTGRES_USER: blizz
      POSTGRES_PASSWORD: blizz-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizz -d blizz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
    ports:
      - "6379:6379"

  # One-time codes by a call (ADR 0012 Q-18): ARI on 8088. In the admin panel (Integrations → otp) set
  # ari-url http://localhost:8088 (http://asterisk:8088 from another container), user blizz, password
  # dev-only-ari-password, endpoint PJSIP/{phone}@trunk. Without a SIP trunk the call itself goes nowhere.
  # The admin panel refuses private addresses unless the server lists them: run it with
  # BLIZZ_OUTBOUND_PRIVATE_HOSTS=localhost,asterisk (REQ-SEC-05).
  asterisk:
    image: andrius/asterisk:latest@sha256:33f393eaa12001e5dcb1c8668d7fde6af13a2713e20901703346eeafcbf3c9d4
    ports:
      - "8088:8088"
    volumes:
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/logger.conf:/etc/asterisk/logger.conf:ro

volumes:
  postgres-data:
