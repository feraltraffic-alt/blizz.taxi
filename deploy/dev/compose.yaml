# Local development infrastructure only. Not a production profile.
name: blizz-taxi-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: blizz
      POSTGRES_USER: blizz
      POSTGRES_PASSWORD: blizz-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizz -d blizz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  # One-time codes by a call (ADR 0012 Q-18): ARI on 8088. In the admin panel (Integrations → otp) set
  # ari-url http://localhost:8088 (http://asterisk:8088 from another container), user blizz, password
  # dev-only-ari-password, endpoint PJSIP/{phone}@trunk. Without a SIP trunk the call itself goes nowhere.
  asterisk:
    image: andrius/asterisk:latest
    ports:
      - "8088:8088"
    volumes:
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/logger.conf:/etc/asterisk/logger.conf:ro

volumes:
  postgres-data:
