# Production (REQ-ENG-13). Every secret comes from the environment and has no default here: a missing one stops the
# start. platform's ProductionSafety refuses fake providers, any key published in this repository and a temporary
# erasure journal, and lists every problem at once. Never combine with dev, sandbox or test.
blizz:
  otp:
    secret: ${OTP_SECRET}
  auth:
    instance-id: ${INSTANCE_ID}
    access-token-secret: ${ACCESS_TOKEN_SECRET}
  secrets:
    master-key: ${SECRETS_MASTER_KEY}
  privacy:
    erasure-journal-dir: ${ERASURE_JOURNAL_DIR}
  payments:
    public-base-url: ${PUBLIC_BASE_URL}
spring:
  datasource:
    password: ${DB_PASSWORD}
logging:
  level:
    root: INFO
    taxi.blizz: INFO
server:
  # Behind the load balancer every request comes from its address: take the client's from X-Forwarded-For
  # (threat model A4), so rate limits per IP (one-time codes) count clients, not the balancer. Tomcat trusts the
  # header only from the private-network proxies of server.tomcat.remoteip.internal-proxies (the default: 10/8,
  # 172.16/12, 192.168/16, loopback); a request from anywhere else keeps its own address, so nobody spoofs it.
  forward-headers-strategy: native
