# Sandbox: a throw-away instance for trying the system by hand (deploy/sandbox, .github/workflows/sandbox.yml).
# Seeds fictional data and shows one-time codes at /sandbox/v1/otp. Never use these values or this profile for real data.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blizz}
    username: ${DB_USER:blizz}
    password: ${DB_PASSWORD:blizz-sandbox}
blizz:
  finance:
    invariants:
      interval: PT5S
  operations:
    invariants:
      interval: PT5S
  telephony:
    # Codes are kept for /sandbox/v1/otp; an SMS to a number ending in 0000 is refused, to show the fallback.
    otp-provider: FAKE
  otp:
    secret: ${OTP_SECRET:sandbox-only-otp-secret-not-for-real-use-0123}
    # Scripts and testers share one address; the SMS budget does not matter here.
    max-per-phone-per-hour: 100
    max-per-ip-per-hour: 5000
    max-per-device-per-hour: 500
    # Scenarios sign the same test drivers in one after another.
    resend-after: PT1S
  auth:
    instance-id: ${INSTANCE_ID:00000000-0000-4000-8000-00000000005a}
    access-token-secret: ${ACCESS_TOKEN_SECRET:sandbox-only-access-token-secret-not-for-real-use}
  staff:
    # The first super admin; the password must be changed at the first sign-in.
    bootstrap-login: ${STAFF_BOOTSTRAP_LOGIN:admin}
    bootstrap-password: ${STAFF_BOOTSTRAP_PASSWORD:Sandbox-Admin-2026}
  secrets:
    # Sandbox only: the keys typed into its panel protect nothing real.
    master-key: ${SECRETS_MASTER_KEY:BTafAxut8u7D3rruCvQv3xUre9M69sCDmY0XHITZGJA=}
  payments:
    invariants:
      interval: PT5S
    fake-merchants-allowed: true
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    secrets:
      sandbox: sandbox-fake-merchant-secret-not-for-real-use
  preorders:
    poll-interval: PT5S
  push:
    # Pushes are only logged; the sandbox has no Firebase project.
    provider: FAKE
  geocoding:
    # Address search through the fake provider; GOOGLE or VISICOM can be chosen in the sandbox's admin panel.
    provider: FAKE
logging:
  level:
    taxi.blizz: INFO
