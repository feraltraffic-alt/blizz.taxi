spring:
  application:
    name: blizz-taxi-server
  jackson:
    # API field names are snake_case (packages/contracts).
    property-naming-strategy: SNAKE_CASE
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blizz}
    username: ${DB_USER:blizz}
    password: ${DB_PASSWORD:}
    hikari:
      # Facts are stored in UTC (REQ-DATA-01) regardless of the server's local time zone.
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; ddl-auto=update is forbidden (REQ-DATA-12).
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  # Metrics and details on a port of their own that is never published (REQ-OBS-02, REQ-OBS-05); the main port
  # keeps only /livez and /readyz for the load balancer and the orchestrator.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
  health:
    readiness-state:
      enabled: true
  metrics:
    tags:
      application: blizz-taxi-server
    distribution:
      # Latency percentiles of the API (REQ-NFR-02: p95 targets) from histograms Prometheus can aggregate.
      percentiles-histogram:
        http.server.requests: true

blizz:
  telephony:
    # One-time codes by SMS (TurboSMS) and by a call (Asterisk) with the keys of the admin panel (ADR 0012 Q-18).
    otp-provider: ${OTP_PROVIDER:LIVE}
  otp:
    secret: ${OTP_SECRET:}
    # Country calling codes whose numbers get one-time codes (issue #101): Poland and Ukraine. Any other number is
    # refused, so expensive international routes cannot run up the SMS bill. Narrow it in an emergency, e.g. 380.
    allowed-country-codes: ${OTP_ALLOWED_COUNTRY_CODES:48,380}
  auth:
    instance-id: ${INSTANCE_ID:}
    access-token-secret: ${ACCESS_TOKEN_SECRET:}
  security:
    # Hosts in a private network that addresses typed in the admin panel may point to (REQ-SEC-05), comma-separated:
    # usually the service's own Asterisk. Loopback is private too; link-local (cloud metadata) is never allowed.
    outbound-private-hosts: ${BLIZZ_OUTBOUND_PRIVATE_HOSTS:}
  privacy:
    # The erasure journal (REQ-PRV-05, ADR 0013): a directory on durable storage of its own, NOT backed up together
    # with the database, so deletions made after a backup are applied again when that backup is restored.
    erasure-journal-dir: ${ERASURE_JOURNAL_DIR:${java.io.tmpdir}/blizz-erasure-journal}
  files:
    # Call recordings on a disk of their own (own backup and access rights); empty: below the files directory.
    call-recordings-dir: ${CALL_RECORDINGS_DIR:}
  secrets:
    # Encrypts the keys entered in the admin panel; 32 bytes in Base64 (openssl rand -base64 32). Keep it with the
    # backups of the database: without it the stored keys cannot be read.
    master-key: ${SECRETS_MASTER_KEY:}
  push:
    # Firebase Cloud Messaging of the service's own project (REQ-TEN-08). The keys are entered in the admin panel
    # (Integrations); the environment's are used when the panel has none.
    provider: ${PUSH_PROVIDER:FCM}
    fcm-project-id: ${FCM_PROJECT_ID:}
    fcm-credentials: ${FCM_CREDENTIALS:}

logging:
  pattern:
    # Every line carries the correlation id of its request or event (REQ-OBS-01).
    correlation: "[%X{correlation_id:-}] "
  # Stack traces go through the redaction of logback-spring.xml as the messages do (REQ-SEC-08).
  exception-conversion-word: "%redactedEx"
