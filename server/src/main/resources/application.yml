spring:
  application:
    name: blizz-taxi-server
  jackson:
    # API field names are snake_case (packages/contracts).
    property-naming-strategy: SNAKE_CASE
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blizz}
    username: ${DB_USER:blizz}
    password: ${DB_PASSWORD:}
    hikari:
      # Facts are stored in UTC (REQ-DATA-01) regardless of the server's local time zone.
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; ddl-auto=update is forbidden (REQ-DATA-12).
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

blizz:
  otp:
    secret: ${OTP_SECRET:}
  auth:
    instance-id: ${INSTANCE_ID:}
    access-token-secret: ${ACCESS_TOKEN_SECRET:}
  secrets:
    # Encrypts the keys entered in the admin panel; 32 bytes in Base64 (openssl rand -base64 32). Keep it with the
    # backups of the database: without it the stored keys cannot be read.
    master-key: ${SECRETS_MASTER_KEY:}
  push:
    # Firebase Cloud Messaging of the service's own project (REQ-TEN-08). The keys are entered in the admin panel
    # (Integrations); the environment's are used when the panel has none.
    provider: ${PUSH_PROVIDER:FCM}
    fcm-project-id: ${FCM_PROJECT_ID:}
    fcm-credentials: ${FCM_CREDENTIALS:}
