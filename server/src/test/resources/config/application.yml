# Tests drive the outbox relay explicitly instead of on a timer.
blizz:
  outbox:
    relay:
      enabled: false
  driver:
    expiry-check-enabled: false
  files:
    local-dir: ${java.io.tmpdir}/blizz-test-files
  dispatch:
    worker-enabled: false
  payments:
    public-base-url: http://blizz.test
    secrets:
      test: test-merchant-secret-0123456789
