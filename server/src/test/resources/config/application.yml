# Tests drive the outbox relay explicitly instead of on a timer.
blizz:
  operations:
    invariants:
      enabled: false
  location:
    retention:
      # Tests run the track clean-up themselves.
      sweep-enabled: false
  otp:
    # Tests read a code right after asking for it: send it in the request here.
    send-in-request: true
  telephony:
    otp-provider: FAKE
    # Tests close stale calls and fetch call recordings themselves.
    call-sweep-enabled: false
    recording-sweep-enabled: false
  outbox:
    relay:
      enabled: false
  driver:
    expiry-check-enabled: false
  files:
    local-dir: ${java.io.tmpdir}/blizz-test-files
  finance:
    worker-enabled: false
    invariants:
      enabled: false
  dispatch:
    worker-enabled: false
  secrets:
    # Tests only; every real instance has its own (REQ-ENG-13).
    master-key: OvNcyb/UEGrsbxNURayDR7cukvqN5pG5gLYhC2py82Q=
  push:
    provider: FAKE
    worker-enabled: false
  payments:
    invariants:
      enabled: false
    reconciliation:
      enabled: false
    fake-merchants-allowed: true
    public-base-url: http://blizz.test
    secrets:
      test: test-merchant-secret-0123456789
    worker-enabled: false
  rate-limits:
    # Tests make many requests as one rider or driver; RateLimitTests sets small budgets in its own context.
    buckets:
      quote: {max: 100000, window: PT1M}
      order: {max: 100000, window: PT1M}
      offer-accept: {max: 100000, window: PT1M}
      file-upload: {max: 100000, window: PT1M}
  live:
    # Live connections are rechecked every second, so a revoked session is seen closing quickly.
    recheck: PT1S
  security:
    # Fake Asterisk and GraphHopper servers of the tests listen on this machine.
    outbound-private-hosts: 127.0.0.1,localhost
  privacy:
    # Tests build the copies of personal data themselves (PersonalDataExports.buildPending).
    data-export-poll: PT1H
  reports:
    # Tests build exports themselves (ReportExports.buildPending), the scheduled worker stays out of their way.
    export-poll: PT1H
  geocoding:
    # Address search through the fake provider; real keys never reach the tests.
    provider: FAKE

management:
  server:
    # A free port per test context: several contexts with a web server run side by side.
    port: 0

